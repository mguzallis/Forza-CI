<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:sans-serif;padding:20px;background:#f5f5f5;}
h2{color:#1B3764;margin-bottom:20px;}
.btn{display:block;width:100%;padding:16px;background:#F16022;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:700;margin-bottom:16px;cursor:pointer;}
.result{background:#fff;border-radius:8px;padding:16px;border:2px solid #1B3764;min-height:80px;font-size:.9rem;color:#333;white-space:pre-wrap;}
img{max-width:100%;border-radius:8px;margin-top:10px;display:none;}
</style>
</head>
<body>
<h2>iOS Camera Test</h2>
<input type="file" id="f1" accept="image/*" capture="environment" style="display:none">
<button class="btn" onclick="document.getElementById('f1').click()">Test 1: Hidden input + JS click</button>

<label class="btn" for="f2">Test 2: Label pointing to input</label>
<input type="file" id="f2" accept="image/*" capture="environment" style="display:none">

<div style="position:relative;margin-bottom:16px;">
  <div class="btn" style="margin:0;">Test 3: Visible input overlay</div>
  <input type="file" id="f3" accept="image/*" capture="environment" 
    style="position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;">
</div>

<div class="result" id="out">Tap a button above. Result will appear here.</div>
<img id="preview">

<script>
function handleFile(f, label) {
  if(!f) { document.getElementById('out').textContent = label + ': No file returned'; return; }
  document.getElementById('out').textContent = label + ' WORKED!\nFile: ' + f.name + '\nSize: ' + f.size + ' bytes\nType: ' + f.type;
  var r = new FileReader();
  r.onload = function(e) {
    var img = document.getElementById('preview');
    img.src = e.target.result;
    img.style.display = 'block';
  };
  r.readAsDataURL(f);
}
document.getElementById('f1').onchange = function(e){ handleFile(e.target.files[0], 'Test 1 (JS click)'); };
document.getElementById('f2').onchange = function(e){ handleFile(e.target.files[0], 'Test 2 (label)'); };
document.getElementById('f3').onchange = function(e){ handleFile(e.target.files[0], 'Test 3 (overlay)'); };
document.getElementById('f1').oninput = function(e){ handleFile(e.target.files[0], 'Test 1 input event'); };
document.getElementById('f2').oninput = function(e){ handleFile(e.target.files[0], 'Test 2 input event'); };
document.getElementById('f3').oninput = function(e){ handleFile(e.target.files[0], 'Test 3 input event'); };
</script>
</body>
</html>
