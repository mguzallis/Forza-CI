@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
:root{--blue:#1B3764;--orange:#F16022;--rusty:#D35127;--grey:#BFBFBF;--surface:#F0F2F6;--border:#E0E4EA;--muted:#666;}
body{font-family:'Poppins',sans-serif;background:#fff;color:var(--blue);}
.app{max-width:900px;margin:0 auto;padding:24px 24px 0;}
.header{text-align:center;margin-bottom:16px;min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.logo{width:280px;max-width:80%;display:block;}
.app-title{font-family:'K','Poppins',sans-serif;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin-top:8px;margin-bottom:2px;}
.app-sub{font-size:.82rem;color:var(--muted);}
hr{border:none;border-top:1px solid var(--border);margin:14px 0;}
.tagline{text-align:center;font-family:'K','Poppins',sans-serif;font-size:.65rem;letter-spacing:.09em;text-transform:uppercase;margin:0 0 14px;}
.t1{color:var(--blue);}.t2{color:var(--grey);}.t3{color:var(--orange);}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--border);margin-bottom:20px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:9px 12px;font-size:.72rem;font-weight:600;color:#999;cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:0;transition:color .15s;font-family:'Poppins',sans-serif;white-space:nowrap;flex-shrink:0;}
.tab:hover{color:var(--blue);}.tab.active{color:var(--orange);border-bottom-color:var(--orange);}
.sec{display:none;padding-bottom:60px;}.sec.active{display:block;}
.slabel{display:block;font-family:'K','Poppins',sans-serif;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:7px;}
.srow{display:flex;gap:8px;}

var COMP=[{"id": "3m", "name": "3M", "brands": "Super 77 / Scotch-Weld / VHB / PU Sealants / Hot Melt", "hq": "Maplewood, MN", "rev": "$32B+", "threat": "HIGH", "pitch": "3M is a $32B+ diversified technology company. Their adhesive rep covers electronics, healthcare, traffic safety, and abrasives on the same call. Forza makes adhesives, sealants, and tapes only. Same performance, Iowa-made, direct manufacturer pricing, no 3M brand premium.", "msgs": [["To the Contractor", "3M Super 77 and Forza IC933/IC936 are the same multi-purpose spray chemistry. The 3M name adds a price premium. Forza is Iowa-made, direct manufacturer, and also supplies the sealant and tape for the same job."], ["To the Marine Fabricator", "3M 5200 is the gold standard for marine bonding. Forza M-OS789 covers the same structural marine sealant application at direct manufacturer pricing, plus MC739 for infusion spray. 3M does not make a canister spray adhesive."], ["To the Distributor", "Your margin on 3M is compressed. Forza is direct manufacturer, better margin, Iowa-made, same chemistry, and gives you the full shelf: adhesive, sealant, tape, and cleaner."]], "objections": [["3M Super 77 is what we have always used", "Forza IC933/IC936 covers the same application. Direct pricing, Iowa-made, and Forza also supplies sealant and tape for the same job on one PO."], ["3M 5200 is specced for marine", "Specced by name or chemistry? 3M 5200 is 1-part PU marine structural. Forza M-OS789 is the same chemistry. Let us compare TDS."], ["VHB is the only tape we trust", "Forza T-205/T-215/T-220 are UHB acrylic foam tapes. Forza publishes more ASTM data than 3M on the public TDS."], ["3M has the brand behind it", "3M brand is real. So is the premium. When the chemistry is equivalent, that premium goes to Maplewood, MN. With Forza it stays in your budget."]], "seeds": ["3M is a $32B+ diversified technology company. The rep calling with Super 77 also covers Scotch-Brite, traffic safety film, and Post-it Notes. Forza entire operation is adhesives, sealants, and tapes. That is the difference between a specialist and a line item in a conglomerate portfolio.", "3M brand premium is real and documented. Contractors pay it because 3M is convenient and trusted, not because the chemistry is different. Forza makes the same chemistry Iowa-made at direct manufacturer pricing.", "3M does not make a canister spray adhesive. Super 77 and HoldFast are aerosol and small-volume cans. Forza IC/MC/TC/RC canister system is purpose-built for production volume."], "landmines": [["Canister System", "Plant this: 3M aerosols work at retail and small-volume. For production volume, aerosol cans are the wrong format. Ask 3M: How many cans per month, and has anyone compared your total adhesive cost in aerosol versus a canister system at the same chemistry?"], ["Brand Premium", "Plant this: 3M brand premium is visible at every counter in town. Distributor margin is capped by brand price awareness. Ask 3M: What is your margin versus what you would make on a comparable product from a direct manufacturer?"], ["5200 Marine Sealant", "Plant this: 3M 5200 is among the most expensive marine sealants. The chemistry is not unique to 3M. Ask 3M: Is that a chemistry specification or a brand preference, and have you compared its TDS against a competing 1-part PU marine sealant?"], ["VHB Tape", "Plant this: Forza has built a full TDS comparison of T-205, T-215, and T-220 against VHB. Forza publishes more ASTM-tested data than 3M. Ask 3M: Have you compared the 3M VHB TDS against a competing UHB acrylic foam tape on peel, shear, and temperature?"], ["Technical Depth", "Plant this: 3M adhesive rep covers electronics, healthcare, traffic safety, and abrasives. Ask 3M: When you have a technical question on your spray adhesive, how specialized is the person who answers?"]], "wins": ["No 3M canister spray system - Forza IC/MC/TC/RC unchallenged", "Direct manufacturer pricing - no 3M brand premium", "Iowa-made vs. Maplewood MN", "Forza publishes more ASTM data than 3M on VHB TDS", "Single-source: adhesive + sealant + tape + cleaner"], "moats": ["Masking / electrical / strapping tapes - no Forza equivalent", "Scotch-Weld aerospace / electronics epoxies - outside Forza portfolio", "Automotive body filler and refinish - outside Forza portfolio"], "crosswalk": [{"sku": "Super 77 / 27 / 20", "app": "Multi-purpose aerosol spray", "ind": "IC933 / IC936"}, {"sku": "24 Foam & Fabric / Foam Fast 74", "app": "Foam, fabric, styrene safe", "ind": "IC947"}, {"sku": "76 Hi-Tack / HoldFast 70", "app": "High tack / high strength canister", "ind": "IC946 / IC947"}, {"sku": "Hi-Strength 90 / 94 CA", "app": "PSA laminating / CA compliant", "ind": "IC946"}, {"sku": "80 Rubber & Vinyl", "app": "Rubber and vinyl contact spray", "ind": "IC933"}, {"sku": "3M Spray 71", "app": "Composites mist spray infusion", "ind": "MC739"}, {"sku": "VHB GPH-060GF (0.6mm)", "app": "UHB acrylic foam tape gray", "ind": "T-205"}, {"sku": "VHB GPH-110GF (1.1mm)", "app": "UHB acrylic foam tape gray", "ind": "T-215"}, {"sku": "VHB 5952 (62mil Black)", "app": "UHB structural attachment", "ind": "T-220"}, {"sku": "Tape Primer 94 / 111", "app": "Adhesion primer for VHB", "ind": "OSA"}, {"sku": "5200 / 5200 FC", "app": "Marine structural PU sealant", "ind": "M-OS789 / M-OA755"}, {"sku": "4200 FC / 4000 UV", "app": "Marine adhesive sealant", "ind": "M-OS789 / M-OS796"}, {"sku": "560 PU / 550 FC", "app": "PU sealant, transportation/construction", "ind": "OA4 / OS2"}, {"sku": "MSP Seam Sealer 08374", "app": "SMP sprayable seam sealer", "ind": "OS2"}, {"sku": "DP8005 / DP810", "app": "2-part acrylic structural", "ind": "IC951"}, {"sku": "DP190 / 2214", "app": "2-part epoxy structural", "ind": "R160"}]}, {"id": "sika", "name": "Sika", "brands": "Sikaflex / SikaFast / Sika Aktivator / Sikasil", "hq": "Baar, Switzerland / Lyndhurst NJ", "rev": "CHF 11.76B", "threat": "HIGH", "pitch": "Sika is a CHF 11.76B Swiss construction chemistry platform. Their rep manages concrete, roofing, waterproofing, flooring, and pipeline alongside Sikaflex. Forza entire operation is adhesives, sealants, and tapes. Specialist vs. line item.", "msgs": [["To the Transportation Fabricator", "Sikaflex-252 and Forza T-OA156 are both 1-part hybrid polymer structural adhesives. Same chemistry, Iowa-made, and your Forza rep only job is adhesives and sealants."], ["To the Marine Fabricator", "Sikaflex-291 covers marine sealing. Forza M-OS789 covers the same application plus ForzaBond MC-series spray adhesive for foam and upholstery on the same build. Sika does not make a spray adhesive."], ["To the Distributor", "You carry Sikaflex for sealant. Sika makes no spray adhesive, no tape, no industrial cleaner. Forza fills all four from one Iowa manufacturer."]], "objections": [["Sikaflex-252 is specced on our vehicle line", "Specced by brand or chemistry? Sikaflex-252 and Forza T-OA156 are both 1-part moisture cure hybrid polymer structural adhesives. If chemistry-based, Forza qualifies."], ["Sikaflex-291 is what we use for marine", "ForzaBond M-OS789 covers the same marine sealing. Forza also supplies spray adhesive and tape for the same build. Sika cannot."], ["Sika Aktivator is already approved", "Both Sika Aktivator-100 and Forza OSA are IPA-based surface activators. Same chemistry, same application. Forza OSA qualifies."], ["Sika has global technical support", "Global support means a rep covering concrete, roofing, and flooring. Forza technical team covers adhesives, sealants, and tapes only. Council Bluffs, Iowa. Direct line."]], "seeds": ["Sikaflex is one product family inside a CHF 11.76 billion Swiss construction chemistry platform that also makes concrete admixtures, roofing systems, waterproofing, and flooring. Forza entire operation is adhesives, sealants, and tapes.", "Sika makes a great sealant. They do not make a spray adhesive, a bonding tape, or an industrial cleaner. The marine fabricator on Sikaflex-291 still needs spray adhesive for foam bonding on the same build. Sika cannot supply it.", "The Sika rep on your account is managing concrete, roofing, waterproofing, and flooring products alongside Sikaflex. At Forza, adhesives, sealants, and tapes are the whole company."], "landmines": [["Rep Specialization", "Plant this: Sika rep selling Sikaflex is the same rep responsible for concrete repair and roofing. Ask Sika: When you have a technical question about your Sikaflex application, how specialized is the person who answers?"], ["Sikaflex Chemistry", "Plant this: Sikaflex-252 and Forza T-OA156 are the same application chemistry, same substrate range, Iowa-made. Ask Sika: Is that a chemistry specification or a brand preference?"], ["Spray Adhesive Gap", "Plant this: Sika makes zero spray adhesive. A marine fabricator using Sikaflex for sealing still needs spray adhesive for foam bonding. Ask Sika: For the foam bonding on the same build, what spray adhesive are you using?"], ["Domestic Content", "Plant this: Sika is headquartered in Switzerland, US HQ New Jersey. No Midwest manufacturing. Ask Sika: Where is Sikaflex manufactured for the US market?"], ["Aktivator Chemistry", "Plant this: Sika Aktivator-100 and Forza OSA are both IPA-based surface activators. Same chemistry. Ask Sika: Is the Aktivator specified by brand name or by chemistry?"]], "wins": ["Sika makes ZERO spray adhesives", "Sika makes ZERO tapes - Forza 22 SKUs unchallenged", "Iowa-made vs. Swiss-owned, US HQ New Jersey", "Entry: sell spray adhesive first, earn sealant conversation", "Single-source: four categories vs. Sika sealant-only"], "moats": ["Concrete admixtures, repair, roofing, waterproofing - outside Forza", "SikaLastomer butyl sealants - no Forza butyl equivalent", "SikaDamp NVH / SikaPower heat-cure OEM - outside Forza", "SikaMelt hot melt lamination - different application"], "crosswalk": [{"sku": "Sikaflex-221", "app": "Multi-purpose sealant", "ind": "OS2"}, {"sku": "Sikaflex-252", "app": "Vehicle assembly structural", "ind": "OA4"}, {"sku": "Sikaflex-255 FC", "app": "CV direct glazing fast cure", "ind": "OA4"}, {"sku": "Sikaflex-291 / 291 LOT", "app": "Marine multifunctional / long OT", "ind": "M-OS789 / M-OS796"}, {"sku": "Sikaflex-292i", "app": "Marine structural bonding", "ind": "M-OA755 / M-OS789"}, {"sku": "Sikaflex-505 UV / 521 UV", "app": "STP/MS polymer, UV resistant", "ind": "OS2"}, {"sku": "Sikaflex-510 AM50", "app": "Isocyanate-free low modulus", "ind": "OS2"}, {"sku": "Sikaflex-552", "app": "Assembly, reduced substrate prep", "ind": "OA4"}, {"sku": "SikaFast-3121 / 321 S", "app": "Fast cure toughened MMA", "ind": "IC951"}, {"sku": "SikaFast-3511 / 3531", "app": "High strength MMA", "ind": "IC951"}, {"sku": "SikaFast-3311 / 3341", "app": "Low-medium modulus MMA", "ind": "IC951"}, {"sku": "Sika Aktivator-100 / 205", "app": "IPA surface activator, pre-bond", "ind": "OSA"}, {"sku": "Sika Primer-206 G+P", "app": "Concrete/porous substrate primer", "ind": "OSA"}, {"sku": "Sikasil GP-101 / N Plus", "app": "General purpose silicone", "ind": "OS35"}, {"sku": "Sikasil AS-785", "app": "Automotive assembly silicone", "ind": "OS35"}]}, {"id": "henkel", "name": "Henkel", "brands": "Loctite / Teroson / Technomelt / Bonderite", "hq": "Dusseldorf, Germany", "rev": "$11B+ adhesives", "threat": "HIGH", "pitch": "Loctite is a $10B+ German conglomerate sold through a multi-tier distribution chain. Forza is a family-owned manufacturer in Council Bluffs, Iowa. When you call Forza, you get the chemist. When you call Loctite, you get a distributor rep. Forza has won business directly from Loctite.", "msgs": [["To the Structural Adhesive Buyer", "Loctite H8000 is a proven methacrylate. So is Forza IC951 and TC471. The difference: when you have a technical question, you call Forza and get an Iowa chemist. You call Loctite and get a distributor."], ["To the Transportation Sealant Buyer", "Teroson MS 930 and Forza T-OS151 are both 1-part MS polymer sealants. Same chemistry, same application. Direct manufacturer pricing vs. distributor margin."], ["To the Distributor", "You are selling Loctite at distributor margin. Forza is a direct manufacturer. Same chemistries, better margin, Iowa-made, and your customers get direct technical support."]], "objections": [["Loctite is the industry standard", "Standard means familiar, not optimal. Forza IC951 and TC471 match Loctite H8000 chemistry and have displaced it in the field."], ["We have been specced on Loctite", "Specced by chemistry or brand name? Most specs call for 2-part methacrylate. Forza IC951 meets the same chemistry requirement."], ["Teroson is approved on our trailer line", "Approved by chemistry or by name? Teroson MS 930 is 1-part SMP, so is Forza T-OS151. If the spec is chemistry-based, Forza qualifies."], ["Henkel has global technical support", "Global support means a ticket system and a distributor in the middle. Forza technical team is in Council Bluffs, IA. Direct line. Same day."]], "seeds": ["Loctite is the world largest adhesive brand, owned by a $20B+ German conglomerate with 50,000+ employees. A multi-tier distribution chain and ticket-queue technical support. Forza is family-owned in Council Bluffs, Iowa. When you call with a structural bond problem at 7am, you get a chemist.", "Teroson MS polymer sealants and Forza T-OS151 are the same chemistry: 1-part moisture cure SMP. Teroson is a Henkel brand sold through industrial distribution at distributor margin. Forza is the manufacturer. Same chemistry, direct pricing, Iowa-made.", "Henkel US distribution is built around Fastenal and Grainger. Every relationship has a margin layer between Henkel and the end customer. Forza sells direct."], "landmines": [["Distribution Chain", "Plant this: Loctite is distributed through a multi-tier chain. Every tier adds margin and removes direct manufacturer access. Ask Loctite: How long does it take to get a chemist on the phone versus a distributor rep?"], ["Chemistry Spec", "Plant this: Loctite H8000 is specified by name on a lot of drawings. Most engineers specced it by name because it was the first 2-part methacrylate they qualified. Ask Loctite: Is the H8000 requirement specced by brand name or by chemistry?"], ["Teroson Chemistry", "Plant this: Teroson MS polymer and Forza T-OS151 are the same chemistry. Ask Teroson: Is that a chemistry specification or a brand preference?"], ["Rep Coverage", "Plant this: A Loctite rep calling on a transportation fabricator is the same rep calling on a semiconductor plant. Ask Loctite: How many different industries does your rep cover?"], ["Technomelt Cost", "Plant this: The contractor buying Technomelt through distribution is paying three margin layers for a product with a domestic equivalent. Ask Technomelt: Have you compared total delivered cost against a domestically manufactured equivalent sourced direct?"]], "wins": ["Iowa family manufacturer vs. German conglomerate", "Forza has won business directly from Loctite accounts", "Direct manufacturer relationship - chemist on the phone", "ForzaTape: Loctite has no tape product line", "RuggedRed: Henkel has no industrial cleaner brand"], "moats": ["Loctite threadlockers - no Forza equivalent", "Loctite anaerobic sealants - no Forza equivalent", "Teroson RB rubber seam sealer - narrow automotive OEM", "Bonderite metal treatment / phosphating - outside Forza"], "crosswalk": [{"sku": "H8000 / H8003 / H8100", "app": "2-part methacrylate structural", "ind": "IC951"}, {"sku": "H8600 / H8610", "app": "Galvanized steel structural", "ind": "IC951"}, {"sku": "H3300 SpeedBonder", "app": "Automotive-grade 2-part MMA", "ind": "IC951"}, {"sku": "H4500", "app": "Thixotropic 2-part MMA", "ind": "IC951"}, {"sku": "E-05MR / E-20HP", "app": "2-part epoxy structural", "ind": "R160"}, {"sku": "Loctite 401 / 406 / 495", "app": "Instant/CA adhesive", "ind": "CA1000 / CA1500"}, {"sku": "Loctite 4203", "app": "CA elastomer modified", "ind": "CA2400"}, {"sku": "SI 5900 / 5910", "app": "RTV silicone gasketing", "ind": "OS35"}, {"sku": "Teroson MS 930NA / 939", "app": "1-part SMP sealant, primerless", "ind": "OS2"}, {"sku": "Teroson MS 9222 / 9381", "app": "SMP cargo/heavy equipment", "ind": "OA4"}, {"sku": "Teroson PU 8596 / 8598", "app": "1-part PU transportation", "ind": "OA4"}, {"sku": "Technomelt 0450", "app": "Foam/fabric/EPS hot melt", "ind": "H103 / H176"}, {"sku": "Technomelt SUPRA EVA", "app": "Packaging hot melt", "ind": "H117 / H163"}, {"sku": "Technomelt PUR", "app": "Reactive PU hot melt", "ind": "H167"}, {"sku": "Bonderite C-IC 8200", "app": "IPA cleaner/activator, pre-bond", "ind": "OSA"}]}, {"id": "manus", "name": "Manus Products", "brands": "Manus-Bond STP / Silicone / PU", "hq": "Waconia, MN", "rev": "Independent / Private", "threat": "MODERATE-HIGH", "pitch": "Manus is a Midwest sealant manufacturer, ISO 9001, 65+ years, Waconia, MN. Solid sealant line, zero spray adhesives, zero tapes, zero industrial cleaners. Every contractor buying Manus 75-AM still needs bonding tape and cleaner for the same job. Forza supplies all four from Council Bluffs, Iowa.", "msgs": [["To the Construction Contractor", "Manus 75-AM and Forza OS2/C-OS9 are both STP polyether sealants. Same chemistry. Forza also supplies bonding tape and surface cleaner for the same job. Manus cannot."], ["To the Transportation Fabricator", "Manus 75-AM-HV and Forza T-OA156 are both high green strength STP for transportation assembly. Forza also supplies bonding tape and spray adhesive for the same build. Manus makes neither."], ["To the Distributor", "You carry Manus for sealant. Your customer still needs bonding tape and cleaner from a second supplier. Forza fills all four from one Iowa manufacturer."]], "objections": [["Manus 75-AM is what we have always used", "Forza OS2/C-OS9 is the same STP polyether chemistry. Forza also supplies bonding tape and cleaner for the same job on the same PO."], ["Manus has more sealant variants", "True. Their 75-AM family is deep. Where Manus cannot follow is tape, spray adhesive, and cleaner."], ["Manus is also a Midwest manufacturer", "They are. Waconia, MN. Forza is Council Bluffs, Iowa. The difference is Forza makes adhesive, sealant, tape, and cleaner. Manus makes two of those four."], ["Manus does not serve Marine", "Correct. Manus has no Marine vertical. Forza M-OS789 and MC-series cover every marine sealing and bonding application."]], "seeds": ["Manus Products is an independent sealant manufacturer in Waconia, MN. 65 years in business, ISO 9001. They make zero spray adhesives, zero tapes, and no industrial cleaner line. Every contractor buying Manus still needs all three from somewhere else.", "The small Midwest manufacturer story is Manus story too. You cannot out-Midwest them on geography. What you can do is out-breadth them: Forza makes adhesive, sealant, tape, and cleaner. Manus makes two of those four.", "Manus has no Marine vertical and no Composites vertical. Zero products, zero coverage. Every marine fabricator and composites shop is already buying from someone other than Manus."], "landmines": [["Full Job Supply", "Plant this: The contractor buying Manus 75-AM still needs bonding tape, spray adhesive, and surface cleaner for the same job. Ask Manus: For a job that needs sealant, bonding tape, spray adhesive, and surface cleaner, how many separate suppliers are you ordering from?"], ["STP Depth vs Breadth", "Plant this: Manus 75-AM has 30+ variants. All built around sealants and adhesives. Forza covers the same chemistry plus the tape and cleaner Manus cannot supply. Ask Manus: For jobs where you need bonding tape and cleaner, are those coming from Manus or a separate supplier?"], ["Marine and Composites", "Plant this: Manus has no Marine vertical and no Composites vertical. Ask Manus: For your marine and composites customers, what are they buying for sealant and adhesive?"], ["Single Source", "Plant this: Most contractors buying Manus have never asked whether one manufacturer could supply sealant, bonding tape, and surface cleaner from the same source. Ask Manus: Has any supplier ever offered to also supply your bonding tape and cleaner from the same manufacturer?"], ["Spray Adhesive Gap", "Plant this: Manus makes no spray adhesive. Ask Manus: For spray adhesive on the same jobs where you are using Manus sealant, is that coming from Manus or a second supplier?"]], "wins": ["Forza makes spray adhesives - Manus makes ZERO", "Forza makes tapes - Manus makes ZERO", "RuggedRed cleaners - Manus has no cleaner line", "Marine vertical - Manus has no Marine products at all", "Single-source: four categories vs. Manus two"], "moats": ["Butyl sealant line - no Forza butyl equivalent", "Acrylic latex caulk line - no Forza latex equivalent", "PU foam sealant line - no Forza equivalent", "75-AM variant depth (30+ SKUs)"], "crosswalk": [{"sku": "75-AM All Purpose", "app": "Multi-surface STP sealant/adhesive", "ind": "OS2"}, {"sku": "75-AM-HV High Green Strength", "app": "Transportation high tack bonding", "ind": "OA4"}, {"sku": "75-AM-FS Fast Skinning", "app": "Transportation seam / fast skin", "ind": "OS2"}, {"sku": "75-AM-FC Fast Cure", "app": "Fast cure construction/transport", "ind": "OS2"}, {"sku": "75-AM-MA-XX Marine Xtreme", "app": "Marine sealing and bonding", "ind": "M-OS789 / M-OS796"}, {"sku": "75-AM-XX Xtreme Xterior", "app": "UV resistant exterior sealant", "ind": "OS2"}, {"sku": "75-AMC / 75-AMC-XC", "app": "Concrete joint / Xtreme Construction", "ind": "OS2"}, {"sku": "76-AM Self-Leveling", "app": "Self-leveling joint sealant", "ind": "OS2"}, {"sku": "77-AMP / 77-HR", "app": "Polyurethane / modified PU", "ind": "OA4"}, {"sku": "73-A / 73-GP / 75-A", "app": "General purpose / FDA silicone", "ind": "OS35"}, {"sku": "33-MS", "app": "MS Polymer ASTM C920 hybrid", "ind": "OS2"}, {"sku": "FW-15-NS Flex-Weld", "app": "Epoxy hybrid, UV resistant", "ind": "R160"}]}, {"id": "quin", "name": "Quin Global Americas", "brands": "Tensorgrip / QDEK", "hq": "UK HQ / Omaha NE", "rev": "Global / Private", "threat": "HIGH", "pitch": "Quin Global Americas runs a UK-headquartered spray adhesive operation out of Omaha, same metro as Forza. Their canister system is compatible with Forza hardware. The switch from Tensorgrip to Forza is a product decision, not a hardware decision.", "msgs": [["To the Industrial Contractor", "Your canister gun already runs ForzaBond. The chemistry is the same application range as Tensorgrip P-series, Iowa-made, and Forza also supplies sealant and tape for the same job. Quin cannot."], ["To the Marine Fabricator", "Tensorgrip M-series covers marine spray adhesive. So does ForzaBond MC-series, same applications, Iowa-made, and the gun already runs Forza. Add ForzaSeal marine sealant on the same order."], ["To the Distributor", "Your customers guns already run ForzaBond. Add Forza and you add sealant, tape, and cleaner to the same shelf without asking your customer to change equipment."]], "objections": [["Tensorgrip is what we have always run", "Your canister system already runs ForzaBond. The switch is a product decision, not a hardware decision. ForzaBond IC/MC/TC-series covers the same applications plus sealant and tape."], ["Quin is local, they are in Omaha", "Forza is in Council Bluffs, Iowa, same metro. And Forza is Iowa-made, family-owned. Quin Global is a UK-headquartered company operating a US sales office."], ["Tensorgrip has 100+ distributors", "The question is who gives the distributor a complete shelf: adhesive, sealant, tape, and cleaner. Quin can only fill one of those four."], ["Quin has a good marine line", "Tensorgrip M-series is solid. ForzaBond MC-series covers the same marine adhesive applications plus ForzaSeal marine sealant and ForzaTape. Quin cannot."]], "seeds": ["The canister system is compatible with Forza hardware, which means a contractor on Tensorgrip can run ForzaBond adhesive tomorrow without changing a single piece of equipment. The switch is a product decision, not an infrastructure decision.", "Quin Global Americas operates out of Omaha, Nebraska. Forza is in Council Bluffs, Iowa, same metro, same regional distributors, same contractor base. The difference is Quin is a UK-headquartered global company. Forza is a family-owned Iowa manufacturer.", "Quin makes adhesives only. They make zero sealants, zero tapes, and no industrial cleaner. Every contractor buying Tensorgrip still needs all three from somewhere else. Forza supplies all four, and the gun already runs Forza."], "landmines": [["Canister Compatibility", "Plant this: A contractor currently running Tensorgrip can load ForzaBond in the same gun tomorrow, no hardware change. Ask Quin: Has anyone told you that your existing canister gun is compatible with ForzaBond, meaning the switch is purely a product decision?"], ["Full Job Supply", "Plant this: The contractor buying Tensorgrip P-series still needs sealant, bonding tape, and surface cleaner for the same job. Ask Quin: For a job that needs spray adhesive, sealant, bonding tape, and cleaner, how many separate suppliers are you ordering from?"], ["Domestic Content", "Plant this: Quin Global is headquartered in the UK. Their US entity is a sales office in Omaha. Ask Quin: Where is Tensorgrip actually manufactured, which country, which facility?"], ["Marine Gap", "Plant this: Forza also supplies ForzaSeal marine sealant and ForzaTape for the same boat build. Ask Quin: For sealant and bonding tape on the same build where you are using Tensorgrip, is that coming from Quin or a separate supplier?"], ["EPO Reefer", "Plant this: Quin EPO-series is for reefer trailer repair only. Forza covers the same applications plus the full Transportation vertical. Ask Quin: For a reefer trailer repair job, what are you using for sealant, bonding tape, and surface primer?"]], "wins": ["Compatible canister system, the switch is a product decision not hardware", "ForzaSeal: 24 sealant SKUs. Quin makes ZERO sealants", "ForzaTape: 22 tape SKUs. Quin makes ZERO tapes", "Iowa-made vs. UK-headquartered US sales office", "Single-source: four categories vs. Quin one"], "moats": ["QDEK roofing adhesive, no Forza roofing spray equivalent", "100+ US distributor relationships, established footprint", "Marine M-series is solid, established in the channel"], "crosswalk": [{"sku": "P390 Non-Flam", "app": "Industrial non-flam HAPs-free contact", "ind": "IC932"}, {"sku": "P307 / P313 Low VOC CA", "app": "Industrial low VOC canister spray", "ind": "IC936"}, {"sku": "P308 High Tack CA", "app": "Industrial high tack contact", "ind": "IC933"}, {"sku": "P315 High Temp", "app": "Industrial high temp contact", "ind": "IC934 / IC946"}, {"sku": "P322 / P323 Fast Dry PSA", "app": "Industrial PSA web spray", "ind": "IC946 / IC947"}, {"sku": "P321 Polystyrene Foam", "app": "EPS / polystyrene foam bonding", "ind": "IC947"}, {"sku": "M87 / M88 Marine GP", "app": "Marine non-flam / general purpose", "ind": "MC722 / MC723 / MC724"}, {"sku": "M70 / M60 Marine Low VOC", "app": "Marine low VOC contact spray", "ind": "MC722 / MC723"}, {"sku": "M52 / M50 Marine PSA", "app": "Marine high temp and fast dry PSA", "ind": "MC736"}, {"sku": "M55 / M31 / M30 Infusion", "app": "Marine infusion / mold adhesive", "ind": "MC741"}, {"sku": "EPO-ZF Zero-Flam", "app": "Reefer trailer repair, zero flam", "ind": "IC932"}, {"sku": "EPO-CA", "app": "Reefer trailer repair adhesive", "ind": "IC932"}, {"sku": "EPO-CAL Low VOC", "app": "Low VOC reefer repair", "ind": "IC936 / IC946"}]}, {"id": "newstar", "name": "NewStar Adhesives", "brands": "EverStrong / EverHold / EverBond", "hq": "Massachusetts", "rev": "Independent / Private", "threat": "MODERATE", "pitch": "NewStar does one thing, contact and spray adhesives. They are proud of it. But every contractor buying EverStrong still needs sealant, tape, and cleaner for the same job. Forza makes the adhesive and everything else from Council Bluffs, Iowa.", "msgs": [["To the Industrial Contractor", "EverStrong is a solid spray adhesive. The moment you need sealant, tape, or cleaner for the same job, you are calling someone else. ForzaBond covers the same applications, Iowa-made, and gives you the rest from one manufacturer."], ["To the Distributor", "You carry NewStar for adhesive. You have no sealant, tape, or cleaner to put next to it. Forza fills all four categories and the adhesive competes directly with EverStrong across every application."]], "objections": [["EverStrong is what we have always used", "ForzaBond IC/MC-series covers the same substrates. The difference is you get sealant, tape, and cleaner from the same manufacturer on the same PO."], ["NewStar canister return program saves money", "Returnable canisters require return freight scheduling and tracking. Forza ships standard with no return logistics. Compare total cost of ownership, not just unit cost."], ["NewStar specializes, that is better", "Forza adhesive line has been in market since 1979. Specialization is their pitch. Single-source supply is ours."]], "seeds": ["NewStar makes a great contact and spray adhesive. EverStrong has been in the market for decades and performs. But they make adhesives. The contractor buying ES10+ still needs sealant, tape, and cleaner. NewStar cannot supply any of it.", "NewStar returnable canister program is a real feature and a real logistics dependency. Return freight, scheduling, tracking, overhead on every canister. Forza ships standard packaging with no return program required.", "NewStar is headquartered in Massachusetts with operations in Georgia and North Carolina. No Midwest manufacturing. Forza is manufactured 100% in Council Bluffs, Iowa, every SKU."], "landmines": [["Single Source", "Plant this: NewStar tagline is We do one thing and we do it well. That is their ceiling. Ask NewStar: For a job that needs spray adhesive, sealant, bonding tape, and surface cleaner, how many separate suppliers are you currently ordering from?"], ["Canister Return Cost", "Plant this: Returnable canisters require coordinated return freight, tracking, and scheduling. That overhead does not appear in the unit cost. Ask NewStar: What does the full return process cost in time and labor per month?"], ["Geography", "Plant this: NewStar operates out of Massachusetts, Georgia, and North Carolina. Ask NewStar: Where is EverStrong actually manufactured, which facility, which state?"], ["Cross-Category Support", "Plant this: NewStar technical support is built around one category. Ask NewStar: If I have a question about how my spray adhesive interacts with the sealant and tape on the same assembly, does NewStar have technical support for that?"], ["EverBond Private Label", "Plant this: NewStar EverBond is a private-label version of EverStrong chemistry with a distributor margin stacked on top. Ask NewStar: Do you know who actually manufactures the adhesive you are buying?"]], "wins": ["Single-source: Forza supplies 4 categories vs. NewStar 1", "Iowa-made vs. MA/GA/NC manufacturing", "ForzaBond covers every EverStrong application", "EverBond private-label, distributors may not know it is NewStar", "No canister return logistics dependency with Forza"], "moats": ["EverStrong brand recognition in industrial/marine channel", "EverHold well-established in marine fabrication shops", "30+ years of adhesive-specialist positioning", "Pionite/Nevamar HPL channel relationships deeply entrenched"], "crosswalk": [{"sku": "ES10+ / ES10 ZERO", "app": "Industrial contact spray", "ind": "IC932 / IC933 / IC936"}, {"sku": "ES20 / ES25 / ES36", "app": "High strength contact", "ind": "IC933 / IC934"}, {"sku": "ES55 / ES60 / ES80", "app": "Heavy duty laminating", "ind": "IC946 / IC947 / IC951"}, {"sku": "ES99 / ES99 LVoc", "app": "Low VOC spray adhesive", "ind": "IC936 / IC946"}, {"sku": "ES40 EPS Foam", "app": "EPS foam bonding", "ind": "IC947"}, {"sku": "N600 / N610 / N614", "app": "Marine foam and upholstery", "ind": "MC722 / MC723 / MC724"}, {"sku": "N620 / N677", "app": "Marine structural laminating", "ind": "MC736 / MC737"}, {"sku": "N900 / N901", "app": "Vacuum infusion / mold", "ind": "MC741"}, {"sku": "NCC Citrus Cleaner", "app": "Adhesive cleaner", "ind": "RuggedRed Citrus"}]}];
var EXEC=[{"id": "3m", "name": "3M", "brands": "Super 77 / Scotch-Weld / VHB / PU Sealants / Hot Melt", "hq": "Maplewood, MN", "rev": "$32B+", "threat": "HIGH", "glance": [["Annual Revenue", "$32B+"], ["Employees", "95,000+"], ["Countries", "70+"], ["Adhesive Division", "~$5B revenue"], ["Distribution", "Fastenal, Grainger, MSC - no direct sales"]], "overview": "3M Company (NYSE: MMM) is headquartered in Maplewood, Minnesota. Founded in 1902, it operates across five business segments: Safety and Industrial, Transportation and Electronics, Healthcare, Consumer, and Corporate. The adhesive and sealant products relevant to Forza fall primarily within the Safety and Industrial segment. 3M sells through industrial distributors including Fastenal, Grainger, and MSC - their model is distributor-driven at every level.", "key_context": "3M is the most recognized adhesive and sealant brand in the market. That recognition comes with a real price premium built into every product. The premium is paid for familiarity, not for chemistry that is unavailable elsewhere. Forza makes equivalent chemistry - Iowa-made, at direct manufacturer pricing, with no distributor margin layer between Forza and the customer.", "brands_detail": [["3M Spray Adhesives", "Super 77, 27, 20, 24, HoldFast 70, Hi-Strength 90/94, Foam Fast 74, Spray 71", "ForzaBond IC/MC/TC/RC spray adhesive canister system"], ["3M VHB Tapes", "GPH-060GF, GPH-110GF, VHB 5952, 4950, CV62F", "ForzaTape T-205, T-215, T-220 / T-T415, T-T420, TAC-T700"], ["3M Marine Sealants", "5200, 5200 Fast Cure, 4200 FC, 4000 UV", "ForzaSeal M-OS789, M-OS796, ForzaBond M-OA755"], ["3M PU/SMP Sealants", "560, 550 FC, 525, MSP Seam Sealer 08374, Scotch-Seal 800", "ForzaSeal T-OS151, T-OA156, C-OS9, C-OS55, OS2"], ["Scotch-Weld Structural", "DP8005, DP810 (2-part acrylic), DP190, 2214 (epoxy)", "ForzaBond IC951, TC471, R160"], ["3M Tape Primers", "Tape Primer 94, Surface Primer 111", "ForzaBond OSA, T-OSA155, R-OSA"]], "wins": ["Volume spray adhesive accounts running production-format canisters - 3M aerosols are the wrong format", "Distributors seeking better margin - 3M price is known everywhere, margin is compressed", "Accounts that value published ASTM performance data - Forza publishes more than 3M on VHB equivalents", "Accounts with domestic content requirements - Iowa-made, every SKU", "Marine fabricators who also need spray adhesive - 3M has no canister spray adhesive", "Single-source accounts - adhesives + sealants + tapes + cleaners from one Iowa manufacturer"], "moats": ["Spec'd-by-name accounts - 3M VHB and 3M 5200 written into drawings by brand name", "High-volume masking, electrical, and specialty tape categories - no Forza equivalent", "Aerospace and electronics structural adhesives - outside Forza portfolio", "Automotive refinish and body repair - outside Forza portfolio"], "assessment": "3M's competitive strength against Forza is not rooted in superior chemistry. In every Forza-relevant category - spray adhesives, VHB/UHB tapes, marine sealants, PU sealants, structural adhesives - Forza makes a direct chemistry equivalent. The threat is rooted in brand recognition, distribution ubiquity, and the inertia of existing specifications and shelf positions. The brand premium is 3M's greatest strength and its most exploitable vulnerability. Contractors and distributors pay it because 3M is familiar and convenient - not because the chemistry is unavailable elsewhere. The moment a prospect asks the price comparison question with their eyes open, Forza wins on value.", "bottom_line": "3M is the strongest brand competitor Forza faces in any market. Their advantage is recognition and distribution ubiquity - not chemistry. In every category where Forza and 3M compete directly, Forza offers equivalent performance at direct manufacturer pricing, with more published data transparency, from an Iowa manufacturer whose entire focus is adhesives, sealants, and tapes."}, {"id": "sika", "name": "Sika", "brands": "Sikaflex / SikaFast / Sika Aktivator / Sikasil", "hq": "Baar, Switzerland / Lyndhurst NJ", "rev": "CHF 11.76B", "threat": "HIGH", "glance": [["Headquarters", "Baar, Switzerland / US HQ: Lyndhurst, NJ"], ["Annual Revenue", "CHF 11.76 billion (2024)"], ["Employees", "34,000+ globally / 400+ facilities"], ["Business Model", "Full construction chemistry platform"], ["Out of Scope", "Concrete, roofing, waterproofing, flooring, pipeline"]], "overview": "Sika AG is a global specialty chemistry company headquartered in Baar, Switzerland. Their CHF 11.76 billion platform spans concrete admixtures, roofing, waterproofing, flooring, and pipeline alongside their adhesive and sealant brands. The rep calling on a transportation fabricator with Sikaflex is the same rep managing concrete admixtures and roofing systems on the next call.", "key_context": "Sika's CHF 11.76 billion construction chemistry platform spans concrete, roofing, waterproofing, flooring, and pipeline alongside Sikaflex. The rep calling on a transportation fabricator is the same rep managing concrete admixtures and roofing systems on the next call. Forza's entire operation is adhesives, sealants, and tapes. Specialist vs. line item.", "brands_detail": [["Sikaflex", "Sikaflex-252 (vehicle assembly), -221 (multi-purpose), -291 (marine), -292i (marine structural), -505 UV, -521 UV", "ForzaSeal T-OA156, OS2, M-OS789, M-OA755, C-OS55, T-OS151"], ["SikaFast", "SikaFast-3121, 3511, 3531, 3551 - 2-part toughened MMA structural", "ForzaBond IC951, TC471"], ["Sika Aktivator", "Aktivator-100, Aktivator-205 - IPA-based surface activators", "Forza OSA, T-OSA155, R-OSA, M-OSA783, C-OSA"], ["Sikasil", "GP-101, N Plus (neutral cure), AS-785 (automotive/transportation silicone)", "ForzaSeal OS35, OS37, OS45, TAC-OS75"]], "wins": ["Sika makes ZERO spray adhesives - ForzaBond IC/MC/TC/RC canister system unchallenged", "Sika makes ZERO tape products - ForzaTape 22 SKUs unchallenged", "RuggedRed: Sika has no industrial cleaner brand", "Iowa-made. Sika is Swiss-owned, US HQ Lyndhurst NJ - no Midwest manufacturing", "Single-source: adhesives + sealants + tapes + cleaners from one Iowa manufacturer", "Sikaflex-252 vs. T-OA156: same 1-part hybrid polymer chemistry, Forza direct pricing"], "moats": ["Sikaflex is one of the most recognized sealant brands in Transportation and Marine", "Sikaflex-252 is widely specified for vehicle assembly bonding", "Sikaflex-291 is the benchmark marine multi-purpose sealant in most marine shops", "SikaFast MMA structural is specified in composites and specialty vehicle OEM", "Concrete, roofing, waterproofing, flooring - categories entirely outside Forza"], "assessment": "Sikaflex is the most recognized sealant brand in the transportation and marine fabrication channel. Sikaflex-252 for vehicle assembly and Sikaflex-291 for marine multi-purpose are deeply entrenched shelf positions. Most fabricators have been on these products for years and have never evaluated a chemistry-equivalent alternative. The no-spray-adhesive gap is Sika's largest structural vulnerability. A marine fabricator or transportation OEM on Sikaflex is already buying spray adhesive from a second supplier on every job. That second supplier conversation is Forza's entry point.", "bottom_line": "Sikaflex is the benchmark sealant in Transportation and Marine. Forza's entry strategy is not to displace Sikaflex directly on the first call - it is to become the spray adhesive and tape supplier for the same job, then earn the sealant conversation. Sika cannot follow Forza into those categories."}, {"id": "henkel", "name": "Henkel", "brands": "Loctite / Teroson / Technomelt / Bonderite", "hq": "Dusseldorf, Germany", "rev": "$11B+ adhesives", "threat": "HIGH", "glance": [["Headquarters", "Dusseldorf, Germany (NYSE: HENKY)"], ["Adhesive Revenue", "$11B+ annually - world's largest adhesive manufacturer"], ["Employees", "50,000+ in adhesive division"], ["Core Brands", "Loctite, Teroson, Technomelt, Bonderite"], ["Distribution", "Multi-tier: Fastenal, Grainger, industrial distributors"]], "overview": "Henkel Adhesive Technologies is the world's largest adhesive manufacturer, headquartered in Dusseldorf, Germany. Their adhesive division generates over $11 billion in annual revenue across electronics, automotive OEM, packaging, construction, and industrial markets. In the US, Henkel sells through multi-tier industrial distribution including Fastenal, Grainger, and MSC. Every transaction has a margin layer between Henkel and the end customer.", "key_context": "Henkel is the world's largest adhesive manufacturer. Their competitive strength against Forza is not rooted in superior chemistry - it is rooted in brand recognition (Loctite), distribution reach, and the inertia of existing specifications. The frame for every Henkel conversation: Iowa-made family manufacturer vs. $10B+ German conglomerate. When you call Forza, you get the chemist. When you call Loctite, you get a distributor.", "brands_detail": [["Loctite Structural", "H8000, H8003, H8100, H8600 SpeedBonder (2-part MMA); E-05MR, E-20HP (epoxy); CA 401, 406, 495, 4203", "ForzaBond IC951, TC471, R160, CA1000, CA1500, CA2400"], ["Teroson Sealants", "MS 930NA, MS 939 (1-part SMP); MS 9222, MS 9381 (2-part SMP); PU 8596, PU 8598 (1-part PU)", "ForzaSeal T-OS151, T-OA156, C-OS9"], ["Technomelt Hot Melt", "EVA packaging; polyolefin foam/fabric; reactive PUR hot melt", "Forza H103, H117, H158, H163, H164, H176, H167"], ["Bonderite Surface Prep", "C-IC 8200, Teroson VR 10 - IPA-based surface activators", "Forza OSA, T-OSA155, R-OSA, M-OSA783, C-OSA"]], "wins": ["Iowa family manufacturer vs. $10B+ German conglomerate - direct manufacturer relationship", "Call Forza, get the chemist. Call Loctite, get a distributor rep", "Forza has won business directly from Loctite accounts", "Direct manufacturer pricing - no Henkel multi-tier distributor margin stack", "ForzaTape: Henkel/Loctite has no tape product line", "RuggedRed: Henkel has no dedicated industrial cleaner brand", "Single-source: adhesives + sealants + tapes + cleaners from one Iowa manufacturer"], "moats": ["Loctite brand recognition is the strongest structural adhesive brand in the US", "H8000 SpeedBonder is written into structural adhesive specs by name across industries", "Teroson transportation sealant line has deep automotive OEM penetration", "Threadlockers, anaerobic sealants, light-cure - categories Forza does not play in", "50,000+ adhesive employees globally - deep technical resource base"], "assessment": "Henkel/Loctite is the most respected adhesive brand in the structural adhesive and transportation sealant categories. Their advantage is not chemistry - it is specification inertia. Loctite H8000 and Teroson MS 930 are written into drawings and approval sheets by name. Most engineers and procurement teams have never been asked to evaluate an alternative. The Iowa family manufacturer frame is Forza's most powerful asset against Henkel. This is not a small company vs. big company pitch - it is a direct manufacturer vs. German conglomerate pitch. Forza has won business from Loctite accounts. That proof point, delivered with confidence, is the most credible thing a Forza rep can say in a Loctite-held account.", "bottom_line": "Loctite is the strongest brand Forza competes against in structural adhesives. Teroson is the strongest in transportation sealants. The frame is Iowa vs. Germany, chemist vs. distributor, direct relationship vs. corporate chain. Forza has won on this frame. Use it."}, {"id": "manus", "name": "Manus Products", "brands": "Manus-Bond STP / Silicone / PU", "hq": "Waconia, MN", "rev": "Independent / Private", "threat": "MODERATE-HIGH", "glance": [["Headquarters", "866 Industrial Blvd W, Waconia, MN 55387"], ["Ownership", "Independent, privately held, ISO 9001:2015"], ["In Business", "65+ years (est. ~1959)"], ["Core Business", "Sealants and adhesives only"], ["Phone", "1-800-99-CAULK"]], "overview": "Manus Products is an independent ISO 9001:2015-certified sealant and adhesive manufacturer in Waconia, Minnesota. In business for 65+ years, they are best known for their 75-AM STP polyether sealant family - a 30+ variant product line covering construction, transportation, industrial, and marine sealing applications. They sell through distributors across the Midwest and nationally.", "key_context": "Manus is the closest structural analog to Forza among all competitors - independent manufacturer, ISO 9001, Midwest-based, sealant/adhesive focused. The small Midwest manufacturer frame does not work against Manus. They will use it back. The differentiator is product breadth: Forza makes four product categories. Manus makes two.", "brands_detail": [["75-AM STP Polyether", "30+ variants: all-purpose, fast cure, fast skinning, high green strength, marine, concrete, NSF-61, UL listed, self-leveling", "ForzaSeal OS2, C-OS9, T-OS151, C-OS55"], ["77-AMP / 77-HR", "PU / modified PU transportation sealants", "ForzaSeal T-OA156, T-OS151"], ["Silicone / Hybrid", "73-A (FDA/USDA), 73-GP (GP silicone), 33-MS (ASTM C920 MS polymer)", "ForzaSeal OS35, OS45"], ["FW-15-NS Flex-Weld", "Epoxy hybrid, UV resistant, no primer required", "ForzaBond R160"], ["65-B Neoprene", "Neoprene contact adhesive", "ForzaBond IC933, TC453"]], "wins": ["Single-source: Forza supplies adhesive + sealant + tape + cleaner. Manus supplies two of four", "ForzaBond spray adhesives - IC/MC/TC/RC-series. Manus makes zero spray adhesives", "ForzaTape - 22 tape SKUs. Manus makes zero tapes", "RuggedRed cleaners. Manus has no cleaner line", "Marine vertical: Manus has no Marine products at all. Forza unchallenged", "Composites vertical: Manus has no Composites products. Forza unchallenged"], "moats": ["75-AM STP family depth - 30+ variants is a genuinely broad sealant library", "65+ years in the construction and transportation channel - strong shelf position", "ISO 9001:2015 certified - credible quality story", "Midwest manufacturer (Waconia, MN) - regional familiarity in similar territory", "NSF-61 potable water certification and UL listed variants on 75-AM", "Butyl, acrylic latex, foam sealant lines - categories Forza does not play in"], "assessment": "Manus is the most geographically relevant sealant competitor to Forza. Both are Midwest-based independent manufacturers serving the same construction, transportation, and industrial channels. The competitive conversation with Manus is not about quality or credibility - both earn that. It is about breadth. Manus's 75-AM family is deeper than Forza's STP/hybrid sealant line in terms of variant count, but the single-source argument neutralizes that advantage the moment the conversation expands beyond sealant.", "bottom_line": "Manus is a credible independent sealant manufacturer making the same quality Midwest manufacturer claim Forza makes. The differentiator is not chemistry or geography - it is the four-category portfolio. Forza makes what Manus makes, plus the spray adhesive, tape, and cleaner Manus cannot supply for the same job."}, {"id": "quin", "name": "Quin Global Americas", "brands": "Tensorgrip / QDEK", "hq": "UK HQ / Omaha NE", "rev": "Global / Private", "threat": "HIGH", "glance": [["Global HQ", "UK-headquartered global manufacturer"], ["US Entity", "Quin Global Americas - Omaha, Nebraska"], ["Business Model", "Global spray adhesive manufacturer, 3 regional operations"], ["Core Brands", "Tensorgrip (Industrial/Marine/Transportation/Composites), QDEK (Roofing)"], ["Key Intel", "Canister system compatible with Forza hardware - zero equipment switching cost"]], "overview": "Quin Global Americas is the US entity of a UK-headquartered global spray adhesive manufacturer. Their US operation is based in Omaha, Nebraska - the same metro market as Forza in Council Bluffs, Iowa. They sell through 100+ US distributors under the Tensorgrip brand across industrial, marine, transportation, and composites markets, and under QDEK for commercial roofing.", "key_context": "CRITICAL FIELD INTELLIGENCE: Quin's canister gun system is compatible with Forza's hardware. A contractor or distributor currently running Tensorgrip adhesive can load ForzaBond in the same gun tomorrow - no hardware change, no new equipment. The switch from Tensorgrip to Forza is a product decision only, not an infrastructure decision.", "brands_detail": [["Tensorgrip P-Series Industrial", "P390 (non-flam), P307/P313 (low VOC CA), P308 (high tack), P315 (high temp), P322/P323 (fast dry PSA), P321 (EPS foam), P607 (Class A fire rated)", "ForzaBond IC932, IC933, IC934, IC936, IC946, IC947"], ["Tensorgrip M-Series Marine", "M87 (non-flam), M88 (GP marine), M70 (low VOC), M52/M50 (high temp PSA), M55/M31/M30 (infusion)", "ForzaBond MC722, MC723, MC724, MC736, MC739, MC741"], ["Tensorgrip EPO-Series Reefer", "EPO-ZF (zero-flam), EPO-CA (reefer repair), EPO-CAL (low VOC)", "ForzaBond TC452, TC453, TC456, TC466"], ["QDEK Roofing", "Commercial roofing spray adhesive - flat roofing insulation adhesive", "No Forza equivalent - do not compete in this category"]], "wins": ["Canister system compatibility - zero hardware switching cost. Switch is product decision only", "ForzaSeal: 24 sealant SKUs. Quin makes zero sealants - entire category unchallenged", "ForzaTape: 22 tape SKUs. Quin makes zero tapes - entire category unchallenged", "RuggedRed: Quin has no industrial cleaner brand", "Iowa-made. Quin is UK-headquartered, US sales office Omaha NE", "Single-source: adhesives + sealants + tapes + cleaners from one Iowa manufacturer"], "moats": ["Tensorgrip brand recognition in industrial and marine canister spray channel", "EPO-series has strong recognition in the reefer trailer repair sub-vertical", "Same Omaha metro - regional distributor relationships are real and established", "QDEK roofing adhesive: no Forza equivalent in commercial roofing spray", "100+ US/Americas distributors - real distribution footprint"], "assessment": "Quin Global Americas is Forza's most geographically acute competitor. Both operate in the Omaha/Council Bluffs metro. Both sell into the same Midwest distributor network, the same regional contractors, and the same industrial and marine fabrication accounts. The canister system compatibility is the most important piece of field intelligence in this entire brief - it eliminates the hardware-based switching cost for any Tensorgrip customer.", "bottom_line": "Quin is the closest adhesive competitor geographically and technically. The canister compatibility eliminates the primary switching barrier. The single-source argument is the conversion play. Lead with hardware compatibility, follow with sealant and tape, earn the adhesive conversation from there."}, {"id": "newstar", "name": "NewStar Adhesives", "brands": "EverStrong / EverHold / EverBond", "hq": "Massachusetts", "rev": "Independent / Private", "threat": "MODERATE", "glance": [["Headquarters", "Massachusetts (mfg in MA, GA, NC)"], ["Ownership", "Independent, privately held"], ["Founded", "Est. 1970s - specialty contact adhesive manufacturer"], ["Core Business", "Contact and spray adhesives only"], ["Brands", "EverStrong, EverHold, EverBond, Pionite, Nevamar"]], "overview": "NewStar Adhesives is an independent contact and spray adhesive manufacturer headquartered in Massachusetts with manufacturing in MA, GA, and NC. Their tagline is 'We do one thing and we do it well' - an accurate description of their business model. They sell through distributors nationally under the EverStrong (industrial) and EverHold (marine) brands, and supply adhesive under private-label arrangements including Pionite and Nevamar for the HPL laminate channel.", "key_context": "NewStar's tagline is 'We do one thing and we do it well.' That is an accurate description of their business - and the ceiling. Every contractor buying EverStrong still needs sealant, tape, and cleaner for the same job. NewStar cannot supply any of those. Forza supplies all four from one Iowa manufacturer.", "brands_detail": [["EverStrong Industrial", "ES10+, ES12 Non-Flam, ES15 High Tack, ES22 Low VOC, ES50 PSA, ES55 Fast Dry, ES60 EPS Foam, ES80 Heavy Duty, ES99/ES99 LVoc, ES40 EPS", "ForzaBond IC932, IC933, IC934, IC936, IC946, IC947, IC951"], ["EverHold Marine", "N600, N610, N614 (marine foam/upholstery), N620, N677 (structural laminating), N900, N901 (vacuum infusion/mold)", "ForzaBond MC722, MC723, MC724, MC736, MC737, MC741"], ["EverBond / Pionite / Nevamar", "Private-label OEM chemistry sold through HPL distribution - same EverStrong chemistry, distributor margin stacked on top", "ForzaBond IC-series direct at manufacturer pricing"], ["NCC Citrus Cleaner", "Basic adhesive cleaner", "RuggedRed Citrus Cleaner"]], "wins": ["Single-source: Forza supplies adhesive + sealant + tape + cleaner. NewStar can only supply one of four", "Iowa-made. NewStar manufactures in MA, GA, NC - no Midwest manufacturing", "ForzaBond IC-series covers every EverStrong application chemistry", "ForzaBond MC-series covers every EverHold marine application", "Forza has no canister return logistics dependency - standard shipping", "Distributors: Forza fills sealant, tape, cleaner gap NewStar leaves entirely"], "moats": ["EverStrong brand recognition in industrial and marine adhesive channel", "30+ years of adhesive-specialist positioning - 'one thing' story resonates", "EverHold well-established in marine fabrication shops", "Pionite/Nevamar HPL channel relationships are deeply entrenched"], "assessment": "NewStar is a legitimate adhesive competitor in the industrial and marine channel. Their EverStrong ES-series and EverHold N-series are well-regarded products with real market penetration. The competitive threat is limited to adhesive categories only - NewStar has zero presence in sealants, tapes, or industrial cleaners. The EverBond private-label dynamic is worth actively addressing in distributor conversations - most distributors carrying EverBond are unaware they are carrying NewStar chemistry at a margin tier below what they could achieve buying Forza direct.", "bottom_line": "NewStar does one thing well. Forza does four things well - including the one NewStar does. The single-source argument is the primary weapon. Every contractor buying NewStar adhesive is buying sealant, tape, and cleaner from someone else. That's the conversation."}];

// SCAN - iOS uses label+file input, photo comes back via change event
function processFile(file){
  if(!file)return;
  var el=document.getElementById('skuResult');
  el.innerHTML='';
  el.appendChild(mk('div','scan-processing','Photo received — reading barcode...'));
  var reader=new FileReader();
  reader.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      var c=document.getElementById('scanCanvas');
      var maxW=1200,scale=Math.min(1,maxW/img.naturalWidth);
      c.width=Math.round(img.naturalWidth*scale);
      c.height=Math.round(img.naturalHeight*scale);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      var imgData=c.toDataURL('image/jpeg',0.6);
      lastUpc='';
      if(typeof Quagga!=='undefined'){
        el.innerHTML='';
        el.appendChild(mk('div','scan-processing','Decoding barcode...'));
        Quagga.decodeSingle({
          decoder:{readers:['ean_reader','ean_8_reader','upc_reader','upc_e_reader','code_128_reader','code_39_reader']},
          locate:true,
          src:imgData
        },function(result){
          el.innerHTML='';
          if(result&&result.codeResult&&result.codeResult.code){
            handleScan(result.codeResult.code,imgData);
          } else {
            showManualEntry(imgData,'',lastUpc);
          }
        });
      } else {
        el.innerHTML='';
        showManualEntry(imgData,'',lastUpc);
      }
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

function handleScan(raw,imgData){
  var cl=raw.trim(),nz=cl.replace(/^0+/,'');
  lastUpc=/^[0-9]{8,14}$/.test(cl)?cl:'';
  var repo=getRepo();
  var repoEntry=repo[cl]||repo[nz]||null;
  var sn=UPC_BUILTIN[cl]||UPC_BUILTIN[nz]||(repoEntry?repoEntry.name:null)||null;
  var el=document.getElementById('skuResult');el.innerHTML='';
  if(sn){
    var m=SKU.filter(function(d){return nm(d.comp).indexOf(nm(sn))>-1||nm(d.brand).indexOf(nm(sn))>-1;});
    if(m.length){
      document.getElementById('skuInput').value=sn;
      showSingle(m[0],el);
      return;
    }
  }
  showManualEntry(imgData,/^[0-9]{8,14}$/.test(cl)?'':cl,lastUpc);
}

document.getElementById('scanInput').addEventListener('change',function(){
  processFile(this.files&&this.files[0]);
});

  var el=document.getElementById('skuResult');el.innerHTML='';
  var wrap=mk('div','manual-wrap');
  if(imgData){
    wrap.appendChild(mk('div','manual-label','Captured image — find the product name on the label:'));
    var img=mk('img','manual-img');img.src=imgData;wrap.appendChild(img);
  }
  wrap.appendChild(mk('div','manual-label','Type the product name or SKU you see:'));
  var row=mk('div','srow');row.style.marginTop='8px';
  var inp=mk('input','sinput');inp.type='text';inp.placeholder='e.g. Super 77, Sikaflex-252, H8000...';inp.value=prefill||'';
  var btn=mk('button','sbtn','Search');
  btn.addEventListener('click',function(){
    var v=inp.value.trim();if(!v)return;
    document.getElementById('skuInput').value=v;
    var m=SKU.filter(function(d){return nm(d.comp).indexOf(nm(v))>-1||nm(d.brand).indexOf(nm(v))>-1;});
    el.innerHTML='';
    if(m.length){
      showSingle(m[0],el);
      var effectiveUpc=rawUpc&&rawUpc!=='manual'?rawUpc:lastUpc;
      var alreadySaved=effectiveUpc&&(UPC_BUILTIN[effectiveUpc]||getRepo()[effectiveUpc]);
      if(!alreadySaved){offerSave(effectiveUpc||'',m[0].comp,m[0].ind||'',imgData);}
    } else {
      el.appendChild(mk('div','info','No match for "'+v+'". Try a different spelling.'));
    }
  });
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')btn.click();});
  row.appendChild(inp);row.appendChild(btn);wrap.appendChild(row);
  var retry=mk('label','retry-scan-btn');retry.setAttribute('for','scanInput');retry.textContent='Take Another Photo';
  wrap.appendChild(retry);
  el.appendChild(wrap);
  inp.focus();
}

function offerSave(upc,name,ind,imgData){
  var bar=mk('div','save-bar');
  var isUpc=upc&&/^[0-9]{8,14}$/.test(upc);
  bar.appendChild(mk('div','save-label',(isUpc?'Save UPC '+upc+' → ':'Save “')+name+(isUpc?'':'”')+' to repository?'));
  var btn=mk('button','save-btn','Save');
  btn.addEventListener('click',function(){
    var repo=getRepo();
    var key=isUpc?upc:'name:'+nm(name);
    repo[key]={name:name,ind:ind,date:new Date().toLocaleDateString(),img:imgData||'',upc:isUpc?upc:''};
    try{localStorage.setItem('fz_upc',JSON.stringify(repo));}catch(e){}
    bar.innerHTML='';bar.appendChild(mk('span','save-label','✓ Saved! This product is now in the repository.'));
    renderRepo();
  });
  bar.appendChild(btn);
  document.getElementById('skuResult').appendChild(bar);
}

function getRepo(){try{return JSON.parse(localStorage.getItem('fz_upc')||'{}');}catch(e){return {};}}

function renderRepo(){
  var wrap=document.getElementById('upcRepo');wrap.innerHTML='';
  var repo=getRepo(),keys=Object.keys(repo);
  var hdr=mk('div','upc-repo-hdr');
  hdr.appendChild(mk('div','upc-repo-title','Field UPC Repository'));
  hdr.appendChild(mk('div','upc-repo-count',keys.length+' saved'));
  wrap.appendChild(hdr);
  if(!keys.length){wrap.appendChild(mk('div','upc-repo-empty','No products saved yet. Scan a competitor product and save the match.'));return;}
  var tbl=mk('table','vtbl'),thead=mk('thead'),hrow=mk('tr');
  ['Photo','UPC / Key','Product','Forza Cross','Date',''].forEach(function(h){hrow.appendChild(mk('th',null,h));});
  thead.appendChild(hrow);tbl.appendChild(thead);
  var tbody=mk('tbody');
  keys.forEach(function(key){
    var e=repo[key],tr=mk('tr');
    var photoTd=mk('td');
    if(e.img){
      var a=document.createElement('a');a.href=e.img;a.download=(e.name||key).replace(/[^a-z0-9]/gi,'_')+'.jpg';
      var thumb=mk('img','repo-thumb');thumb.src=e.img;a.appendChild(thumb);photoTd.appendChild(a);
    } else {photoTd.appendChild(mk('span','repo-no-photo','-'));}
    tr.appendChild(photoTd);
    // UPC cell - show UPC if known, else show input to add one
    var upcTd=mk('td');
    var hasUpc=e.upc||(key.indexOf('name:')===-1&&/^[0-9]+$/.test(key));
    if(hasUpc){
      upcTd.textContent=e.upc||key;
    } else {
      var uw=mk('div','');uw.style.cssText='display:flex;gap:4px;';
      var ui=mk('input','sinput');ui.placeholder='Enter UPC';ui.style.cssText='padding:4px 8px;font-size:.68rem;width:110px;';
      var ub=mk('button','save-btn','Add');ub.style.cssText='padding:4px 8px;font-size:.66rem;';
      ub.addEventListener('click',(function(k,ent,inp){return function(){
        var upc=inp.value.replace(/[^0-9]/g,'');if(!upc)return;
        var r=getRepo();
        r[upc]={name:ent.name,ind:ent.ind,date:ent.date,img:ent.img,upc:upc};
        delete r[k];
        try{localStorage.setItem('fz_upc',JSON.stringify(r));}catch(ex){}
        renderRepo();
      };})(key,e,ui));
      uw.appendChild(ui);uw.appendChild(ub);upcTd.appendChild(uw);
    }
    tr.appendChild(upcTd);
    tr.appendChild(mk('td',null,e.name||''));
    tr.appendChild(mk('td','orange',e.ind||'-'));
    tr.appendChild(mk('td',null,e.date||''));
    var delTd=mk('td');var db=mk('button','del-btn','×');
    db.addEventListener('click',(function(k){return function(){var r=getRepo();delete r[k];try{localStorage.setItem('fz_upc',JSON.stringify(r));}catch(ex){}renderRepo();};})(key));
    delTd.appendChild(db);tr.appendChild(delTd);
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);wrap.appendChild(tbl);
}
renderRepo();

// COMPETITOR CARDS
function buildCards(data,gridId,selFn,activeId){
  var grid=document.getElementById(gridId);grid.innerHTML='';
  data.forEach(function(c){
    var card=mk('div','ccard'+(activeId===c.id?' active':''));
    card.appendChild(mk('div','cc-name',c.name));card.appendChild(mk('div','cc-brands',c.brands));
    var tags=mk('div','cc-tags');
    tags.appendChild(mk('span','ctag '+(c.threat==='HIGH'?'t-high':'t-mod'),'Threat: '+c.threat));
    tags.appendChild(mk('span','ctag t-loc',c.hq.split('/')[0].trim()));
    card.appendChild(tags);
    card.addEventListener('click',(function(cc){return function(){selFn(cc);};})(c));
    grid.appendChild(card);
  });
}

// BATTLE CARDS
function buildBC(){buildCards(COMP,'bcGrid',selBC,aBC);}

  aBC=c.id;buildCards(COMP,'bcGrid',selBC,aBC);
  var det=document.getElementById('bcDetail');det.innerHTML='';

  if(c.seeds&&c.seeds.length){dp.appendChild(mk('div','bc-label','Quick Dismisses'));c.seeds.forEach(function(s){dp.appendChild(mk('div','seed-box',s));});}

  if(c.objections&&c.objections.length){dp.appendChild(mk('div','bc-label','Objection Handling'));c.objections.forEach(function(o){var b=mk('div','obj-box');b.appendChild(mk('div','obj-q','"'+o[0]+'"'));b.appendChild(mk('div','obj-a',o[1]));dp.appendChild(b);});}
  if(c.crosswalk&&c.crosswalk.length){
    dp.appendChild(mk('div','bc-label','SKU Crosswalk'));
    var tbl=mk('table','vtbl'),thead=mk('thead'),hrow=mk('tr');
    ['Competitor SKU','Application','Forza Equivalent'].forEach(function(h){hrow.appendChild(mk('th',null,h));});
    thead.appendChild(hrow);tbl.appendChild(thead);
    var tb=mk('tbody');c.crosswalk.forEach(function(r){var tr=mk('tr');tr.appendChild(mk('td',null,r.sku));tr.appendChild(mk('td',null,r.app));tr.appendChild(mk('td','orange',r.ind));tb.appendChild(tr);});
    tbl.appendChild(tb);dp.appendChild(tbl);
  }
  var swg=mk('div','sw-grid');
  var wb=mk('div','sw-box');wb.appendChild(mk('div','sw-label sw-win','Where Forza Wins'));c.wins.forEach(function(w){wb.appendChild(mk('div','sw-item win',w));});swg.appendChild(wb);
  if(c.moats&&c.moats.length){var mb=mk('div','sw-box');mb.appendChild(mk('div','sw-label sw-gap','Do Not Fight These'));c.moats.forEach(function(m){mb.appendChild(mk('div','sw-item gap',m));});swg.appendChild(mb);}
  dp.appendChild(swg);det.appendChild(dp);
}

// FIELD GUIDES
function buildFG(){
  var el=document.getElementById('fgContent');el.innerHTML='';
  var sel=mk('div','fg-selector');
  FG.forEach(function(g,i){
    var btn=mk('button','fg-btn',g.name);
    btn.style.background=i===fgG?g.color:'#fff';btn.style.color=i===fgG?'#fff':'#333';btn.style.borderColor=i===fgG?g.color:'';
    btn.addEventListener('click',(function(idx){return function(){fgG=idx;fgC=0;buildFG();};})(i));sel.appendChild(btn);
  });
  el.appendChild(sel);
  var g=FG[fgG];
  el.appendChild(mk('div','fg-guide-title',g.name+' Field Substitution Guide'));
  el.appendChild(mk('div','fg-guide-sub',g.subtitle));
  var ct=mk('div','fg-comp-tabs');
  g.tabs.forEach(function(t,i){
    var btn=mk('button','fg-comp-btn',t.comp);
    btn.style.background=i===fgC?g.color:'';btn.style.color=i===fgC?'#fff':'';btn.style.borderColor=i===fgC?g.color:'';
    btn.addEventListener('click',(function(idx){return function(){fgC=idx;buildFG();};})(i));ct.appendChild(btn);
  });
  el.appendChild(ct);
  var isFas=g.name==='Fastenal',tab=g.tabs[fgC];
  tab.sections.forEach(function(sec){
    var w=mk('div','fg-section');w.appendChild(mk('div','fg-section-label',sec.label));
    var tbl=mk('table','fg-tbl'),thead=mk('thead'),hr=mk('tr');
    (isFas?['Competitor SKU','Application','Forza Industrial','Forza Transportation']:['Competitor SKU','Application','Forza Marine']).forEach(function(h){hr.appendChild(mk('th',null,h));});
    thead.appendChild(hr);tbl.appendChild(thead);
    var tb=mk('tbody');
    sec.rows.forEach(function(row){var tr=mk('tr');tr.appendChild(mk('td',null,row[0]));tr.appendChild(mk('td',null,row[1]));tr.appendChild(mk('td','fg-f',row[2]||'-'));if(isFas)tr.appendChild(mk('td','fg-t',row[3]||'-'));tb.appendChild(tr);});
    tbl.appendChild(tb);w.appendChild(tbl);el.appendChild(w);
  });
}

// DOCUMENTS
var aDocF='all';
function buildDocs(){
  var q=nm(document.getElementById('docSearch').value||'');
  var fl=DOCS.filter(function(d){return(aDocF==='all'||d.t===aDocF)&&(!q||nm(d.n).indexOf(q)>-1||nm(d.c).indexOf(q)>-1||nm(d.d).indexOf(q)>-1);});
  document.getElementById('docCount').textContent=fl.length+' of '+DOCS.length+' documents';
  var list=document.getElementById('docList');list.innerHTML='';
  if(!fl.length){list.appendChild(mk('div','info','No documents match your search.'));return;}
  fl.forEach(function(d){
    var row=mk('div','drow'),info=mk('div','dinfo');
    info.appendChild(mk('div','dname',d.n));info.appendChild(mk('div','dmeta',d.c+' - '+d.d));
    row.appendChild(info);var right=mk('div','dright');
    right.appendChild(mk('span','dbadge b-'+d.t,TL[d.t]||d.t));
    var link=mk('a','dopen','Open');link.href=d.url;link.target='_blank';right.appendChild(link);
    row.appendChild(right);list.appendChild(row);
  });
}
document.getElementById('docSearch').addEventListener('input',function(){buildDocs();});
document.querySelectorAll('.fbtn').forEach(function(btn){
  btn.addEventListener('click',function(){
    aDocF=this.getAttribute('data-f');
    document.querySelectorAll('.fbtn').forEach(function(b){b.classList.remove('active');});
    this.classList.add('active');buildDocs();
  });
});

// VERTICALS
function buildVerts(){
  var grid=document.getElementById('vertGrid');grid.innerHTML='';
  VERT.forEach(function(v,i){
    var card=mk('div','vcard'+(aV===i?' sel':'')+(v.dark?' vc-dark':''));
    card.style.background=v.color;
    card.appendChild(mk('div','vc-label',v.name));card.appendChild(mk('div','vc-count',String(v.skus.length)));card.appendChild(mk('div','vc-sub','SKUs'));
    card.addEventListener('click',(function(idx){return function(){selVert(idx);};})(i));
    grid.appendChild(card);
  });
  if(aV!==null)showVD(aV);
}
function selVert(i){aV=i;document.querySelectorAll('.vcard').forEach(function(c,j){c.classList.toggle('sel',i===j);});showVD(i);}
function showVD(i){
  var v=VERT[i],isI=v.name==='Industrial',det=document.getElementById('vertDetail');det.innerHTML='';
  var dp=mk('div','dp');dp.style.marginTop='0';
  var title=mk('div','dp-title');title.textContent=v.name+' Vertical - '+v.skus.length+' SKUs';title.style.color=v.color;dp.appendChild(title);
  var tbl=mk('table','vtbl'),thead=mk('thead'),hrow=mk('tr');
  hrow.appendChild(mk('th',null,'Forza SKU'));hrow.appendChild(mk('th',null,'Description'));
  if(!isI)hrow.appendChild(mk('th',null,'Industrial Equivalent'));
  thead.appendChild(hrow);tbl.appendChild(thead);
  var tbody=mk('tbody');
  v.skus.forEach(function(s){
    var tr=mk('tr');tr.appendChild(mk('td',null,s.s));tr.appendChild(mk('td',null,s.d));
    if(!isI){var ieq=IE[s.s]||'';tr.appendChild(mk('td',ieq?'orange':'dim',ieq||'-'));}
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);dp.appendChild(tbl);det.appendChild(dp);
}
buildDocs();
