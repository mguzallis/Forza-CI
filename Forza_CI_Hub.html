@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
:root{--blue:#1B3764;--orange:#F16022;--rusty:#D35127;--grey:#BFBFBF;--surface:#F0F2F6;--border:#E0E4EA;--muted:#666;}
body{font-family:'Poppins',sans-serif;background:#fff;color:var(--blue);overflow-x:hidden;overflow-y:scroll;-webkit-text-size-adjust:100%;}
@media(hover:hover) and (pointer:fine){.modal-overlay{display:none !important;}}
@media(max-width:599px){input,select,textarea{font-size:16px !important;}}
.app{max-width:900px;margin:0 auto;padding:24px 24px 0;}
.header{text-align:center;margin-bottom:16px;height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;}
.logo{width:280px;max-width:80%;display:block;}
.app-title{font-family:'K','Poppins',sans-serif;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin-top:8px;margin-bottom:2px;}
.rep-badge{display:inline-block;font-size:.65rem;color:#888;margin-left:8px;font-weight:400;}
.app-sub{font-size:.82rem;color:var(--muted);}
hr{border:none;border-top:1px solid var(--border);margin:14px 0;}
.tagline{text-align:center;font-family:'K','Poppins',sans-serif;font-size:.65rem;letter-spacing:.09em;text-transform:uppercase;margin:0 0 14px;}
.t1{color:var(--blue);}.t2{color:var(--grey);}.t3{color:var(--orange);}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--border);margin-bottom:20px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none;background:#F5F7FB;border-radius:8px 8px 0 0;padding:0 4px;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:9px 12px;font-size:.72rem;font-weight:600;color:#999;cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:0;transition:color .15s;font-family:'Poppins',sans-serif;white-space:nowrap;flex-shrink:0;}

var COMP=[{"id": "3m", "name": "3M", "brands": "Super 77 / Scotch-Weld / VHB / PU Sealants / Hot Melt", "hq": "Maplewood, MN", "rev": "$32B+", "threat": "HIGH", "pitch": "3M is a $32B+ diversified technology company. Their adhesive rep covers electronics, healthcare, traffic safety, and abrasives on the same call. Forza makes adhesives, sealants, and tapes only. Same performance, Iowa-made, direct manufacturer pricing, no 3M brand premium.", "msgs": [["To the Contractor", "3M Super 77 and Forza IC933/IC936 are the same multi-purpose spray chemistry. The 3M name adds a price premium. Forza is Iowa-made, direct manufacturer, and also supplies the sealant and tape for the same job."], ["To the Marine Fabricator", "3M 5200 is the gold standard for marine bonding. Forza M-OS789 covers the same structural marine sealant application at direct manufacturer pricing, plus MC739 for infusion spray. 3M does not make a canister spray adhesive."], ["To the Distributor", "Your margin on 3M is compressed. Forza is direct manufacturer, better margin, Iowa-made, same chemistry, and gives you the full shelf: adhesive, sealant, tape, and cleaner."]], "objections": [["3M Super 77 is what we have always used", "Forza IC933/IC936 covers the same application. Direct pricing, Iowa-made, and Forza also supplies sealant and tape for the same job on one PO."], ["3M 5200 is specced for marine", "Specced by name or chemistry? 3M 5200 is 1-part PU marine structural. Forza M-OS789 is the same chemistry. Let us compare TDS."], ["VHB is the only tape we trust", "Forza T-205/T-215/T-220 are UHB acrylic foam tapes. Forza publishes more ASTM data than 3M on the public TDS."], ["3M has the brand behind it", "3M brand is real. So is the premium. When the chemistry is equivalent, that premium goes to Maplewood, MN. With Forza it stays in your budget."]], "seeds": ["3M is a $32B+ diversified technology company. The rep calling with Super 77 also covers Scotch-Brite, traffic safety film, and Post-it Notes. Forza entire operation is adhesives, sealants, and tapes. That is the difference between a specialist and a line item in a conglomerate portfolio.", "3M brand premium is real and documented. Contractors pay it because 3M is convenient and trusted, not because the chemistry is different. Forza makes the same chemistry Iowa-made at direct manufacturer pricing.", "3M does not make a canister spray adhesive. Super 77 and HoldFast are aerosol and small-volume cans. Forza IC/MC/TC/RC canister system is purpose-built for production volume."], "landmines": [["Canister System", "Plant this: 3M aerosols work at retail and small-volume. For production volume, aerosol cans are the wrong format. Ask 3M: How many cans per month, and has anyone compared your total adhesive cost in aerosol versus a canister system at the same chemistry?"], ["Brand Premium", "Plant this: 3M brand premium is visible at every counter in town. Distributor margin is capped by brand price awareness. Ask 3M: What is your margin versus what you would make on a comparable product from a direct manufacturer?"], ["5200 Marine Sealant", "Plant this: 3M 5200 is among the most expensive marine sealants. The chemistry is not unique to 3M. Ask 3M: Is that a chemistry specification or a brand preference, and have you compared its TDS against a competing 1-part PU marine sealant?"], ["VHB Tape", "Plant this: Forza has built a full TDS comparison of T-205, T-215, and T-220 against VHB. Forza publishes more ASTM-tested data than 3M. Ask 3M: Have you compared the 3M VHB TDS against a competing UHB acrylic foam tape on peel, shear, and temperature?"], ["Technical Depth", "Plant this: 3M adhesive rep covers electronics, healthcare, traffic safety, and abrasives. Ask 3M: When you have a technical question on your spray adhesive, how specialized is the person who answers?"]], "wins": ["No 3M canister spray system - Forza IC/MC/TC/RC unchallenged", "Direct manufacturer pricing - no 3M brand premium", "Iowa-made vs. Maplewood MN", "Forza publishes more ASTM data than 3M on VHB TDS", "Single-source: adhesive + sealant + tape + cleaner"], "moats": ["Masking / electrical / strapping tapes - no Forza equivalent", "Scotch-Weld aerospace / electronics epoxies - outside Forza portfolio", "Automotive body filler and refinish - outside Forza portfolio"], "crosswalk": [{"sku": "Super 77 / 27 / 20", "app": "Multi-purpose aerosol spray", "ind": "IC933 / IC936"}, {"sku": "24 Foam & Fabric / Foam Fast 74", "app": "Foam, fabric, styrene safe", "ind": "IC947"}, {"sku": "76 Hi-Tack / HoldFast 70", "app": "High tack / high strength canister", "ind": "IC946 / IC947"}, {"sku": "Hi-Strength 90 / 94 CA", "app": "PSA laminating / CA compliant", "ind": "IC946"}, {"sku": "80 Rubber & Vinyl", "app": "Rubber and vinyl contact spray", "ind": "IC933"}, {"sku": "3M Spray 71", "app": "Composites mist spray infusion", "ind": "MC739"}, {"sku": "VHB GPH-060GF (0.6mm)", "app": "UHB acrylic foam tape gray", "ind": "T-205"}, {"sku": "VHB GPH-110GF (1.1mm)", "app": "UHB acrylic foam tape gray", "ind": "T-215"}, {"sku": "VHB 5952 (62mil Black)", "app": "UHB structural attachment", "ind": "T-220"}, {"sku": "Tape Primer 94 / 111", "app": "Adhesion primer for VHB", "ind": "OSA"}, {"sku": "5200 / 5200 FC", "app": "Marine structural PU sealant", "ind": "M-OS789 / M-OA755"}, {"sku": "4200 FC / 4000 UV", "app": "Marine adhesive sealant", "ind": "M-OS789 / M-OS796"}, {"sku": "560 PU / 550 FC", "app": "PU sealant, transportation/construction", "ind": "OA4 / OS2"}, {"sku": "MSP Seam Sealer 08374", "app": "SMP sprayable seam sealer", "ind": "OS2"}, {"sku": "DP8005 / DP810", "app": "2-part acrylic structural", "ind": "IC951"}, {"sku": "DP190 / 2214", "app": "2-part epoxy structural", "ind": "R160"}]}, {"id": "abitape", "name": "ABI Tape / Ideal Tape", "brands": "ABI Tape / Ideal Tape / ProtecRite / TransferRite / Autowrap / American Biltrite", "hq": "Moorestown, NJ (ABI Tape); Lowell, MA (Ideal Tape)", "rev": "American Biltrite Inc. est. <$200M; ABI Tape division est. <$100M", "threat": "MOD", "pitch": "ABI Tape, a division of American Biltrite Inc. (founded 1908), is a specialty tape manufacturer focused on HVAC/insulation, industrial, automotive, surface protection, and graphic arts markets. Ideal Tape (Lowell, MA) is their HVAC and insulation tape plant. They compete with Forza in the industrial, insulation, and transportation tape categories. Forza's advantage is direct manufacturer pricing and single-source capability \u2014 tape plus adhesive plus sealant on one account.", "msgs": [["To the HVAC/Insulation Distributor", "Ideal Tape ASJ tapes and duct jacketing are well-made specialty products. Forza RC-series covers the same insulation tape applications as part of a complete insulation system \u2014 sealant + adhesive + tape on one direct manufacturer account."], ["To the Industrial Distributor", "ABI's industrial tape line competes with Forza T-series in bonding, masking, and specialty tape categories. Forza direct manufacturer pricing and system breadth (tape + adhesive + sealant) give distributors better margin and simpler sourcing."], ["To the Transportation OEM", "ABI automotive tapes (Autowrap) compete with Forza T-series in transportation assembly. Forza adds sealant and adhesive on the same account \u2014 single-source system vs tape-only relationship."]], "seeds": ["ABI Tape is a division of American Biltrite Inc., a 115-year-old company best known for tile flooring and rubber products. Tape is one division among several in a broad industrial products company. Forza is an adhesive, sealant, and tape specialist \u2014 that is all we do.", "ABI Tape and Ideal Tape are two plants in two states under the same American Biltrite parent. Ideal Tape focuses on HVAC and insulation; ABI focuses on industrial, automotive, and graphics. The brand structure is confusing for buyers who deal with both plants.", "ABI Tape has global operations \u2014 Belgium, Singapore, Italy \u2014 which is strong for multinational OEM accounts. For US-based industrial and insulation distribution, Forza's direct Iowa-made pricing is a stronger story."], "landmines": [["Broad Industrial Company", "Plant this: American Biltrite makes floor tile, rubber flooring, and tape across multiple divisions. Ask: When you have a technical tape question or a supply issue, are you dealing with a tape specialist or a division of a flooring company?"], ["Two-Plant Brand Confusion", "Plant this: ABI Tape in NJ and Ideal Tape in MA are different plants with different focus markets under the same parent. Ask: Who is your single point of contact for both ABI and Ideal Tape products, and how does that work when you need products from both plants?"], ["Tape Only", "Plant this: ABI makes tapes only \u2014 no adhesive, no sealant. Ask: How many supplier accounts are you managing for tape, adhesive, and sealant on the same HVAC or insulation job?"]], "objections": [["Ideal 728/729 ASJ tape is what our contractors spec", "Ideal 728/729 ASJ tape is a good product for faced insulation sealing. Forza RC-series covers the same application chemistry. Is it specced by brand or by ASJ performance standard? If by standard, compare TDS and pricing."], ["ABI has the automotive tape line we need", "ABI Autowrap is a solid automotive tape portfolio. Forza T-series covers the same double-coated, acrylic foam, and masking tape categories in the transportation vertical at direct pricing with sealant and adhesive on the same account."], ["ABI is a 100-year-old company \u2014 they know tape", "115 years in tape is real. So is Forza's direct manufacturer advantage. The chemistry is not patented to ABI; the same tape categories are available from a direct manufacturer without the flooring company overhead."]], "crosswalk": [{"sku": "Ideal Tape 728 / 729 ASJ Tape", "app": "ASJ-faced insulation jacketing and sealing tape", "ind": "R519"}, {"sku": "Ideal Tape HVAC Duct Tape", "app": "Foil-backed HVAC duct sealing tape", "ind": "T305"}, {"sku": "Ideal Tape Cladding/Jacketing Tape", "app": "Insulation jacketing and cladding tape", "ind": "R519"}, {"sku": "ABI Industrial Masking Tape", "app": "High-temperature industrial masking tape", "ind": "T532"}, {"sku": "ABI Double-Coated Foam Tape", "app": "Double-coated foam bonding and mounting tape", "ind": "T215"}, {"sku": "ABI Acrylic Foam Tape", "app": "Structural acrylic foam attachment tape", "ind": "T220"}, {"sku": "ABI Autowrap Automotive Tape", "app": "Automotive wire harness and surface protection tape", "ind": "T532"}, {"sku": "ProtecRite Surface Protection Film", "app": "Protective paper and film tape manufacturing", "ind": "T205"}, {"sku": "ABI Polyimide Film Tape", "app": "High-performance insulation tape for motors/coils", "ind": "T710"}], "wins": ["Direct manufacturer pricing vs ABI/American Biltrite division overhead", "Forza single-source: tape + adhesive + sealant on one account", "Forza specialist vs ABI division of a flooring/rubber company", "Iowa-made direct vs NJ/MA two-plant brand complexity", "Forza insulation system: sealant + adhesive + tape purpose-built for vertical"], "moats": ["Ideal Tape ASJ and insulation jacketing tape \u2014 specced in HVAC insulation channel", "ABI global operations (Belgium, Singapore, Italy) for multinational OEM accounts", "115-year brand history \u2014 strong trust in specialty tape categories", "Automotive Autowrap tape line \u2014 established in transportation OEM channel", "ProtecRite surface protection \u2014 specialty niche outside Forza portfolio"]}, {"id": "asi", "name": "American Sealants (ASI)", "brands": "ASI / American Sealants / Meridian Adhesives Group", "hq": "Fort Wayne, IN (Meridian HQ: Houston, TX)", "rev": "Meridian Adhesives Group est. $500M+ (PE-backed, Arsenal Capital); ASI est. <$100M", "threat": "MOD", "pitch": "ASI is a Fort Wayne, Indiana sealant and adhesive manufacturer now owned by Meridian Adhesives Group \u2014 a PE-backed (Arsenal Capital) roll-up of specialty adhesive and sealant companies. ASI specializes in silicones, hybrid polyethers, and custom compounding for industrial, transportation, and construction markets. Their private label capability and Meridian's growing platform make them a more sophisticated competitor than Silco. Forza competes on system breadth, direct manufacturer pricing, and a dedicated sealant + adhesive + tape offering ASI cannot match.", "msgs": [["To the Industrial Buyer", "ASI/Meridian is a PE roll-up \u2014 they have acquired multiple sealant companies to build scale. Arsenal Capital is the PE backer. Ask how that ownership structure affects pricing, service, and long-term supply reliability versus a direct manufacturer."], ["To the Transportation OEM", "ASI makes transportation assembly sealants and hybrid polyethers. Forza's Transportation vertical covers the same sealing applications plus structural adhesive and tape on one direct manufacturer account."], ["To the Distributor", "Meridian is building a roll-up platform \u2014 ASI is one of several acquisitions. Distributor relationships can shift as PE-backed platforms consolidate. Forza is a stable direct manufacturer without acquisition or consolidation risk."]], "seeds": ["ASI is now part of Meridian Adhesives Group, which is backed by Arsenal Capital Partners \u2014 a private equity firm building a specialty adhesives roll-up. Arsenal Capital has also backed other adhesive acquisitions. PE roll-ups prioritize margin and exit, which typically means price rationalization and potential distribution changes.", "ASI's custom compounding and private label capability is their main competitive angle \u2014 similar to Silco but with more scale through the Meridian platform. The ASI brand itself is narrower than the Meridian platform implies. Their product chemistry is silicones, hybrid polyethers, and acetoxy sealants.", "ASI competes with Forza in the industrial and construction sealant space. They have no tape line, no canister spray, and no structural adhesive equivalent to Forza's IC/R-series. Forza wins on system breadth and direct pricing."], "landmines": [["PE Roll-Up", "Plant this: ASI is owned by Meridian Adhesives Group, backed by Arsenal Capital Partners private equity. PE roll-ups in adhesives and sealants typically means price increases, SKU rationalization, and potential distribution changes as they build toward an exit. Ask: Has your pricing or service from ASI/Meridian changed since the Arsenal Capital acquisition?"], ["Platform Complexity", "Plant this: Meridian is acquiring multiple sealant companies to build a platform. That means multiple manufacturing sites, multiple product lines, and potential integration complexity. Ask: Who is your actual point of contact at ASI versus Meridian, and has that relationship changed since the acquisition?"], ["Private Label Risk", "Plant this: If you are buying ASI private label, your brand is on Meridian's product. With a PE-backed roll-up, ownership and priorities can change. Ask: What happens to your private label supply if Meridian changes ownership or exits?"]], "objections": [["ASI has the chemistry we need for our application", "What chemistry specifically? ASI covers silicone, acetoxy, neutral cure, and STPE hybrid sealants. Forza OA4, OA13, and OS2 cover the same chemistry categories at direct manufacturer pricing."], ["We have a private label relationship with ASI", "Forza can also discuss private label. The question is whether a PE-backed roll-up or a direct manufacturer gives you more pricing stability and supply reliability under your brand."], ["Meridian has a broader portfolio than ASI alone", "The Meridian platform is growing through acquisition. That breadth comes with PE ownership complexity. Forza's breadth is organic \u2014 adhesive, sealant, and tape from one direct manufacturer without acquisition integration risk."]], "crosswalk": [{"sku": "ASI 502 100% Silicone", "app": "Acetoxy RTV silicone industrial/construction/HVAC", "ind": "OA13"}, {"sku": "ASI Neutral Cure Silicone", "app": "Neutral cure silicone non-corrosive primerless", "ind": "OA13"}, {"sku": "ASI Hybrid Polyether", "app": "STPE hybrid sealant polyether paintable", "ind": "OA4"}, {"sku": "ASI Siliconized Acrylic Latex", "app": "Paintable siliconized acrylic caulk construction", "ind": "OS2"}, {"sku": "ASI Butyl Sealant", "app": "Butyl rubber sealant glazing and sealing", "ind": "OS2"}, {"sku": "ASI Modified Polyurethane", "app": "Modified PU sealant construction/industrial", "ind": "OA4"}, {"sku": "ASI Acetoxy Silicone", "app": "Acetoxy silicone glazing and general sealing", "ind": "OA12"}], "wins": ["Direct manufacturer pricing vs PE-backed roll-up overhead", "Forza system: adhesive + sealant + tape vs ASI sealant-focused", "No Arsenal Capital PE ownership risk in Forza supply chain", "Stable manufacturer relationship vs Meridian acquisition complexity", "Forza broader vertical coverage: six verticals vs ASI industrial/construction focus"], "moats": ["ASI custom compounding and private label \u2014 meaningful service differentiation", "Meridian platform scale \u2014 access to multiple sealant chemistries under one roof", "Fort Wayne IN manufacturing \u2014 strong Midwest distribution relationships", "Meridian's growing platform creates a broader competitive moat over time"]}, {"id": "bigdog", "name": "Big Dog Adhesives", "brands": "Big Dog Adhesives / BD Series", "hq": "Elkhart, IN", "rev": "Private; est. <$20M", "threat": "LOW", "pitch": "Big Dog Adhesives is a small Elkhart, Indiana MMA, epoxy, and CA adhesive manufacturer serving countertop fabrication, sign making, marine, transportation, RV, and wood markets. They are direct competitors to Forza's structural adhesive portfolio in niche fabrication markets. Their 'no minimums, small orders, private label' model targets small distributors and fabricators Forza may overlook. Forza competes on system breadth and direct manufacturer credibility.", "msgs": [["To the RV / Marine Fabricator", "Big Dog BD560/BD590 MMA adhesives serve RV and marine structural bonding. Forza IC951 covers the same 2-part structural acrylic chemistry with the addition of sealant and tape on the same account from a direct manufacturer."], ["To the Countertop / Sign Fabricator", "Big Dog is purpose-built for countertop seaming and sign markets. Forza IC-series covers general structural bonding in the same fabrication channels at direct pricing."], ["To the Distributor", "Big Dog's 'no minimums, small orders' model serves small distributors. Forza serves distributors of all sizes with direct manufacturer pricing, purpose-built chemistry per vertical, and a complete system offering."]], "seeds": ["Big Dog is a small Elkhart, Indiana company making MMA, epoxy, and CA adhesives primarily for countertop fabrication, sign making, and RV markets. They are a niche specialty player with no sealant, tape, or canister spray capability.", "Big Dog's 'no minimums, small orders, private label' positioning tells you who their customer is: the small fabricator and small distributor who need flexibility over scale. Forza serves that customer too \u2014 and adds sealant and tape to the relationship.", "Big Dog MMA adhesives (BD300, BD560, BD590) compete directly with Plexus and SCIGRIP in RV and marine structural bonding. Same chemistry, smaller company, Indiana-made \u2014 similar story to Forza."], "landmines": [["Company Size", "Plant this: Big Dog is a small private Indiana company. Ask: What is your supply continuity plan if Big Dog has a production issue or capacity constraint? A direct manufacturer with multiple production facilities carries less concentration risk."], ["Adhesive Only", "Plant this: Big Dog makes MMA, epoxy, and CA adhesives \u2014 no sealant, no tape. Ask: For a job that also needs sealant or tape, how many supplier accounts are you running alongside Big Dog?"], ["Niche Market Focus", "Plant this: Big Dog is built for countertop, sign, and RV markets specifically. Ask: Is your primary fabrication application countertop seaming or sign making? If not, how well does Big Dog's formulation match your actual substrate and cure requirements?"]], "objections": [["Big Dog has the countertop seaming adhesive we need", "Countertop seaming is a real niche. For broader structural bonding in marine, transportation, and industrial applications, Forza IC951 covers the same 2-part structural acrylic chemistry at direct pricing."], ["Big Dog has no minimums \u2014 great for small orders", "Forza can also work with distributors of all sizes. The question is whether the chemistry and system breadth make the relationship worth consolidating."], ["Big Dog is Indiana-made like Forza", "True \u2014 both Iowa and Indiana-made adhesives. The difference is Forza adds sealant and tape on the same account, covering all six verticals."]], "crosswalk": [{"sku": "Big Dog BD300 / BD310 / BD330", "app": "2-part MMA fast-cure general structural bonding", "ind": "IC951"}, {"sku": "Big Dog BD560 / BD590", "app": "2-part MMA long working time marine/boat bonding", "ind": "IC951"}, {"sku": "Big Dog BD5405 / BD5410 / BD5420", "app": "2-part epoxy adhesive metals and plastics 5/10/30 min", "ind": "R160"}, {"sku": "Big Dog BDSI 500 / BDSI 5000", "app": "Surface-insensitive cyanoacrylate multi-substrate bonding", "ind": "IC951"}, {"sku": "Big Dog BD Stone Adhesive", "app": "Stone fabrication seaming adhesive granite marble quartz", "ind": "IC951"}], "wins": ["Forza system: adhesive + sealant + tape vs Big Dog adhesive-only", "Forza direct manufacturer with six-vertical coverage", "Multiple production facilities vs Big Dog single Elkhart plant", "Forza canister spray system Big Dog cannot match"], "moats": ["Countertop seaming specialty \u2014 strong in stone fabrication niche", "No minimums / small order flexibility \u2014 serves small fabricators Forza may miss", "Private label capability \u2014 flexible for small distributors", "20+ years MMA expertise in RV and marine niche"]}, {"id": "chemlink", "name": "ChemLink", "brands": "ChemLink / M-1 / DuraLink / NovaLink / BuildSecure / DuraSil / E-Curb", "hq": "Sturgis, MI", "rev": "Private; est. <$50M", "threat": "LOW", "pitch": "ChemLink is a specialty roofing and construction sealant manufacturer out of Michigan \u2014 best known for the M-1 universal polyether adhesive/sealant and the DuraLink sealant series. Their sweet spot is commercial roofing and building envelope. Forza competes in construction and insulation sealants with broader chemistry and a direct manufacturer pricing advantage. ChemLink is a niche player with a loyal roofing contractor following but limited industrial or transportation presence.", "msgs": [["To the Roofing Contractor", "ChemLink M-1 is a solid polyether adhesive/sealant for roofing applications. Forza OS2 and OA4 cover the same moisture-cure polyether chemistry at direct manufacturer pricing with the addition of a tape and adhesive system for the same job."], ["To the Construction Contractor", "ChemLink DuraLink and NovaLink are good joint sealants. Forza's Construction vertical covers the same elastomeric sealant applications plus adhesives and tapes on one account from a direct manufacturer."], ["To the Distributor", "ChemLink is a single-category specialty brand with limited SKU breadth. Forza covers adhesive, sealant, and tape across six verticals. Better shelf, better margin, one account."]], "seeds": ["ChemLink is a small Michigan specialty company focused almost entirely on roofing and building envelope sealants. Their product line is narrow \u2014 polyether sealants, a few silicones, and the E-Curb roofing system. Forza covers a much broader sealant and adhesive portfolio across six verticals.", "ChemLink's M-1 is a polyether moisture-cure adhesive/sealant \u2014 the same basic chemistry as Forza OS2 and OA4. The M-1 brand has strong loyalty in roofing, but the chemistry is not proprietary.", "ChemLink has no canister spray system, no tape line, and no structural adhesive portfolio. They are a sealant-only supplier for a narrow roofing and construction application set. Forza is a single-source system."], "landmines": [["Product Breadth", "Plant this: ChemLink's catalog is roofing and building envelope sealants \u2014 that's it. Ask: For a job that also needs structural adhesive, spray adhesive, or tape, how many supplier accounts are you managing alongside ChemLink?"], ["Company Size", "Plant this: ChemLink is a small private company in Sturgis, Michigan. Ask: What happens to supply continuity if ChemLink has a production issue or capacity constraint? Does a direct manufacturer with multiple production facilities reduce that risk?"], ["Chemistry Exclusivity", "Plant this: M-1 is a polyether moisture-cure sealant \u2014 an industry-standard chemistry. Ask: Is the M-1 chemistry unique to ChemLink, or is the same chemistry available from other manufacturers at better pricing?"]], "objections": [["Our roofers love M-1", "M-1 loyalty is real in roofing. The polyether chemistry is the same as Forza OS2. The switching cost is lower than the price difference. Worth a trial on a non-critical joint to let the chemistry speak."], ["ChemLink is non-toxic and solvent-free \u2014 our guys like that", "Forza OS2 and OA4 are also low-VOC, isocyanate-free formulations. The non-toxic positioning is not exclusive to ChemLink."], ["ChemLink has a roofing system \u2014 E-Curb and ChemCurb", "E-Curb is a genuine system play for pitch pans and penetrations. Forza does not have a direct equivalent roofing penetration system. On standalone sealant applications, Forza covers the same chemistry."]], "crosswalk": [{"sku": "ChemLink M-1", "app": "Moisture-cure polyether structural adhesive/sealant", "ind": "OS2"}, {"sku": "ChemLink NovaLink 35", "app": "Moisture-cure polyether joint sealant damp/cold", "ind": "OS2"}, {"sku": "ChemLink DuraLink 35", "app": "Multi-purpose elastomeric moisture-cure sealant", "ind": "OS35"}, {"sku": "ChemLink DuraLink Siding Plus", "app": "Elastomeric sealant cementitious siding/curtain wall", "ind": "OA4"}, {"sku": "ChemLink BuildSecure", "app": "Fast-set structural adhesive panel-on-frame", "ind": "IC946"}, {"sku": "ChemLink DuraSil", "app": "High-performance silicone adhesive/sealant", "ind": "OA13"}, {"sku": "ChemLink 1-Part Pourable", "app": "Pourable moisture-cure penetration sealant", "ind": "OS35"}], "wins": ["Direct manufacturer pricing vs ChemLink specialty pricing", "Forza broader product line: adhesive + sealant + tape on one account", "Six-vertical coverage vs ChemLink roofing/construction only", "Multiple production facilities vs ChemLink single Michigan plant", "Forza canister spray system \u2014 ChemLink cartridge only"], "moats": ["M-1 brand loyalty in commercial roofing contractor community", "E-Curb/ChemCurb system for pitch pan and penetration sealing \u2014 no Forza equivalent", "Eco/non-toxic positioning resonates with green building specs", "Specialty roofing distribution relationships difficult to displace"]}, {"id": "cycan", "name": "Cycan Industries", "brands": "Cycan / Quality Aerosols (QA) / Cycan Spray Technologies", "hq": "Woodstock, GA", "rev": "Private; Merit Capital PE-backed; est. <$50M", "threat": "MOD", "pitch": "Cycan is a Woodstock, Georgia aerosol and canister adhesive manufacturer \u2014 a direct competitor to Forza in the spray adhesive canister category. They make canister contact adhesives, spray adhesives, and private-label aerosol products for woodworking, HVAC, construction, marine, RV, and manufactured housing. Their new Air-Assisted Adhesive line competes directly with Forza's IC/MC/TC/RC canister system. This is a more direct competitor than most on this list \u2014 they fight for the same production-volume spray adhesive accounts.", "msgs": [["To the Woodworking / Manufactured Housing Fabricator", "Cycan QA canister adhesives and Forza IC-series compete for the same production spray adhesive application. Cycan is a Georgia contract packager; Forza is an Iowa direct manufacturer. Compare chemistry, cost-per-square-foot, and supply reliability."], ["To the HVAC / Insulation Contractor", "Cycan's canister adhesives serve HVAC and insulation markets. Forza RC-series covers the same insulation bonding applications from a direct manufacturer with purpose-built insulation chemistry."], ["To the Distributor", "Cycan and Forza both sell canister spray adhesives. The difference: Forza is a direct manufacturer with a complete system \u2014 canister adhesive + sealant + tape. Cycan is aerosol and canister only, recently acquired by Merit Capital PE."]], "seeds": ["Cycan launched an Air-Assisted Adhesive system in 2024 claiming 27 pounds of adhesive for the price of a 20-pound canister. That is a direct shot at Forza's canister system economics. The claim is worth verifying \u2014 air-assisted delivery systems have different application characteristics than self-propelled canisters.", "Cycan was recently acquired by Merit Capital Partners, a private equity firm. Merit Capital's portfolio strategy typically targets companies for operational improvement and eventual exit. PE ownership in the canister adhesive space means pricing pressure and potential changes to distributor terms.", "Cycan's strength is contract packaging and private label \u2014 their QA brand is secondary to their toll packaging business. That means their branded product margins may not be as competitive as a dedicated direct manufacturer."], "landmines": [["Air-Assisted vs Self-Propelled", "Plant this: Cycan's Air-Assisted Adhesive claims better economics than traditional canisters. Air-assisted systems require a compressor and separate air supply at the point of application. Ask: What is the total infrastructure cost difference between an air-assisted system and a self-propelled canister system at your facility?"], ["PE Ownership", "Plant this: Cycan was acquired by Merit Capital Partners private equity. Ask: Has pricing or product availability changed since the Merit Capital acquisition? PE ownership in adhesives typically means pricing optimization for investor return."], ["Contract Packager First", "Plant this: Cycan's core business is contract packaging for other brands \u2014 toll filling for third parties. Ask: Is your canister adhesive sourced from a company whose primary focus is your chemistry, or from a contract packager filling dozens of different formulations for different clients?"]], "objections": [["Cycan canister is cheaper per pound", "Cost per pound is one metric. Cost per square foot of bonded substrate is the real number. Forza IC-series is formulated for specific applications \u2014 coverage, open time, and bond strength are calibrated for your substrate. Ask Cycan for a coverage comparison on your specific application."], ["QA brand has worked for us for years", "Brand loyalty in canister adhesive is worth something. The question is whether that loyalty should survive a PE acquisition. Forza has been making the same Iowa-direct canister system without acquisition disruption."], ["Cycan Air-Assisted is better economics", "The Air-Assisted claim of 27 lbs for the price of 20 lbs sounds compelling. Verify the total cost including compressor, air supply, and application equipment before the comparison is complete."]], "crosswalk": [{"sku": "Cycan QA Contact Adhesive Canister", "app": "Spray-grade contact cement canister woodworking/upholstery", "ind": "IC933"}, {"sku": "Cycan Q5200 Contact Adhesive", "app": "VOC-compliant contact cement FRP/insulation/plastics", "ind": "IC934"}, {"sku": "Cycan QA Multi-Purpose Spray", "app": "Multi-purpose aerosol/canister spray adhesive", "ind": "IC936"}, {"sku": "Cycan QA High-Strength Contact", "app": "High-tack high-strength spray contact adhesive", "ind": "IC946"}, {"sku": "Cycan HVAC / Insulation Canister", "app": "Canister spray adhesive insulation and HVAC duct liner", "ind": "R160"}, {"sku": "Cycan Marine Spray Adhesive", "app": "Canister spray adhesive marine upholstery/fabrication", "ind": "MC736"}, {"sku": "Cycan Air-Assisted Adhesive", "app": "Air-assisted delivery canister adhesive system", "ind": "IC946"}], "wins": ["Forza direct manufacturer vs Cycan contract packager / PE-backed", "Forza system: canister adhesive + sealant + tape on one account", "Forza purpose-built chemistry per vertical vs Cycan general formulation", "Iowa-made direct manufacturer vs Georgia contract packager with PE overhead", "No Merit Capital PE acquisition risk in Forza supply chain"], "moats": ["Air-Assisted Adhesive system \u2014 novel delivery format competing on economics", "Private label capability \u2014 fills for other brands giving broad channel presence", "Contract packaging relationships \u2014 embedded with multiple distributors", "QA brand loyalty in woodworking and manufactured housing canister accounts"]}, {"id": "dap", "name": "DAP", "brands": "DAP / Dynaflex / Weldwood / Touch 'n Seal / RapidFuse / Power Point / Vulkem Pro", "hq": "Baltimore, MD", "rev": "$1B+ (RPM Consumer segment ~$2.7B)", "threat": "MOD", "pitch": "DAP is the biggest name at the hardware store counter. Their rep sells to contractors, DIYers, and retailers all at once. Forza sells adhesives, sealants, and tapes only, direct to industrial and commercial buyers at manufacturer pricing. Same chemistry categories, different distribution model \u2014 and Forza has a canister spray system DAP does not.", "msgs": [["To the Contractor", "DAP Dynaflex and Weldwood are at Home Depot. Forza is direct manufacturer, better margin, and purpose-built for production volume with a canister spray system DAP does not make."], ["To the Insulation Contractor", "Touch 'n Seal is a good foam system. Forza RC-series covers the same foam and sealant chemistry direct from manufacturer. One PO, one account, full insulation system."], ["To the Distributor", "DAP margin is compressed \u2014 it is one of the most recognized consumer brands in the country, which means price transparency. Forza is a direct manufacturer with protected pricing and no retail shelf competition."]], "seeds": ["DAP is the country's most recognized caulk and sealant brand \u2014 at Home Depot and Lowe's. That name recognition is also the problem: when your customer can price-check Dynaflex 230 on their phone at the jobsite, margin compression is automatic.", "DAP's portfolio is broad by design: caulks, foams, patch and repair, wood filler, and spackling. Their rep covers all of it. Forza's entire operation is adhesives, sealants, and tapes \u2014 that is the difference between a general store and a specialist.", "DAP does not make an industrial canister spray adhesive. Their spray products top out at aerosol cans. Forza's IC/MC/TC/RC canister system is purpose-built for production volume \u2014 a category DAP cannot address."], "landmines": [["Retail Price Transparency", "Plant this: DAP Dynaflex is on the Home Depot shelf and on Amazon. Ask the contractor: When your customer can pull out their phone and see the same product for $8.99 at the store, what does that do to your margin?"], ["Production Volume", "Plant this: DAP aerosol and cartridge products are right-sized for residential repair. Ask: For production volume applications \u2014 bonding insulation, laminating panels \u2014 has anyone priced out the total cost per square foot of aerosol versus a canister system?"], ["Foam System", "Plant this: Touch 'n Seal is a legitimate foam system. Ask: Are you getting manufacturer-direct pricing, or is there a distributor margin layer between you and DAP on the foam products?"]], "objections": [["DAP is what our guys know", "Forza chemistry is the same \u2014 latex sealant, PU sealant, spray adhesive. The training curve is zero. The margin improvement is immediate."], ["DAP is available everywhere", "Available everywhere is also the problem. When everyone has it, nobody wins on price. Forza is direct manufacturer with protected pricing and no Home Depot shelf to compete with."], ["Touch 'n Seal works great for our foam jobs", "Forza RC-series covers the same chemistry. Direct manufacturer, same performance, one account for foam and sealant and tape."]], "crosswalk": [{"sku": "Dynaflex 230 / Ultra", "app": "Elastomeric acrylic latex sealant", "ind": "OS2"}, {"sku": "DAP Premium Polyurethane", "app": "1-part PU construction sealant", "ind": "OA4"}, {"sku": "Weldwood Contact Cement", "app": "Brush-grade contact adhesive", "ind": "IC932"}, {"sku": "RapidFuse All Purpose", "app": "Fast-set multi-surface adhesive", "ind": "IC951"}, {"sku": "Touch 'n Seal 2-Part Foam", "app": "2-component spray foam insulation", "ind": "R519"}, {"sku": "Touch 'n Seal 1-Part Foam", "app": "1-component PU gap foam sealant", "ind": "R221"}, {"sku": "Power Point 300", "app": "High-performance acrylic urethane elastomeric", "ind": "OS35"}, {"sku": "DAP DYNAGRIP Heavy Duty", "app": "Construction adhesive grab", "ind": "IC946"}, {"sku": "DAP Alex Plus", "app": "All-purpose acrylic latex caulk", "ind": "OS2"}, {"sku": "DAP 100% Silicone", "app": "Silicone sealant window/door", "ind": "OA13"}, {"sku": "Phenoseal Vinyl Adhesive Caulk", "app": "Vinyl and tile adhesive sealant", "ind": "IC933"}, {"sku": "AMP Advanced Modified Polymer", "app": "Hybrid polymer sealant", "ind": "OA4"}], "wins": ["No DAP industrial canister spray \u2014 Forza IC/MC/TC/RC unchallenged", "Direct manufacturer pricing vs DAP retail price transparency", "No Home Depot shelf to compete with on distributor pricing", "Forza single-source: adhesive + sealant + tape + cleaner on one PO", "Iowa-made vs Baltimore MD / Dallas TX"], "moats": ["DAP brand name recognition at retail \u2014 cannot displace at Home Depot / Lowe's", "Touch 'n Seal specialty foam systems for mining and roofing niches", "DryDex and Plastic Wood \u2014 patch and repair category outside Forza portfolio", "Spray texture and drywall products \u2014 outside Forza portfolio"]}, {"id": "designpolymerics", "name": "Design Polymerics", "brands": "Design Polymerics / DP Series / Meridian Adhesives Group", "hq": "Santa Ana, CA (Meridian HQ: Houston, TX)", "rev": "Meridian platform est. $500M+; Design Polymerics est. <$75M", "threat": "MOD", "pitch": "Design Polymerics is the HVAC and mechanical insulation sealant specialist now owned by Meridian Adhesives Group (American Securities PE). Their DP-series duct sealants, insulation mastics, and IAQ products are the dominant brand in HVAC contractor channels. Forza's Insulation vertical covers the same duct sealant and insulation adhesive applications at direct manufacturer pricing without the PE roll-up overhead.", "msgs": [["To the HVAC Contractor", "Design Polymerics DP1010 is the duct sealant standard on commercial jobs. Forza R-series covers the same HVAC sealant and insulation adhesive chemistry direct from manufacturer at better pricing."], ["To the Insulation Contractor", "DP insulation mastics and duct liner adhesives are well-specced. Forza's Insulation vertical covers the same sealing and bonding applications for mechanical insulation systems on one direct manufacturer account."], ["To the Distributor", "Design Polymerics is now part of a PE roll-up (Meridian/American Securities). Their pricing will optimize for investor return. Forza is a stable direct manufacturer \u2014 better margin, same chemistry, no acquisition overhead."]], "seeds": ["Design Polymerics just changed hands again \u2014 Meridian was sold from Arsenal Capital to American Securities in September 2022, the same day Design Polymerics was acquired. Two PE ownership changes in rapid succession is a supply chain risk that HVAC distributors should think hard about.", "DP's LEED-qualified, low-VOC duct sealants are their strongest competitive position \u2014 green building spec lock in commercial HVAC. Forza's Insulation vertical covers the same chemistry for standard applications, but the LEED spec is DP's moat.", "Design Polymerics is sealant and mastic only \u2014 no tape, no structural adhesive. Any HVAC or insulation job that also needs tape or adhesive requires a second supplier. Forza covers all three."], "landmines": [["Double PE Ownership Change", "Plant this: Meridian was sold by Arsenal Capital to American Securities Partners the same day they acquired Design Polymerics in September 2022. Ask: How many ownership changes has your Design Polymerics account relationship survived, and what has happened to pricing and terms each time?"], ["LEED Lock", "Plant this: DP's LEED qualification is strong for commercial HVAC specs. Ask: On projects that are not LEED-required, is there a reason to pay the LEED premium when the same duct sealing chemistry is available at better pricing?"], ["Sealant Only", "Plant this: Design Polymerics makes sealants and mastics only. Ask: How many supplier accounts are you running for duct sealant, insulation adhesive, and tape on the same HVAC job?"]], "objections": [["DP1010 is the spec on this commercial HVAC job", "Is it specced by brand or SMACNA performance class? DP1010 is a water-based duct sealant meeting UL 181 standards. Forza R-series covers the same SMACNA performance class at direct pricing. Check whether the spec names the brand or the standard."], ["Design Polymerics is LEED qualified", "LEED qualification matters on LEED projects. On non-LEED commercial and residential HVAC, the same duct sealing chemistry is available from Forza without the LEED premium."], ["We have been with DP for 20 years", "20 years of loyalty survived two PE ownership changes. The chemistry did not change \u2014 ownership did. The question is whether Forza can deliver the same chemistry at better terms on the non-LEED portion of your work."]], "crosswalk": [{"sku": "DP1010 Water-Based Duct Sealant", "app": "UL Listed water-based duct sealant commercial/residential", "ind": "R221"}, {"sku": "DP1010 HP High Pressure Duct Sealant", "app": "High-pressure/high-velocity duct sealant UL Listed", "ind": "R221"}, {"sku": "DP502 Acetoxy Silicone", "app": "100% acetoxy RTV silicone HVAC/construction/appliance", "ind": "OA13"}, {"sku": "DP503 High-Temp Silicone", "app": "High-temperature RTV silicone HVAC", "ind": "OA13"}, {"sku": "DP Insulation Mastic", "app": "Weather-resistant insulation mastic coating", "ind": "R519"}, {"sku": "DP Duct Liner Adhesive", "app": "Water-based adhesive duct liner bonding", "ind": "R160"}, {"sku": "DP IAQ Coating", "app": "Indoor air quality HVAC coating antimicrobial", "ind": "R519"}], "wins": ["Direct manufacturer pricing vs Meridian/PE roll-up overhead", "Forza system: sealant + adhesive + tape on one HVAC account", "No PE ownership risk \u2014 two Meridian ownership changes since 2022", "Forza Insulation vertical purpose-built for mechanical insulation", "Iowa-made vs California manufacturing"], "moats": ["DP LEED-qualified low-VOC duct sealant spec lock in commercial HVAC \u2014 cannot easily displace", "20+ year HVAC contractor loyalty \u2014 deeply embedded", "IAQ product line unique to Design Polymerics", "Meridian platform expanding through acquisition \u2014 growing system breadth"]}, {"id": "dow", "name": "Dow", "brands": "DOWSIL / VORAMER / ROBOND / ROPLEX / Molykote / XIAMETER", "hq": "Midland, MI", "rev": "$43B (2024); adhesives/sealants segment est. $2.7B", "threat": "HIGH", "pitch": "Dow is a $43B global materials science company whose adhesive and sealant portfolio \u2014 DOWSIL silicones, VORAMER polyurethane foam adhesives, and ROBOND/ROPLEX polymer systems \u2014 competes directly with Forza in construction, transportation, industrial, and insulation. DOWSIL alone serves 25,000+ customers globally with 7,000+ products. The Dow rep calling on your account also covers plastics, packaging, and performance coatings. Forza is an adhesive, sealant, and tape specialist \u2014 direct manufacturer, Iowa-made, no commodity plastics distraction.", "msgs": [["To the Construction Contractor", "DOWSIL 795 and Contractors Weatherproofing Sealant are commercial standards. Forza OA13 and OA4 cover the same silicone and hybrid sealant applications at direct manufacturer pricing without the Dow distribution layer."], ["To the Manufactured Housing / RV OEM", "VORAMER polyurethane foam adhesive is the standard for panel bonding in manufactured housing and RV. Forza R-series covers the same structural foam adhesive application at direct pricing \u2014 same chemistry, Iowa-made, no Midland MI conglomerate overhead."], ["To the Distributor", "Dow adhesive and sealant products move through distribution with a significant markup layer. Forza is a direct manufacturer covering the same sealant, adhesive, and tape categories at better distributor margin."]], "seeds": ["Dow is a $43B commodity chemicals and materials science company. Their adhesive and sealant business (DOWSIL, VORAMER) is a fraction of their total revenue \u2014 they also make polyethylene, packaging resins, and specialty plastics. The Dow rep calling on your account has a very different priority list than a Forza adhesive specialist.", "DOWSIL is the former Dow Corning \u2014 the gold standard in silicone chemistry. Dow acquired Dow Corning's silicone business in 2016. The technology is exceptional; the pricing reflects a global chemical conglomerate's cost structure. Forza's sealant chemistry is the same industry standard at direct manufacturer pricing.", "VORAMER polyurethane foam adhesive competes directly with Forza R-series in manufactured housing and construction panel bonding. VORAMER is a Dow product sold through distribution. Forza R-series is a direct manufacturer product \u2014 same foam adhesive category, better distributor margin."], "landmines": [["Conglomerate Scale", "Plant this: Dow is a $43B company making polyethylene, packaging film, and performance coatings. Their adhesive and sealant division is one of many priorities. Ask: When you have an application question on your DOWSIL sealant, how specialized is the Dow person who answers \u2014 and how does that compare to a company whose only business is adhesives, sealants, and tape?"], ["Distribution Markup", "Plant this: Dow sells DOWSIL and VORAMER through industrial distribution. Ask: Are you buying Dow adhesive products direct from Dow or through a distributor? What is the markup layer between Dow's manufacturer price and what you are paying?"], ["DOWSIL Transition", "Plant this: Dow Corning became DOWSIL in 2018 when Dow Chemical acquired the silicone business. The brand has been through a major corporate transition. Ask: Has your DOWSIL product line, pricing, or technical support changed since the Dow Corning to DOWSIL transition?"]], "objections": [["DOWSIL is the spec on this curtainwall project", "Is it specced by brand or ASTM silicone chemistry class? DOWSIL 795 is a neutral-cure medium-modulus silicone. Forza OA13 covers the same chemistry. Check whether the spec names the brand or the performance standard."], ["VORAMER is what our manufactured housing plant uses", "VORAMER is a proven PU foam adhesive for panel bonding. Forza R519 covers the same structural foam adhesive application at direct pricing \u2014 Iowa-made, no distribution markup."], ["Dow has the technical depth we need", "Dow's silicone R&D is world-class. For standard sealant and adhesive applications that don't require Dow's specialty silicone engineering, Forza covers the same performance categories at direct pricing without the conglomerate overhead."]], "crosswalk": [{"sku": "DOWSIL 795 Silicone Building Sealant", "app": "Neutral-cure medium-modulus silicone weatherseal/structural", "ind": "OA13"}, {"sku": "DOWSIL Contractors Weatherproofing Sealant", "app": "Medium modulus moisture-cure weatherproofing sealant", "ind": "OA4"}, {"sku": "DOWSIL 732 Multi-Purpose Silicone", "app": "Acetoxy-cure multi-purpose silicone sealant", "ind": "OA13"}, {"sku": "DOWSIL 734 Flowable Sealant", "app": "Flowable 1-part silicone for sealing and bonding", "ind": "OA12"}, {"sku": "DOWSIL 999-A Silicone Sealant", "app": "All-purpose acetoxy silicone construction sealant", "ind": "OA13"}, {"sku": "VORAMER Industrial Adhesive", "app": "PU foam adhesive manufactured housing/construction panel bonding", "ind": "R519"}, {"sku": "VORAMER MR1006 / MR1010", "app": "Polyurethane foam adhesive RV/modular construction panels", "ind": "R519"}, {"sku": "DOWSIL 3145 RTV Mil-Spec", "app": "MIL-SPEC silicone RTV adhesive/sealant industrial", "ind": "OA13"}, {"sku": "DOWSIL 999-B Silicone", "app": "Acetoxy silicone general industrial sealant", "ind": "OA12"}, {"sku": "ROBOND Acrylic Polymer Sealant", "app": "Acrylic polymer weatherability sealant/caulk", "ind": "OS2"}], "wins": ["Direct manufacturer pricing vs Dow distribution markup layer", "Adhesive specialist vs $43B commodity chemicals conglomerate", "Iowa-made vs Midland MI global chemical company", "Forza single-source: adhesive + sealant + tape on one account", "No DOWSIL brand transition complexity \u2014 Forza stable product line"], "moats": ["DOWSIL silicone chemistry \u2014 world-leading R&D, 7,000+ product portfolio", "VORAMER deeply embedded in manufactured housing and modular construction OEM specs", "Global scale and manufacturing \u2014 30 countries, 36,000 employees", "DOWSIL structural glazing silicones \u2014 specced into major curtainwall projects worldwide", "Dow's materials science integration \u2014 silicone + polyurethane + acrylic in one supplier"]}, {"id": "durodyne", "name": "Durodyne (Duro Dyne)", "brands": "Duro Dyne / Air Seal / Sure-Grip / Roto Bonder / Foil-Grip", "hq": "Bay Shore, NY", "rev": "Private; est. <$100M (HVAC accessories + adhesives combined)", "threat": "LOW", "pitch": "Duro Dyne is North America's leading manufacturer of HVAC sheet metal accessories \u2014 dampers, fasteners, hangers, access doors \u2014 and also produces duct sealants and liner adhesives under the same brand. Their adhesive and sealant line is a secondary product supporting their primary sheet metal accessories business. Forza's Insulation vertical competes in the duct sealant and insulation adhesive category at direct manufacturer pricing.", "msgs": [["To the HVAC Sheet Metal Contractor", "Duro Dyne's duct sealers and liner adhesives come with the rest of the Duro Dyne sheet metal accessories on the same order. For the adhesive and sealant portion specifically, Forza R-series and RC-series offer purpose-built insulation and HVAC chemistry at direct pricing."], ["To the HVAC Distributor", "Duro Dyne's sealant and adhesive line is a supporting product \u2014 their primary business is sheet metal accessories. The sealant chemistry is standard water-based duct sealant. Forza Insulation vertical covers the same category at direct manufacturer pricing with better margin."], ["To the Insulation Contractor", "Duro Dyne liner adhesives are the standard in the HVAC duct liner market. Forza R160 and R221 cover the same duct liner and duct sealant applications as part of a complete insulation system from a direct manufacturer."]], "seeds": ["Duro Dyne is the sheet metal accessories company that also makes duct sealant. Their primary business is dampers, fasteners, hangers, and access doors \u2014 the sealant and adhesive line is secondary. That means Duro Dyne's sealant R&D investment is split across a much broader product portfolio.", "Duro Dyne is a Long Island, New York company founded in 1952. A 70-year-old private company with a primary focus on HVAC hardware accessories, not adhesive chemistry. Forza is an adhesive and sealant specialist with no hardware distraction.", "Duro Dyne duct sealants (Air Seal, Sure-Grip) are transitioning from solvent-based to water-based \u2014 Duro Dyne themselves acknowledge in their catalog that water-based is now the industry preference. Forza R221 is purpose-built water-based from the start."], "landmines": [["Secondary Product", "Plant this: Duro Dyne's primary business is sheet metal accessories \u2014 dampers, fasteners, hangers. The sealant and adhesive line is a supporting product in their catalog. Ask: Is the company whose primary focus is sheet metal hardware really the best source for your duct sealant chemistry?"], ["Solvent Phase-Out", "Plant this: Duro Dyne's own catalog says solvent-based duct sealers are being phased out and water-based is the industry preference. Ask: Has your Duro Dyne sealant transitioned to water-based, and has the chemistry performance remained consistent through the transition?"], ["Geographic Concentration", "Plant this: Duro Dyne is a Bay Shore, New York company. Ask: How does supply reliability compare between a Long Island NY regional manufacturer and a direct national manufacturer?"]], "objections": [["Duro Dyne duct sealer comes with the rest of our Duro Dyne accessories order", "Bundling is convenient. The question is whether the duct sealant chemistry is optimized for your application or selected by convenience. Forza R221 is purpose-built water-based duct sealant at direct pricing."], ["Air Seal is what our sheet metal guys use", "Air Seal is the field standard in HVAC. The water-based version covers the same application as Forza R221. Compare pricing and coverage rate \u2014 the chemistry is industry-standard."], ["Duro Dyne has everything HVAC on one order", "Duro Dyne's full HVAC accessory line is a real convenience. For the adhesive and sealant portion specifically, Forza offers better pricing and purpose-built chemistry on a separate manufacturer account."]], "crosswalk": [{"sku": "Duro Dyne Air Seal Water-Based Duct Sealer", "app": "Water-based duct sealant UL Listed commercial/residential", "ind": "R221"}, {"sku": "Duro Dyne Sure-Grip 404 Solvent Duct Sealer", "app": "Solvent-based synthetic rubber duct sealant (legacy)", "ind": "R221"}, {"sku": "Duro Dyne Zero VOC Duct Sealer", "app": "Zero-VOC premium water-based UL Listed duct sealant", "ind": "R221"}, {"sku": "Duro Dyne Roto Bonder Liner Adhesive", "app": "Duct liner spray adhesive for HVAC duct liner bonding", "ind": "R160"}, {"sku": "Duro Dyne Foil-Grip Tape/Sealant", "app": "UL 181B-FX pressure sensitive duct sealing tape/sealant", "ind": "R519"}, {"sku": "Duro Dyne Insulation Adhesive", "app": "Water-based adhesive bonding insulation board duct", "ind": "R160"}], "wins": ["Forza purpose-built insulation/HVAC chemistry vs Duro Dyne secondary product line", "Direct manufacturer pricing vs hardware accessories company", "Forza system: duct sealant + liner adhesive + tape purpose-built for insulation vertical", "National coverage vs Duro Dyne New York geographic concentration"], "moats": ["Duro Dyne sheet metal accessories bundle \u2014 sealant rides on existing accessory PO", "70-year brand loyalty in HVAC sheet metal contractor community", "Air Seal brand is the field default for duct sealing in sheet metal channels", "Full HVAC accessory ecosystem \u2014 convenient single-source for sheet metal contractors"]}, {"id": "gesealants", "name": "GE Sealants", "brands": "GE Sealants / Momentive / SilPruf / SCS Series / SWS", "hq": "Niskayuna, NY (Momentive) / Brand licensed for retail", "rev": "Momentive ~$6.5B (all silicones); GE Sealants retail brand est. <$200M", "threat": "MOD", "pitch": "GE Sealants is a retail silicone brand originally from GE's silicone division, now part of Momentive (KCC Corporation). Their strength is silicone chemistry \u2014 kitchen, bath, window, door, and glazing. Forza competes in the sealant category with polyurethane, SMP, and MS polymer products. Where GE goes deep in silicone, Forza goes broad across sealant, adhesive, and tape on one account.", "msgs": [["To the Contractor", "GE SCS1000 and Tremsil-type silicones are the jobsite standard for glazing and window sealing. Forza OA13 and OA4 cover the same sealant applications at direct pricing with the added benefit of a single-source for adhesive and tape."], ["To the Distributor", "GE Sealants brand sells on name recognition \u2014 Momentive licenses the GE name for the retail channel. Forza is direct manufacturer across a broader product line. Better margin, broader shelf, one account."], ["To the Construction Specifier", "SilPruf SCS2000 is the glazing benchmark. For non-structural sealant applications, Forza OA4 and OS35 cover the same joint and perimeter sealing needs at direct manufacturer pricing."]], "seeds": ["GE Sealants is a licensed brand \u2014 Momentive acquired GE's silicone division in 2006 and licenses the GE name for consumer and professional sealant products. The GE on the tube is not General Electric anymore; it is KCC Corporation, a Korean chemical company.", "GE Sealants is essentially a silicone-only product line. They do not make adhesives, tapes, or polyurethane sealants. Forza covers silicone-application-equivalent sealants plus adhesives and tape on one account.", "GE Sealants' strongest position is kitchen, bath, and glazing silicone \u2014 consumer and light commercial. Their industrial and construction portfolio is narrow. Outside of glazing, Forza covers most of the same joint and perimeter sealing applications."], "landmines": [["Brand Origin", "Plant this: The GE on the GE Sealants tube comes from a brand license \u2014 Momentive, owned by KCC Corporation in Korea, bought GE's silicone division in 2006. Ask: Is the GE name on the label driving the specification, or is it the chemistry?"], ["Silicone Only", "Plant this: GE Sealants is a silicone-focused line. For adhesive and tape needs on the same job, they need a separate supplier. Ask: How many accounts are you managing for sealant, adhesive, and tape separately?"], ["Distribution Model", "Plant this: GE Sealants brand is sold through retail and distribution. Ask: What is your margin on GE Sealants versus a comparable product from a direct manufacturer with no retail shelf competition?"]], "objections": [["GE Silicone is the spec on this job", "Is it specced by brand or by chemistry? GE SCS1000 is acetoxy-cure silicone. Forza OA13 covers the same application. Let us compare TDS."], ["We trust the GE name", "The GE name on the sealant is a licensed brand from Momentive, owned by KCC Corporation. The chemistry is the same industry-standard silicone. The question is pricing and who you are buying from."], ["SilPruf is the glazing standard", "SilPruf SCS2000 is the structural glazing benchmark \u2014 a legitimate moat. For non-structural perimeter sealing and joint applications, Forza OA4 and OS35 cover the same needs at direct pricing."]], "crosswalk": [{"sku": "GE SCS1000 / SCS1001", "app": "General purpose acetoxy silicone", "ind": "OA13"}, {"sku": "GE SCS2000 / SilPruf", "app": "High-performance weatherseal silicone", "ind": "OA13"}, {"sku": "GE SWS", "app": "Neutral cure economical silicone", "ind": "OS2"}, {"sku": "GE Advanced Silicone 2", "app": "Kitchen & bath 100% silicone", "ind": "OA12"}, {"sku": "GE Concrete Silicone 2", "app": "Concrete and masonry sealant", "ind": "OS35"}, {"sku": "GE Metal Silicone 2", "app": "Metal and exterior applications", "ind": "OA13"}, {"sku": "GE Supreme Kitchen & Bath", "app": "Premium silicone bath sealant", "ind": "OA12"}, {"sku": "GE Window & Door Silicone", "app": "Weatherproof window/door sealant", "ind": "OS2"}, {"sku": "GE Paintable Hybrid Sealant", "app": "Paintable hybrid kitchen/bath", "ind": "OA4"}, {"sku": "SilPruf NB SCS9000", "app": "Low dirt-pickup silicone", "ind": "OA13"}], "wins": ["Direct manufacturer pricing vs GE licensed brand pricing", "Forza broader product line: adhesive + sealant + tape on one account", "No Forza structural glazing competition \u2014 Forza wins on non-structural sealant", "GE brand is licensed (Momentive/KCC) \u2014 GE equity story is weakened", "Forza PU and SMP sealants cover applications GE silicone cannot"], "moats": ["SilPruf SCS2000 structural glazing \u2014 deeply specced and Forza has no structural glazing equivalent", "GE name recognition in silicone \u2014 strongest brand equity in residential sealant", "SCS Series acetoxy-cure chemistry is the glazing contractor default"]}, {"id": "henkel", "name": "Henkel", "brands": "Loctite / Teroson / Technomelt / Bonderite", "hq": "Dusseldorf, Germany", "rev": "$11B+ adhesives", "threat": "HIGH", "pitch": "Loctite is a $10B+ German conglomerate sold through a multi-tier distribution chain. Forza is a family-owned manufacturer in Council Bluffs, Iowa. When you call Forza, you get the chemist. When you call Loctite, you get a distributor rep. Forza has won business directly from Loctite.", "msgs": [["To the Structural Adhesive Buyer", "Loctite H8000 is a proven methacrylate. So is Forza IC951 and TC471. The difference: when you have a technical question, you call Forza and get an Iowa chemist. You call Loctite and get a distributor."], ["To the Transportation Sealant Buyer", "Teroson MS 930 and Forza T-OS151 are both 1-part MS polymer sealants. Same chemistry, same application. Direct manufacturer pricing vs. distributor margin."], ["To the Distributor", "You are selling Loctite at distributor margin. Forza is a direct manufacturer. Same chemistries, better margin, Iowa-made, and your customers get direct technical support."]], "objections": [["Loctite is the industry standard", "Standard means familiar, not optimal. Forza IC951 and TC471 match Loctite H8000 chemistry and have displaced it in the field."], ["We have been specced on Loctite", "Specced by chemistry or brand name? Most specs call for 2-part methacrylate. Forza IC951 meets the same chemistry requirement."], ["Teroson is approved on our trailer line", "Approved by chemistry or by name? Teroson MS 930 is 1-part SMP, so is Forza T-OS151. If the spec is chemistry-based, Forza qualifies."], ["Henkel has global technical support", "Global support means a ticket system and a distributor in the middle. Forza technical team is in Council Bluffs, IA. Direct line. Same day."]], "seeds": ["Loctite is the world largest adhesive brand, owned by a $20B+ German conglomerate with 50,000+ employees. A multi-tier distribution chain and ticket-queue technical support. Forza is family-owned in Council Bluffs, Iowa. When you call with a structural bond problem at 7am, you get a chemist.", "Teroson MS polymer sealants and Forza T-OS151 are the same chemistry: 1-part moisture cure SMP. Teroson is a Henkel brand sold through industrial distribution at distributor margin. Forza is the manufacturer. Same chemistry, direct pricing, Iowa-made.", "Henkel US distribution is built around Fastenal and Grainger. Every relationship has a margin layer between Henkel and the end customer. Forza sells direct."], "landmines": [["Distribution Chain", "Plant this: Loctite is distributed through a multi-tier chain. Every tier adds margin and removes direct manufacturer access. Ask Loctite: How long does it take to get a chemist on the phone versus a distributor rep?"], ["Chemistry Spec", "Plant this: Loctite H8000 is specified by name on a lot of drawings. Most engineers specced it by name because it was the first 2-part methacrylate they qualified. Ask Loctite: Is the H8000 requirement specced by brand name or by chemistry?"], ["Teroson Chemistry", "Plant this: Teroson MS polymer and Forza T-OS151 are the same chemistry. Ask Teroson: Is that a chemistry specification or a brand preference?"], ["Rep Coverage", "Plant this: A Loctite rep calling on a transportation fabricator is the same rep calling on a semiconductor plant. Ask Loctite: How many different industries does your rep cover?"], ["Technomelt Cost", "Plant this: The contractor buying Technomelt through distribution is paying three margin layers for a product with a domestic equivalent. Ask Technomelt: Have you compared total delivered cost against a domestically manufactured equivalent sourced direct?"]], "wins": ["Iowa family manufacturer vs. German conglomerate", "Forza has won business directly from Loctite accounts", "Direct manufacturer relationship - chemist on the phone", "ForzaTape: Loctite has no tape product line", "RuggedRed: Henkel has no industrial cleaner brand"], "moats": ["Loctite threadlockers - no Forza equivalent", "Loctite anaerobic sealants - no Forza equivalent", "Teroson RB rubber seam sealer - narrow automotive OEM", "Bonderite metal treatment / phosphating - outside Forza"], "crosswalk": [{"sku": "H8000 / H8003 / H8100", "app": "2-part methacrylate structural", "ind": "IC951"}, {"sku": "H8600 / H8610", "app": "Galvanized steel structural", "ind": "IC951"}, {"sku": "H3300 SpeedBonder", "app": "Automotive-grade 2-part MMA", "ind": "IC951"}, {"sku": "H4500", "app": "Thixotropic 2-part MMA", "ind": "IC951"}, {"sku": "E-05MR / E-20HP", "app": "2-part epoxy structural", "ind": "R160"}, {"sku": "Loctite 401 / 406 / 495", "app": "Instant/CA adhesive", "ind": "CA1000 / CA1500"}, {"sku": "Loctite 4203", "app": "CA elastomer modified", "ind": "CA2400"}, {"sku": "SI 5900 / 5910", "app": "RTV silicone gasketing", "ind": "OS35"}, {"sku": "Teroson MS 930NA / 939", "app": "1-part SMP sealant, primerless", "ind": "OS2"}, {"sku": "Teroson MS 9222 / 9381", "app": "SMP cargo/heavy equipment", "ind": "OA4"}, {"sku": "Teroson PU 8596 / 8598", "app": "1-part PU transportation", "ind": "OA4"}, {"sku": "Technomelt 0450", "app": "Foam/fabric/EPS hot melt", "ind": "H103 / H176"}, {"sku": "Technomelt SUPRA EVA", "app": "Packaging hot melt", "ind": "H117 / H163"}, {"sku": "Technomelt PUR", "app": "Reactive PU hot melt", "ind": "H167"}, {"sku": "Bonderite C-IC 8200", "app": "IPA cleaner/activator, pre-bond", "ind": "OSA"}]}, {"id": "ipg", "name": "IPG (Intertape)", "brands": "IPG / Intertape / Cantech / DEWALT Tape / Anchor / American Tape", "hq": "Sarasota, FL / Montreal, QC", "rev": "~$1.5B (2022, private since 2022 \u2014 Clearlake Capital)", "threat": "MOD", "pitch": "IPG is one of the largest tape manufacturers in North America \u2014 pressure-sensitive, water-activated, duct, filament, HVAC, double-coated, and specialty tapes across industrial, construction, and packaging markets. They are a tape-first company with no adhesive or sealant. Forza competes directly in the industrial, transportation, and construction tape categories with a direct manufacturer advantage and the ability to bundle tape with adhesive and sealant on one account.", "msgs": [["To the Industrial Distributor", "IPG carries every tape category but nothing outside tape. Forza covers the same tape verticals \u2014 industrial, transportation, construction \u2014 plus adhesive and sealant on the same PO. One account, more shelf, better margin."], ["To the Transportation OEM", "IPG's automotive and transportation tapes are solid. Forza T-series covers the same acrylic foam, double-coated, and specialty tape applications at direct pricing with the added benefit of a sealant and adhesive for the same assembly."], ["To the Construction Contractor", "IPG has HVAC, flashing, and construction tape. Forza RC and CC series cover the same construction tape applications as part of a complete sealant and adhesive system from one direct manufacturer."]], "seeds": ["IPG was taken private in 2022 by Clearlake Capital in a $2.6 billion leveraged buyout. Private equity ownership typically means cost discipline, margin optimization, and potential distribution changes. That is a disruption window for distributors who are currently relying on IPG as a primary tape supplier.", "IPG makes tapes \u2014 only tapes. No adhesive, no sealant, no cleaner. Forza covers tape plus the full bonding and sealing system. An IPG account is a single-category relationship; a Forza account is a system relationship.", "IPG is a packaging-first company that also makes industrial and specialty tapes. Their primary revenue is carton sealing, stretch film, and packaging. The industrial and construction tape portfolio is secondary to their packaging business \u2014 which means the tape your contractor is buying may not be IPG's first priority."], "landmines": [["Private Equity Ownership", "Plant this: IPG was taken private by Clearlake Capital in a $2.6B leveraged buyout in 2022. Private equity typically optimizes for margin and exit, which can mean price increases, SKU rationalization, or distribution changes. Ask: Has IPG changed pricing or terms since the Clearlake acquisition?"], ["Tape Only", "Plant this: IPG makes tapes only. For the same job that needs tape plus adhesive or sealant, you are managing two supplier accounts. Ask: What is the cost of managing two purchase orders, two delivery schedules, and two vendor relationships for one job?"], ["Packaging First", "Plant this: IPG's largest business is packaging tape and stretch film for e-commerce and distribution. The industrial and specialty tape lines are a secondary priority. Ask: When IPG has a supply issue, which customer segment gets priority \u2014 the packaging customer or the industrial tape customer?"]], "objections": [["IPG has every tape we need", "Forza covers industrial, transportation, and construction tapes in the same categories. The difference is: Forza also supplies the adhesive and sealant for the same job on one PO, and Forza is a direct manufacturer with no PE ownership overhead."], ["IPG pricing is competitive", "IPG pricing reflects a $2.6B leveraged buyout. Clearlake Capital needs a return on that investment. Forza is direct manufacturer with no PE layer. Compare net landed cost on the specific tape grades you are buying."], ["We use DEWALT tape from IPG", "DEWALT tape is an IPG-licensed brand \u2014 the DEWALT name on the tape is a license agreement, not a DEWALT product. The same tape chemistry is available from Forza at direct pricing."]], "crosswalk": [{"sku": "IPG Double-Coated Foam Tape", "app": "Double-coated foam mounting/bonding tape", "ind": "T215"}, {"sku": "IPG Double-Coated Acrylic Film Tape", "app": "Acrylic film double-coated general bonding", "ind": "T215"}, {"sku": "IPG Acrylic Foam Tape", "app": "Acrylic foam structural attachment", "ind": "T220"}, {"sku": "IPG HVAC Tape / Flashing Tape", "app": "HVAC foil and building flashing tape", "ind": "T305"}, {"sku": "IPG Filament/Strapping Tape", "app": "Fiberglass filament strapping tape", "ind": "T465"}, {"sku": "IPG Duct Tape", "app": "Cloth reinforced duct and utility tape", "ind": "T305"}, {"sku": "IPG High Performance Specialty Tape", "app": "Specialty bonding and masking tape", "ind": "T532"}, {"sku": "IPG Double-Coated Tissue Tape", "app": "Tissue double-coated light duty bonding", "ind": "T205"}, {"sku": "IPG Glass Cloth Tape", "app": "Glass cloth high-temp specialty tape", "ind": "T710"}], "wins": ["Direct manufacturer pricing vs IPG with PE leverage overhead", "Forza single-source: tape + adhesive + sealant on one PO", "No PE ownership risk \u2014 stable manufacturer relationship", "DEWALT brand on IPG tape is a license, not an endorsement", "Forza tape cross in every vertical IPG competes in"], "moats": ["IPG tape breadth is unmatched \u2014 widest SKU range in North America", "Water-activated tape and packaging tape \u2014 outside Forza portfolio", "Stretch and shrink film \u2014 outside Forza portfolio", "DEWALT licensed brand creates pull-through at retail and pro desk", "Scale manufacturing: 22 North American plants drive cost advantage"]}, {"id": "itwplexus", "name": "ITW Plexus", "brands": "Plexus / MA Series / AO Series", "hq": "Glenview, IL", "rev": "ITW $15.9B (2024); Plexus est. <$200M", "threat": "MOD", "pitch": "Plexus is ITW's 2-part methacrylate structural adhesive line \u2014 the gold standard for bonding composites, thermoplastics, and dissimilar materials without surface prep. Their territory is structural bonding in transportation, composites fabrication, and marine. Forza R160 and R221 epoxy systems and IC951 acrylic cover many of the same structural bonding applications at direct manufacturer pricing without the ITW distribution layer.", "msgs": [["To the Transportation OEM", "Plexus MA300/MA320 is the standard for bonding composite panels to metal frames. Forza IC951 is a 2-part acrylic structural adhesive covering the same no-prep bonding requirement at direct pricing."], ["To the Marine Fabricator", "Plexus AO420 is strong for composite hull bonding. Forza R160 and the Composites vertical cover structural bonding in fiberglass and carbon fiber applications at direct manufacturer pricing."], ["To the Composites Fabricator", "Plexus is a great product. It is also exclusively a 2-part cartridge system with no spray or canister option. Forza has both 2-part structural and canister spray systems for the composites vertical."]], "seeds": ["Plexus is ITW's specialty structural adhesive \u2014 a $15.9B industrial conglomerate's niche product line. The Plexus rep also covers welding equipment, food service equipment, and test instruments. Forza is an adhesive, sealant, and tape specialist with nothing else on the truck.", "Plexus is exclusively a 2-part methacrylate cartridge system. There is no Plexus spray adhesive, no Plexus canister system, no Plexus sealant. Forza covers the full bonding and sealing system in one account.", "Plexus pricing reflects ITW's distribution model \u2014 industrial distribution markup on top of a conglomerate margin structure. Forza is direct manufacturer. The chemistry gap between MA300 and Forza IC951 2-part acrylic is narrower than the price gap."], "landmines": [["Conglomerate Portfolio", "Plant this: ITW makes welding machines, food equipment, and test instruments. Their Plexus adhesive rep carries a portfolio that spans seven business segments. Ask: When you have a technical adhesive question on a composite bonding application, how specialized is the ITW person who answers?"], ["No Spray System", "Plant this: Plexus is cartridge-only. For high-volume composite bonding where spray application would improve throughput, Plexus has no answer. Ask: Have you priced out the labor cost difference between cartridge dispensing and a spray system at your production volume?"], ["Distribution Pricing", "Plant this: Plexus moves through industrial distribution. Ask: Are you buying Plexus direct from ITW or through a distributor? If through distribution, what is the markup layer between ITW's manufacturer price and what you are paying?"]], "objections": [["Plexus bonds without surface prep \u2014 nothing else does that", "Forza IC951 is a 2-part acrylic structural adhesive with primerless adhesion to composites, thermoplastics, and metals. The no-prep claim is not exclusive to Plexus. Compare TDS on adhesion to your specific substrates."], ["We have used Plexus for 10 years on this line", "Ten years of reliability is real. So is the pricing. Forza IC951 covers the same structural bonding chemistry. Let us run a side-by-side on your specific substrate and see if the performance matches at direct pricing."], ["Plexus is specced for this application", "Is it specced by name or by chemistry class? 2-part methacrylate structural adhesive is a chemistry standard, not a brand lock. Ask whether the spec allows equal chemistry alternatives meeting the same performance standard."]], "crosswalk": [{"sku": "Plexus MA300", "app": "2-part MMA structural adhesive metal/composite/plastic", "ind": "IC951"}, {"sku": "Plexus MA310", "app": "2-part MMA medium cure high stiffness structural", "ind": "IC951"}, {"sku": "Plexus MA320", "app": "2-part MMA high strength low temp toughness", "ind": "IC951"}, {"sku": "Plexus MA420", "app": "2-part MMA fast cure direct-to-metal", "ind": "IC951"}, {"sku": "Plexus MA205HV", "app": "2-part MMA rapid cure composites electronics", "ind": "IC951"}, {"sku": "Plexus AO420", "app": "2-part MMA composite bonding transportation", "ind": "IC951"}, {"sku": "Plexus AO610", "app": "2-part MMA galvanized metal bonding", "ind": "IC951"}], "wins": ["Direct manufacturer pricing vs ITW distribution layer", "Forza IC951 covers same 2-part structural acrylic chemistry", "Forza has canister spray system \u2014 Plexus is cartridge only", "Forza single-source: structural adhesive + sealant + tape", "Adhesive specialist vs ITW 7-segment conglomerate"], "moats": ["Plexus brand deeply embedded in transportation OEM composite specs", "MA300/MA320 series primerless adhesion to Alodined aluminum \u2014 aerospace spec", "No Forza equivalent for ultra-high-performance structural bonding on aerospace substrates", "ITW engineering support and application testing infrastructure"]}, {"id": "manus", "name": "Manus Products", "brands": "Manus-Bond STP / Silicone / PU", "hq": "Waconia, MN", "rev": "Independent / Private", "threat": "MODERATE-HIGH", "pitch": "Manus is a Midwest sealant manufacturer, ISO 9001, 65+ years, Waconia, MN. Solid sealant line, zero spray adhesives, zero tapes, zero industrial cleaners. Every contractor buying Manus 75-AM still needs bonding tape and cleaner for the same job. Forza supplies all four from Council Bluffs, Iowa.", "msgs": [["To the Construction Contractor", "Manus 75-AM and Forza OS2/C-OS9 are both STP polyether sealants. Same chemistry. Forza also supplies bonding tape and surface cleaner for the same job. Manus cannot."], ["To the Transportation Fabricator", "Manus 75-AM-HV and Forza T-OA156 are both high green strength STP for transportation assembly. Forza also supplies bonding tape and spray adhesive for the same build. Manus makes neither."], ["To the Distributor", "You carry Manus for sealant. Your customer still needs bonding tape and cleaner from a second supplier. Forza fills all four from one Iowa manufacturer."]], "objections": [["Manus 75-AM is what we have always used", "Forza OS2/C-OS9 is the same STP polyether chemistry. Forza also supplies bonding tape and cleaner for the same job on the same PO."], ["Manus has more sealant variants", "True. Their 75-AM family is deep. Where Manus cannot follow is tape, spray adhesive, and cleaner."], ["Manus is also a Midwest manufacturer", "They are. Waconia, MN. Forza is Council Bluffs, Iowa. The difference is Forza mak
