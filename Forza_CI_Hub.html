es adhesive, sealant, tape, and cleaner. Manus makes two of those four."], ["Manus does not serve Marine", "Correct. Manus has no Marine vertical. Forza M-OS789 and MC-series cover every marine sealing and bonding application."]], "seeds": ["Manus Products is an independent sealant manufacturer in Waconia, MN. 65 years in business, ISO 9001. They make zero spray adhesives, zero tapes, and no industrial cleaner line. Every contractor buying Manus still needs all three from somewhere else.", "The small Midwest manufacturer story is Manus story too. You cannot out-Midwest them on geography. What you can do is out-breadth them: Forza makes adhesive, sealant, tape, and cleaner. Manus makes two of those four.", "Manus has no Marine vertical and no Composites vertical. Zero products, zero coverage. Every marine fabricator and composites shop is already buying from someone other than Manus."], "landmines": [["Full Job Supply", "Plant this: The contractor buying Manus 75-AM still needs bonding tape, spray adhesive, and surface cleaner for the same job. Ask Manus: For a job that needs sealant, bonding tape, spray adhesive, and surface cleaner, how many separate suppliers are you ordering from?"], ["STP Depth vs Breadth", "Plant this: Manus 75-AM has 30+ variants. All built around sealants and adhesives. Forza covers the same chemistry plus the tape and cleaner Manus cannot supply. Ask Manus: For jobs where you need bonding tape and cleaner, are those coming from Manus or a separate supplier?"], ["Marine and Composites", "Plant this: Manus has no Marine vertical and no Composites vertical. Ask Manus: For your marine and composites customers, what are they buying for sealant and adhesive?"], ["Single Source", "Plant this: Most contractors buying Manus have never asked whether one manufacturer could supply sealant, bonding tape, and surface cleaner from the same source. Ask Manus: Has any supplier ever offered to also supply your bonding tape and cleaner from the same manufacturer?"], ["Spray Adhesive Gap", "Plant this: Manus makes no spray adhesive. Ask Manus: For spray adhesive on the same jobs where you are using Manus sealant, is that coming from Manus or a second supplier?"]], "wins": ["Forza makes spray adhesives - Manus makes ZERO", "Forza makes tapes - Manus makes ZERO", "RuggedRed cleaners - Manus has no cleaner line", "Marine vertical - Manus has no Marine products at all", "Single-source: four categories vs. Manus two"], "moats": ["Butyl sealant line - no Forza butyl equivalent", "Acrylic latex caulk line - no Forza latex equivalent", "PU foam sealant line - no Forza equivalent", "75-AM variant depth (30+ SKUs)"], "crosswalk": [{"sku": "75-AM All Purpose", "app": "Multi-surface STP sealant/adhesive", "ind": "OS2"}, {"sku": "75-AM-HV High Green Strength", "app": "Transportation high tack bonding", "ind": "OA4"}, {"sku": "75-AM-FS Fast Skinning", "app": "Transportation seam / fast skin", "ind": "OS2"}, {"sku": "75-AM-FC Fast Cure", "app": "Fast cure construction/transport", "ind": "OS2"}, {"sku": "75-AM-MA-XX Marine Xtreme", "app": "Marine sealing and bonding", "ind": "M-OS789 / M-OS796"}, {"sku": "75-AM-XX Xtreme Xterior", "app": "UV resistant exterior sealant", "ind": "OS2"}, {"sku": "75-AMC / 75-AMC-XC", "app": "Concrete joint / Xtreme Construction", "ind": "OS2"}, {"sku": "76-AM Self-Leveling", "app": "Self-leveling joint sealant", "ind": "OS2"}, {"sku": "77-AMP / 77-HR", "app": "Polyurethane / modified PU", "ind": "OA4"}, {"sku": "73-A / 73-GP / 75-A", "app": "General purpose / FDA silicone", "ind": "OS35"}, {"sku": "33-MS", "app": "MS Polymer ASTM C920 hybrid", "ind": "OS2"}, {"sku": "FW-15-NS Flex-Weld", "app": "Epoxy hybrid, UV resistant", "ind": "R160"}]}, {"id": "newstar", "name": "NewStar Adhesives", "brands": "EverStrong / EverHold / EverBond", "hq": "Massachusetts", "rev": "Independent / Private", "threat": "MODERATE", "pitch": "NewStar does one thing, contact and spray adhesives. They are proud of it. But every contractor buying EverStrong still needs sealant, tape, and cleaner for the same job. Forza makes the adhesive and everything else from Council Bluffs, Iowa.", "msgs": [["To the Industrial Contractor", "EverStrong is a solid spray adhesive. The moment you need sealant, tape, or cleaner for the same job, you are calling someone else. ForzaBond covers the same applications, Iowa-made, and gives you the rest from one manufacturer."], ["To the Distributor", "You carry NewStar for adhesive. You have no sealant, tape, or cleaner to put next to it. Forza fills all four categories and the adhesive competes directly with EverStrong across every application."]], "objections": [["EverStrong is what we have always used", "ForzaBond IC/MC-series covers the same substrates. The difference is you get sealant, tape, and cleaner from the same manufacturer on the same PO."], ["NewStar canister return program saves money", "Returnable canisters require return freight scheduling and tracking. Forza ships standard with no return logistics. Compare total cost of ownership, not just unit cost."], ["NewStar specializes, that is better", "Forza adhesive line has been in market since 1979. Specialization is their pitch. Single-source supply is ours."]], "seeds": ["NewStar makes a great contact and spray adhesive. EverStrong has been in the market for decades and performs. But they make adhesives. The contractor buying ES10+ still needs sealant, tape, and cleaner. NewStar cannot supply any of it.", "NewStar returnable canister program is a real feature and a real logistics dependency. Return freight, scheduling, tracking, overhead on every canister. Forza ships standard packaging with no return program required.", "NewStar is headquartered in Massachusetts with operations in Georgia and North Carolina. No Midwest manufacturing. Forza is manufactured 100% in Council Bluffs, Iowa, every SKU."], "landmines": [["Single Source", "Plant this: NewStar tagline is We do one thing and we do it well. That is their ceiling. Ask NewStar: For a job that needs spray adhesive, sealant, bonding tape, and surface cleaner, how many separate suppliers are you currently ordering from?"], ["Canister Return Cost", "Plant this: Returnable canisters require coordinated return freight, tracking, and scheduling. That overhead does not appear in the unit cost. Ask NewStar: What does the full return process cost in time and labor per month?"], ["Geography", "Plant this: NewStar operates out of Massachusetts, Georgia, and North Carolina. Ask NewStar: Where is EverStrong actually manufactured, which facility, which state?"], ["Cross-Category Support", "Plant this: NewStar technical support is built around one category. Ask NewStar: If I have a question about how my spray adhesive interacts with the sealant and tape on the same assembly, does NewStar have technical support for that?"], ["EverBond Private Label", "Plant this: NewStar EverBond is a private-label version of EverStrong chemistry with a distributor margin stacked on top. Ask NewStar: Do you know who actually manufactures the adhesive you are buying?"]], "wins": ["Single-source: Forza supplies 4 categories vs. NewStar 1", "Iowa-made vs. MA/GA/NC manufacturing", "ForzaBond covers every EverStrong application", "EverBond private-label, distributors may not know it is NewStar", "No canister return logistics dependency with Forza"], "moats": ["EverStrong brand recognition in industrial/marine channel", "EverHold well-established in marine fabrication shops", "30+ years of adhesive-specialist positioning", "Pionite/Nevamar HPL channel relationships deeply entrenched"], "crosswalk": [{"sku": "ES10+ / ES10 ZERO", "app": "Industrial contact spray", "ind": "IC932 / IC933 / IC936"}, {"sku": "ES20 / ES25 / ES36", "app": "High strength contact", "ind": "IC933 / IC934"}, {"sku": "ES55 / ES60 / ES80", "app": "Heavy duty laminating", "ind": "IC946 / IC947 / IC951"}, {"sku": "ES99 / ES99 LVoc", "app": "Low VOC spray adhesive", "ind": "IC936 / IC946"}, {"sku": "ES40 EPS Foam", "app": "EPS foam bonding", "ind": "IC947"}, {"sku": "N600 / N610 / N614", "app": "Marine foam and upholstery", "ind": "MC722 / MC723 / MC724"}, {"sku": "N620 / N677", "app": "Marine structural laminating", "ind": "MC736 / MC737"}, {"sku": "N900 / N901", "app": "Vacuum infusion / mold", "ind": "MC741"}, {"sku": "NCC Citrus Cleaner", "app": "Adhesive cleaner", "ind": "RuggedRed Citrus"}]}, {"id": "quin", "name": "Quin Global Americas", "brands": "Tensorgrip / QDEK", "hq": "UK HQ / Omaha NE", "rev": "Global / Private", "threat": "HIGH", "pitch": "Quin Global Americas runs a UK-headquartered spray adhesive operation out of Omaha, same metro as Forza. Their canister system is compatible with Forza hardware. The switch from Tensorgrip to Forza is a product decision, not a hardware decision.", "msgs": [["To the Industrial Contractor", "Your canister gun already runs ForzaBond. The chemistry is the same application range as Tensorgrip P-series, Iowa-made, and Forza also supplies sealant and tape for the same job. Quin cannot."], ["To the Marine Fabricator", "Tensorgrip M-series covers marine spray adhesive. So does ForzaBond MC-series, same applications, Iowa-made, and the gun already runs Forza. Add ForzaSeal marine sealant on the same order."], ["To the Distributor", "Your customers guns already run ForzaBond. Add Forza and you add sealant, tape, and cleaner to the same shelf without asking your customer to change equipment."]], "objections": [["Tensorgrip is what we have always run", "Your canister system already runs ForzaBond. The switch is a product decision, not a hardware decision. ForzaBond IC/MC/TC-series covers the same applications plus sealant and tape."], ["Quin is local, they are in Omaha", "Forza is in Council Bluffs, Iowa, same metro. And Forza is Iowa-made, family-owned. Quin Global is a UK-headquartered company operating a US sales office."], ["Tensorgrip has 100+ distributors", "The question is who gives the distributor a complete shelf: adhesive, sealant, tape, and cleaner. Quin can only fill one of those four."], ["Quin has a good marine line", "Tensorgrip M-series is solid. ForzaBond MC-series covers the same marine adhesive applications plus ForzaSeal marine sealant and ForzaTape. Quin cannot."]], "seeds": ["The canister system is compatible with Forza hardware, which means a contractor on Tensorgrip can run ForzaBond adhesive tomorrow without changing a single piece of equipment. The switch is a product decision, not an infrastructure decision.", "Quin Global Americas operates out of Omaha, Nebraska. Forza is in Council Bluffs, Iowa, same metro, same regional distributors, same contractor base. The difference is Quin is a UK-headquartered global company. Forza is a family-owned Iowa manufacturer.", "Quin makes adhesives only. They make zero sealants, zero tapes, and no industrial cleaner. Every contractor buying Tensorgrip still needs all three from somewhere else. Forza supplies all four, and the gun already runs Forza."], "landmines": [["Canister Compatibility", "Plant this: A contractor currently running Tensorgrip can load ForzaBond in the same gun tomorrow, no hardware change. Ask Quin: Has anyone told you that your existing canister gun is compatible with ForzaBond, meaning the switch is purely a product decision?"], ["Full Job Supply", "Plant this: The contractor buying Tensorgrip P-series still needs sealant, bonding tape, and surface cleaner for the same job. Ask Quin: For a job that needs spray adhesive, sealant, bonding tape, and cleaner, how many separate suppliers are you ordering from?"], ["Domestic Content", "Plant this: Quin Global is headquartered in the UK. Their US entity is a sales office in Omaha. Ask Quin: Where is Tensorgrip actually manufactured, which country, which facility?"], ["Marine Gap", "Plant this: Forza also supplies ForzaSeal marine sealant and ForzaTape for the same boat build. Ask Quin: For sealant and bonding tape on the same build where you are using Tensorgrip, is that coming from Quin or a separate supplier?"], ["EPO Reefer", "Plant this: Quin EPO-series is for reefer trailer repair only. Forza covers the same applications plus the full Transportation vertical. Ask Quin: For a reefer trailer repair job, what are you using for sealant, bonding tape, and surface primer?"]], "wins": ["Compatible canister system, the switch is a product decision not hardware", "ForzaSeal: 24 sealant SKUs. Quin makes ZERO sealants", "ForzaTape: 22 tape SKUs. Quin makes ZERO tapes", "Iowa-made vs. UK-headquartered US sales office", "Single-source: four categories vs. Quin one"], "moats": ["QDEK roofing adhesive, no Forza roofing spray equivalent", "100+ US distributor relationships, established footprint", "Marine M-series is solid, established in the channel"], "crosswalk": [{"sku": "P390 Non-Flam", "app": "Industrial non-flam HAPs-free contact", "ind": "IC932"}, {"sku": "P307 / P313 Low VOC CA", "app": "Industrial low VOC canister spray", "ind": "IC936"}, {"sku": "P308 High Tack CA", "app": "Industrial high tack contact", "ind": "IC933"}, {"sku": "P315 High Temp", "app": "Industrial high temp contact", "ind": "IC934 / IC946"}, {"sku": "P322 / P323 Fast Dry PSA", "app": "Industrial PSA web spray", "ind": "IC946 / IC947"}, {"sku": "P321 Polystyrene Foam", "app": "EPS / polystyrene foam bonding", "ind": "IC947"}, {"sku": "M87 / M88 Marine GP", "app": "Marine non-flam / general purpose", "ind": "MC722 / MC723 / MC724"}, {"sku": "M70 / M60 Marine Low VOC", "app": "Marine low VOC contact spray", "ind": "MC722 / MC723"}, {"sku": "M52 / M50 Marine PSA", "app": "Marine high temp and fast dry PSA", "ind": "MC736"}, {"sku": "M55 / M31 / M30 Infusion", "app": "Marine infusion / mold adhesive", "ind": "MC741"}, {"sku": "EPO-ZF Zero-Flam", "app": "Reefer trailer repair, zero flam", "ind": "IC932"}, {"sku": "EPO-CA", "app": "Reefer trailer repair adhesive", "ind": "IC932"}, {"sku": "EPO-CAL Low VOC", "app": "Low VOC reefer repair", "ind": "IC936 / IC946"}]}, {"id": "scigrip", "name": "SCIGRIP", "brands": "SCIGRIP / SG Series / SG200 / SG300 / SG5000 / SG7706", "hq": "Durham, NC (Americas); Wellingborough, UK (Scott Bader parent)", "rev": "Scott Bader ~\u00a3273M (~$340M) total; SCIGRIP est. <$100M", "threat": "MOD", "pitch": "SCIGRIP is Scott Bader's structural MMA adhesive brand \u2014 a direct competitor to ITW Plexus in composites, marine, and transportation bonding. Like Plexus, it is a 2-part cartridge system with no spray capability and no sealant or tape. Forza R160 and IC951 cover the same structural bonding category. The SCIGRIP story gives you a second wedge into any account running Plexus \u2014 same chemistry, different brand, and Forza direct pricing beats both.", "msgs": [["To the Marine Fabricator", "SCIGRIP SG200 and SG300 are solid for composite hull and stringer bonding. Forza R160 and IC951 cover the same structural bonding chemistry direct from manufacturer, and Forza adds sealant and tape on the same account."], ["To the Composites Fabricator", "SCIGRIP competes directly with Plexus in your shop. Forza IC951 covers the same 2-part structural acrylic category at direct pricing. The chemistry difference between SCIGRIP and Forza is smaller than the price difference."], ["To the Transportation OEM", "SCIGRIP AO series is transportation-focused, same as Plexus MA320. Forza IC951 covers the same application. Direct manufacturer, no European parent markup, single-source system with sealant and tape."]], "seeds": ["SCIGRIP is a brand of Scott Bader \u2014 a \u00a3273M employee-owned UK chemical company. Their MMA adhesive is good chemistry. Their distribution in North America goes through specialty industrial channels with a markup layer. Forza is direct manufacturer.", "SCIGRIP and Plexus are the two MMA structural adhesive brands that show up most often in composites and marine accounts. When you walk into a shop running either one, the Forza IC951 pitch is identical \u2014 same 2-part structural acrylic category, direct pricing, no distribution markup.", "SCIGRIP makes structural adhesives only \u2014 no sealant, no tape, no canister spray. Every job that also needs sealant or tape requires a separate supplier. Forza covers all three on one account."], "landmines": [["European Parent", "Plant this: SCIGRIP is a brand of Scott Bader, a UK company. Distribution in North America goes through a channel with a markup. Ask: Are you buying SCIGRIP through a US distributor or direct? What is the landed price versus the manufacturer price?"], ["No Spray System", "Plant this: SCIGRIP is cartridge dispensing only. For applications where spray would improve throughput or coverage uniformity, SCIGRIP has no answer. Ask: Have you evaluated the production throughput difference between cartridge and spray for your volume?"], ["Single Category", "Plant this: SCIGRIP makes structural adhesive \u2014 that is it. For sealant and tape on the same assembly, you are running separate accounts. Ask: What would it mean to consolidate structural adhesive, sealant, and tape onto one manufacturer account?"]], "objections": [["SCIGRIP bonds without surface prep on our composites", "Forza IC951 also provides primerless adhesion to fiberglass, carbon fiber, and thermoplastics. Compare TDS side by side \u2014 the no-prep claim is not exclusive to SCIGRIP."], ["We have SCIGRIP specced on this build", "Is it specced by brand or chemistry class? 2-part MMA structural adhesive is a chemistry category, not a brand lock. Ask whether the spec permits equal chemistry alternatives."], ["SCIGRIP has the marine track record", "SCIGRIP does have a strong marine composites history. For structural bonding outside the deepest marine specs, Forza IC951 covers the same category at direct pricing. Let us run a TDS comparison."]], "crosswalk": [{"sku": "SCIGRIP SG200-10/20/40", "app": "2-part MMA composites/thermoplastics/metals 10-40 min", "ind": "IC951"}, {"sku": "SCIGRIP SG300-15", "app": "2-part MMA medium cure structural bonding", "ind": "IC951"}, {"sku": "SCIGRIP SG230HV", "app": "2-part MMA 10:1 composite and plastic bonding", "ind": "IC951"}, {"sku": "SCIGRIP SG5000-13", "app": "2-part MMA 1:1 multi-substrate bonding", "ind": "IC951"}, {"sku": "SCIGRIP SG7706", "app": "2-part MMA solid surface and steel rodding/clip bonding", "ind": "IC951"}, {"sku": "SCIGRIP 3 / 16 Acrylic Cement", "app": "Solvent cement acrylic plastic bonding", "ind": "IC932"}], "wins": ["Direct manufacturer pricing vs Scott Bader UK parent distribution chain", "Forza IC951 covers same 2-part structural acrylic MMA category", "Forza single-source: structural adhesive + sealant + tape", "No European parent markup in Forza pricing", "Forza canister spray system \u2014 SCIGRIP cartridge only"], "moats": ["SCIGRIP brand recognition in composites and marine structural bonding", "SubstrateMatch tool creates specification stickiness at the design stage", "Scott Bader also supplies composites resins and gelcoats \u2014 system sell into composites fabricators", "Deep marine and composites specification history"]}, {"id": "sika", "name": "Sika", "brands": "Sikaflex / SikaFast / Sika Aktivator / Sikasil", "hq": "Baar, Switzerland / Lyndhurst NJ", "rev": "CHF 11.76B", "threat": "HIGH", "pitch": "Sika is a CHF 11.76B Swiss construction chemistry platform. Their rep manages concrete, roofing, waterproofing, flooring, and pipeline alongside Sikaflex. Forza entire operation is adhesives, sealants, and tapes. Specialist vs. line item.", "msgs": [["To the Transportation Fabricator", "Sikaflex-252 and Forza T-OA156 are both 1-part hybrid polymer structural adhesives. Same chemistry, Iowa-made, and your Forza rep only job is adhesives and sealants."], ["To the Marine Fabricator", "Sikaflex-291 covers marine sealing. Forza M-OS789 covers the same application plus ForzaBond MC-series spray adhesive for foam and upholstery on the same build. Sika does not make a spray adhesive."], ["To the Distributor", "You carry Sikaflex for sealant. Sika makes no spray adhesive, no tape, no industrial cleaner. Forza fills all four from one Iowa manufacturer."]], "objections": [["Sikaflex-252 is specced on our vehicle line", "Specced by brand or chemistry? Sikaflex-252 and Forza T-OA156 are both 1-part moisture cure hybrid polymer structural adhesives. If chemistry-based, Forza qualifies."], ["Sikaflex-291 is what we use for marine", "ForzaBond M-OS789 covers the same marine sealing. Forza also supplies spray adhesive and tape for the same build. Sika cannot."], ["Sika Aktivator is already approved", "Both Sika Aktivator-100 and Forza OSA are IPA-based surface activators. Same chemistry, same application. Forza OSA qualifies."], ["Sika has global technical support", "Global support means a rep covering concrete, roofing, and flooring. Forza technical team covers adhesives, sealants, and tapes only. Council Bluffs, Iowa. Direct line."]], "seeds": ["Sikaflex is one product family inside a CHF 11.76 billion Swiss construction chemistry platform that also makes concrete admixtures, roofing systems, waterproofing, and flooring. Forza entire operation is adhesives, sealants, and tapes.", "Sika makes a great sealant. They do not make a spray adhesive, a bonding tape, or an industrial cleaner. The marine fabricator on Sikaflex-291 still needs spray adhesive for foam bonding on the same build. Sika cannot supply it.", "The Sika rep on your account is managing concrete, roofing, waterproofing, and flooring products alongside Sikaflex. At Forza, adhesives, sealants, and tapes are the whole company."], "landmines": [["Rep Specialization", "Plant this: Sika rep selling Sikaflex is the same rep responsible for concrete repair and roofing. Ask Sika: When you have a technical question about your Sikaflex application, how specialized is the person who answers?"], ["Sikaflex Chemistry", "Plant this: Sikaflex-252 and Forza T-OA156 are the same application chemistry, same substrate range, Iowa-made. Ask Sika: Is that a chemistry specification or a brand preference?"], ["Spray Adhesive Gap", "Plant this: Sika makes zero spray adhesive. A marine fabricator using Sikaflex for sealing still needs spray adhesive for foam bonding. Ask Sika: For the foam bonding on the same build, what spray adhesive are you using?"], ["Domestic Content", "Plant this: Sika is headquartered in Switzerland, US HQ New Jersey. No Midwest manufacturing. Ask Sika: Where is Sikaflex manufactured for the US market?"], ["Aktivator Chemistry", "Plant this: Sika Aktivator-100 and Forza OSA are both IPA-based surface activators. Same chemistry. Ask Sika: Is the Aktivator specified by brand name or by chemistry?"]], "wins": ["Sika makes ZERO spray adhesives", "Sika makes ZERO tapes - Forza 22 SKUs unchallenged", "Iowa-made vs. Swiss-owned, US HQ New Jersey", "Entry: sell spray adhesive first, earn sealant conversation", "Single-source: four categories vs. Sika sealant-only"], "moats": ["Concrete admixtures, repair, roofing, waterproofing - outside Forza", "SikaLastomer butyl sealants - no Forza butyl equivalent", "SikaDamp NVH / SikaPower heat-cure OEM - outside Forza", "SikaMelt hot melt lamination - different application"], "crosswalk": [{"sku": "Sikaflex-221", "app": "Multi-purpose sealant", "ind": "OS2"}, {"sku": "Sikaflex-252", "app": "Vehicle assembly structural", "ind": "OA4"}, {"sku": "Sikaflex-255 FC", "app": "CV direct glazing fast cure", "ind": "OA4"}, {"sku": "Sikaflex-291 / 291 LOT", "app": "Marine multifunctional / long OT", "ind": "M-OS789 / M-OS796"}, {"sku": "Sikaflex-292i", "app": "Marine structural bonding", "ind": "M-OA755 / M-OS789"}, {"sku": "Sikaflex-505 UV / 521 UV", "app": "STP/MS polymer, UV resistant", "ind": "OS2"}, {"sku": "Sikaflex-510 AM50", "app": "Isocyanate-free low modulus", "ind": "OS2"}, {"sku": "Sikaflex-552", "app": "Assembly, reduced substrate prep", "ind": "OA4"}, {"sku": "SikaFast-3121 / 321 S", "app": "Fast cure toughened MMA", "ind": "IC951"}, {"sku": "SikaFast-3511 / 3531", "app": "High strength MMA", "ind": "IC951"}, {"sku": "SikaFast-3311 / 3341", "app": "Low-medium modulus MMA", "ind": "IC951"}, {"sku": "Sika Aktivator-100 / 205", "app": "IPA surface activator, pre-bond", "ind": "OSA"}, {"sku": "Sika Primer-206 G+P", "app": "Concrete/porous substrate primer", "ind": "OSA"}, {"sku": "Sikasil GP-101 / N Plus", "app": "General purpose silicone", "ind": "OS35"}, {"sku": "Sikasil AS-785", "app": "Automotive assembly silicone", "ind": "OS35"}]}, {"id": "silco", "name": "Silco", "brands": "Silco / Sil-Bond / Eco-Flex / Eco-Tite / Ultra-Flex", "hq": "Mentor, OH", "rev": "Private; est. <$30M", "threat": "LOW", "pitch": "Silco is a small Ohio silicone and hybrid sealant manufacturer focused on construction, industrial, and transportation assembly. They specialize in custom compounding, private label, and color-matched sealants. Their product portfolio is narrow \u2014 silicone and hybrid sealants only, no adhesive, no tape, no spray. Forza competes on sealant chemistry with a direct manufacturer advantage and a system offering Silco cannot match.", "msgs": [["To the Distributor", "Silco is a private-label and custom sealant manufacturer. Forza covers the same silicone and hybrid sealant chemistry as part of a complete adhesive, sealant, and tape system from a direct manufacturer with broader vertical coverage."], ["To the Construction Contractor", "Silco's Eco-Flex and Eco-Tite hybrid sealants are well-made. Forza OA4 and OS2 cover the same STPE hybrid chemistry at direct pricing with the addition of adhesive and tape on the same account."], ["To the Transportation OEM", "Silco makes transportation assembly sealants. Forza's Transportation vertical covers the same sealing applications as part of a complete system with structural adhesive and tape on one manufacturer account."]], "seeds": ["Silco is a 30-year-old private Ohio company with under 200 employees. They do custom compounding and private label well, but their product line is silicone and hybrid sealants only. No adhesive, no tape, no canister spray, no structural chemistry.", "Silco's private label capability is their main differentiator \u2014 they will put your brand on their sealant. That is a different sales model than Forza. If a distributor is buying Silco to private label, the conversation is about cost, chemistry, and reliability \u2014 all areas where a direct manufacturer can compete.", "Silco's geography is Ohio \u2014 strong Midwest distribution relationships. Outside the Midwest, their reach is limited compared to a national direct manufacturer."], "landmines": [["Single Category", "Plant this: Silco makes sealants \u2014 silicone and hybrid. That is the full product line. Ask: For any job that also needs adhesive or tape, how many supplier accounts are you running alongside Silco?"], ["Private Label Risk", "Plant this: If you are buying Silco private label, your brand is on their product. Ask: What happens to your brand if Silco has a quality issue, a supply disruption, or a change in ownership?"], ["Company Size", "Plant this: Silco is a small private Ohio company. Ask: What is your supply continuity plan if Silco faces a production or capacity issue? A direct national manufacturer carries less concentration risk."]], "objections": [["We use Silco for private label sealant", "Forza can discuss private label as well. The conversation on private label is cost, chemistry, and supply reliability \u2014 all areas where a direct manufacturer with multiple production facilities competes well."], ["Silco matches our color perfectly", "Silco's color matching is their strength. Forza can also provide color-matched sealants. The question is total cost and system breadth."], ["Silco hybrid tech is what we need", "Forza OA4 and OS2 cover STPE hybrid sealant chemistry. The silyl-terminated polyether technology Silco uses is the same industry-standard chemistry available through Forza at direct pricing."]], "crosswalk": [{"sku": "Silco Sil-Bond RTV 4500", "app": "Acetoxy cure RTV silicone sealant/adhesive high strength", "ind": "OA13"}, {"sku": "Silco Eco-Flex 9500", "app": "STPE hybrid sealant paintable UV stable", "ind": "OA4"}, {"sku": "Silco Eco-Tite 5555", "app": "1-part STPE hybrid medium modulus multipurpose sealant", "ind": "OA4"}, {"sku": "Silco Ultra-Flex", "app": "Flexible elastomeric sealant construction/marine", "ind": "OS2"}, {"sku": "Silco Neutral Cure Silicone", "app": "Neutral cure silicone low odor non-corrosive", "ind": "OA13"}, {"sku": "Silco Siliconized Acrylic Latex", "app": "Paintable siliconized acrylic latex caulk", "ind": "OS2"}], "wins": ["Direct manufacturer pricing vs Silco specialty sealant pricing", "Forza system: adhesive + sealant + tape vs Silco sealant-only", "National coverage vs Silco Midwest concentration", "Multiple production facilities vs Silco single Ohio plant", "Forza broader vertical coverage across all six verticals"], "moats": ["Silco private label and custom compounding capability \u2014 differentiated service model", "Color matching expertise \u2014 strong with specifiers requiring custom color sealants", "30-year Midwest distribution relationships \u2014 difficult to displace in core territory"]}, {"id": "tremco", "name": "Tremco", "brands": "Tremco / Vulkem / Spectrem / Dymonic / Tremsil / Willseal / Nudura / Dryvit", "hq": "Beachwood, OH", "rev": "Part of RPM CPG segment ~$3.1B", "threat": "HIGH", "pitch": "Tremco is North America's foremost commercial sealant and waterproofing company \u2014 deeply specced into curtainwall, glazing, and commercial construction. Their rep sells to architects and specifiers first, contractors second. Forza sells direct to the fabricator and contractor with no spec gatekeeping. Where Tremco locks in through specification, Forza wins on direct pricing, lead time, and single-source capability.", "msgs": [["To the Commercial Contractor", "Tremco Dymonic FC and Vulkem 116 are the spec on commercial jobs. For the same PU sealant chemistry at direct manufacturer pricing with faster lead time and no distributor markup, compare Forza OA4 and OS2."], ["To the Transportation OEM", "Tremco's transportation sealant line is real. Their modular and OEM portfolio competes with Forza's Transportation vertical. But Forza is a direct manufacturer \u2014 no distributor, no spec lock, shorter lead time."], ["To the Distributor", "Tremco sells direct to contractors and specifiers, often bypassing distribution. Their spec lock is good for Tremco, not always for you. Forza works through distribution, not around it."]], "seeds": ["Tremco sells to architects and specifiers first \u2014 their business model is built on getting written into specifications so contractors have no choice. That is a great moat for Tremco and a constraint for the contractor. Forza does not spec-lock; direct pricing and availability are always open.", "Tremco and DAP are both owned by RPM International \u2014 a $7.9B company. Tremco covers commercial construction; DAP covers retail. When you buy Tremco, you are buying from the same parent company that competes against you at Home Depot.", "Tremco's waterproofing and roofing systems are formidable. Their sealant SKUs \u2014 Vulkem, Dymonic, Spectrem \u2014 are genuinely well-engineered. But the Forza equivalent polyurethane and SMP sealants carry the same chemistry at direct pricing, without the commercial specification gatekeeping."], "landmines": [["Spec Lock", "Plant this: Tremco writes specifications that name Tremco by brand, not by chemistry or performance standard. Ask: Has your architect specced Tremco by name? If so, do you know whether that was because of technical performance or because Tremco's rep was in front of them first?"], ["Direct to Contractor", "Plant this: Tremco sometimes sells direct to commercial contractors, bypassing the distributor. Ask: When Tremco goes direct on a project, what happens to your relationship with that contractor?"], ["RPM Ownership", "Plant this: Tremco and DAP are both owned by RPM International. The same company that is on your distributor shelf at consumer pricing owns the commercial sealant spec tool. Ask: Does that feel like a company that is optimizing for your margin?"]], "objections": [["Tremco is the spec on this project", "Is it specced by brand or ASTM class? Tremco Dymonic FC is ASTM C920 Type S Grade NS Class 50. Forza OA4 covers the same classification. Ask whether the spec allows equal products meeting the same ASTM standard."], ["Vulkem 116 is what our guys trust", "Vulkem 116 is a solid 1-part moisture-curing PU sealant. Forza OS2 and OA4 are the same chemistry at direct manufacturer pricing. The performance is equivalent \u2014 the trust is habit."], ["Tremco has the waterproofing system behind it", "Tremco's waterproofing system is their strongest position and outside Forza's portfolio. On standalone sealant applications, compare TDS and pricing before defaulting to system pricing."]], "crosswalk": [{"sku": "Vulkem 116", "app": "1-part moisture-cure PU gun-grade sealant", "ind": "OA4"}, {"sku": "Vulkem 45SSL", "app": "Semi-self-leveling PU horizontal sealant", "ind": "OS35"}, {"sku": "Dymonic 100", "app": "High-performance medium-modulus PU", "ind": "OA4"}, {"sku": "Dymonic FC", "app": "Fast-cure hybrid SMP sealant", "ind": "OS2"}, {"sku": "Spectrem 1", "app": "Ultra-low modulus silicone curtainwall", "ind": "OA13"}, {"sku": "Spectrem 2", "app": "High-performance silicone glazing", "ind": "OA13"}, {"sku": "Spectrem 3", "app": "Low modulus silicone EIFS/stone", "ind": "OA13"}, {"sku": "Tremsil 200", "app": "Acetoxy silicone in-plant glazing", "ind": "OA12"}, {"sku": "Tremsil 400", "app": "Neutral cure silicone medium modulus", "ind": "OA13"}, {"sku": "Tremsil 600", "app": "Silicone in-plant glazing OEM", "ind": "OA13"}, {"sku": "Tremflex 834", "app": "Butyl sealant acoustical/glazing", "ind": "OS2"}, {"sku": "Tremco Acoustical Sealant", "app": "Acoustical joint and curtainwall seal", "ind": "OS2"}, {"sku": "Tremco 440 Tape", "app": "Polyisobutylene butyl preformed tape", "ind": "T-305"}, {"sku": "Tremco 830", "app": "Thermoplastic glazing sealant", "ind": "OA4"}], "wins": ["Direct manufacturer pricing vs Tremco commercial spec pricing", "Forza works through distribution \u2014 Tremco sometimes bypasses it", "No spec-lock \u2014 Forza pricing always available without architect gatekeeping", "Single-source: adhesive + sealant + tape on one PO", "Shorter lead time direct vs Tremco commercial project pipeline"], "moats": ["Commercial specification lock \u2014 deeply written into curtainwall and glazing specs", "Waterproofing and roofing systems \u2014 fully outside Forza portfolio", "Nudura ICF system \u2014 outside Forza portfolio", "Dryvit EIFS \u2014 outside Forza portfolio", "Tremco technical services team embedded with architects and specifiers"]}];
var EXEC=[{"id": "3m", "name": "3M", "brands": "Super 77 / Scotch-Weld / VHB / PU Sealants / Hot Melt", "hq": "Maplewood, MN", "rev": "$32B+", "threat": "HIGH", "glance": [["Annual Revenue", "$32B+"], ["Employees", "95,000+"], ["Countries", "70+"], ["Adhesive Division", "~$5B revenue"], ["Distribution", "Fastenal, Grainger, MSC - no direct sales"]], "overview": "3M Company (NYSE: MMM) is headquartered in Maplewood, Minnesota. Founded in 1902, it operates across five business segments: Safety and Industrial, Transportation and Electronics, Healthcare, Consumer, and Corporate. The adhesive and sealant products relevant to Forza fall primarily within the Safety and Industrial segment. 3M sells through industrial distributors including Fastenal, Grainger, and MSC - their model is distributor-driven at every level.", "key_context": "3M is the most recognized adhesive and sealant brand in the market. That recognition comes with a real price premium built into every product. The premium is paid for familiarity, not for chemistry that is unavailable elsewhere. Forza makes equivalent chemistry - Iowa-made, at direct manufacturer pricing, with no distributor margin layer between Forza and the customer.", "brands_detail": [["3M Spray Adhesives", "Super 77, 27, 20, 24, HoldFast 70, Hi-Strength 90/94, Foam Fast 74, Spray 71", "ForzaBond IC/MC/TC/RC spray adhesive canister system"], ["3M VHB Tapes", "GPH-060GF, GPH-110GF, VHB 5952, 4950, CV62F", "ForzaTape T-205, T-215, T-220 / T-T415, T-T420, TAC-T700"], ["3M Marine Sealants", "5200, 5200 Fast Cure, 4200 FC, 4000 UV", "ForzaSeal M-OS789, M-OS796, ForzaBond M-OA755"], ["3M PU/SMP Sealants", "560, 550 FC, 525, MSP Seam Sealer 08374, Scotch-Seal 800", "ForzaSeal T-OS151, T-OA156, C-OS9, C-OS55, OS2"], ["Scotch-Weld Structural", "DP8005, DP810 (2-part acrylic), DP190, 2214 (epoxy)", "ForzaBond IC951, TC471, R160"], ["3M Tape Primers", "Tape Primer 94, Surface Primer 111", "ForzaBond OSA, T-OSA155, R-OSA"]], "wins": ["Volume spray adhesive accounts running production-format canisters - 3M aerosols are the wrong format", "Distributors seeking better margin - 3M price is known everywhere, margin is compressed", "Accounts that value published ASTM performance data - Forza publishes more than 3M on VHB equivalents", "Accounts with domestic content requirements - Iowa-made, every SKU", "Marine fabricators who also need spray adhesive - 3M has no canister spray adhesive", "Single-source accounts - adhesives + sealants + tapes + cleaners from one Iowa manufacturer"], "moats": ["Spec'd-by-name accounts - 3M VHB and 3M 5200 written into drawings by brand name", "High-volume masking, electrical, and specialty tape categories - no Forza equivalent", "Aerospace and electronics structural adhesives - outside Forza portfolio", "Automotive refinish and body repair - outside Forza portfolio"], "assessment": "3M's competitive strength against Forza is not rooted in superior chemistry. In every Forza-relevant category - spray adhesives, VHB/UHB tapes, marine sealants, PU sealants, structural adhesives - Forza makes a direct chemistry equivalent. The threat is rooted in brand recognition, distribution ubiquity, and the inertia of existing specifications and shelf positions. The brand premium is 3M's greatest strength and its most exploitable vulnerability. Contractors and distributors pay it because 3M is familiar and convenient - not because the chemistry is unavailable elsewhere. The moment a prospect asks the price comparison question with their eyes open, Forza wins on value.", "bottom_line": "3M is the strongest brand competitor Forza faces in any market. Their advantage is recognition and distribution ubiquity - not chemistry. In every category where Forza and 3M compete directly, Forza offers equivalent performance at direct manufacturer pricing, with more published data transparency, from an Iowa manufacturer whose entire focus is adhesives, sealants, and tapes."}, {"id": "abitape", "name": "ABI Tape / Ideal Tape", "brands": "ABI Tape / Ideal Tape / ProtecRite / TransferRite / Autowrap / American Biltrite", "hq": "Moorestown, NJ (ABI Tape); Lowell, MA (Ideal Tape)", "rev": "American Biltrite Inc. est. <$200M; ABI Tape division est. <$100M", "threat": "MOD", "glance": [["Parent Company", "American Biltrite Inc. (private; founded 1908)"], ["Founded", "ABI Tape division; Ideal Tape plant in Lowell MA; both under American Biltrite"], ["Headquarters", "Moorestown, NJ (ABI Tape HQ); Lowell, MA (Ideal Tape manufacturing)"], ["Revenue (est.)", "American Biltrite est. <$200M; ABI Tape division est. <$100M"], ["Employees", "American Biltrite est. 500-1000 across all divisions"], ["Manufacturing", "Moorestown NJ (protective films/papers); Lowell MA (HVAC/insulation/industrial/shoe); Belgium, Singapore, Italy (converting)"], ["Markets", "HVAC/Insulation (Ideal Tape), Industrial, Automotive (Autowrap), Graphics (TransferRite), Surface Protection (ProtecRite), Shoe/Leather"], ["Forza Verticals", "Insulation (primary \u2014 Ideal Tape), Industrial, Transportation (secondary)"]], "key_context": "ABI Tape and Ideal Tape are two plants within American Biltrite's tape division, competing with Forza in the HVAC/insulation tape, industrial tape, and automotive tape categories. Ideal Tape in Lowell, MA is the primary competitor to Forza in the insulation vertical \u2014 their ASJ jacketing and duct tapes are well-specced in HVAC insulation distribution. ABI Tape's industrial and automotive lines overlap with Forza's T-series. The single-source system story (tape + adhesive + sealant) is the sharpest Forza wedge \u2014 ABI/Ideal makes tape only.", "overview": "ABI Tape, a division of American Biltrite Inc. (founded 1908, headquartered in Moorestown, NJ), manufactures pressure-sensitive specialty tapes for HVAC/insulation (under the Ideal Tape brand from Lowell, MA), industrial, automotive (Autowrap), graphics (TransferRite), and surface protection (ProtecRite) markets. ABI operates manufacturing in Moorestown NJ and Lowell MA, with converting facilities in Belgium, Singapore, and Italy for global OEM markets. The Ideal Tape brand is the competitive product most directly overlapping with Forza's Insulation vertical, particularly the ASJ jacketing tape series (728, 729) used in mechanical insulation systems.", "brands_detail": [["Ideal Tape 728/729 ASJ Series", "ASJ-faced insulation jacketing tape for mechanical insulation", "R519"], ["Ideal Tape HVAC Series", "Foil and poly-backed duct sealing and HVAC tapes", "T305"], ["ABI Industrial Series", "High-temp masking, double-coated, specialty industrial tapes", "T532 / T215"], ["ABI Acrylic Foam / Double-Coated", "Acrylic foam structural and double-coated bonding tapes", "T220 / T215"], ["Autowrap Automotive", "Wire harness, surface protection, and automotive assembly tapes", "T532"], ["ProtecRite Surface Protection", "Protective papers and films for manufacturing", "T205"], ["ABI Polyimide Film Tape", "High-performance insulation tape for motors and coils", "T710"]], "assessment": "ABI/Ideal Tape is a MODERATE threat competitor in Forza's Insulation and Industrial tape verticals. Ideal Tape's HVAC/insulation specialty position is well-entrenched in insulation distribution channels. ABI's industrial and automotive tape lines overlap with Forza's T-series in transportation and industrial. Forza's competitive advantages are system breadth (tape + adhesive + sealant), direct manufacturer pricing vs American Biltrite division overhead, and the single-account value proposition. ABI's global converting operations give them an advantage in multinational OEM accounts that Forza cannot easily replicate.", "bottom_line": "ABI/Ideal Tape wins on specialty insulation tape specs (ASJ series) and global OEM accounts. Forza wins on system (tape + adhesive + sealant), direct pricing, and domestic industrial/insulation accounts where the full system story applies.", "wins": ["Forza system: tape + adhesive + sealant in one insulation/industrial account", "Direct manufacturer pricing vs American Biltrite division overhead", "Forza specialist vs ABI division of flooring/rubber company", "Iowa-made direct vs two-plant NJ/MA brand complexity"], "moats": ["Ideal Tape ASJ jacketing tape \u2014 specced in HVAC insulation distribution", "Global converting (Belgium, Singapore, Italy) for multinational OEM accounts", "115-year brand trust across specialty tape categories", "ProtecRite surface protection niche outside Forza portfolio"]}, {"id": "asi", "name": "American Sealants (ASI)", "brands": "ASI / American Sealants / Meridian Adhesives Group", "hq": "Fort Wayne, IN (Meridian HQ: Houston, TX)", "rev": "Meridian Adhesives Group est. $500M+ (PE-backed, Arsenal Capital); ASI est. <$100M", "threat": "MOD", "glance": [["Parent Company", "Meridian Adhesives Group (Arsenal Capital Partners PE-backed)"], ["Founded", "1987; acquired by Meridian December 2021"], ["Headquarters", "Fort Wayne, IN (ASI); Houston, TX (Meridian)"], ["Revenue (est.)", "Meridian platform est. $500M+; ASI est. <$100M"], ["Employees", "ASI est. <300; Meridian platform broader"], ["Distribution", "Industrial and construction distributors; private label OEM; direct to manufacturers"], ["Chemistry Focus", "Silicones (acetoxy, neutral cure), hybrid polyethers (STPE), modified PU, butyl; custom compounding"], ["Forza Verticals", "Industrial (primary), Construction (primary), Transportation (secondary)"]], "key_context": "ASI is a Fort Wayne, Indiana sealant manufacturer acquired by Meridian Adhesives Group in December 2021. Meridian is a PE-backed (Arsenal Capital) specialty adhesive roll-up building a platform through acquisitions in electronics, infrastructure, and industrial adhesive and sealant markets. ASI brings silicone, hybrid polyether, and custom compounding capability to the Meridian industrial division. The PE ownership and roll-up structure create competitive talking points around pricing stability, supply reliability, and relationship continuity that Forza can leverage as a stable direct manufacturer.", "overview": "American Sealants Inc. (ASI), founded in 1987 and headquartered in Fort Wayne, Indiana, manufactures custom-compounded silicone and hybrid sealants and adhesives for industrial, construction, transportation, and product assembly markets. Products include acetoxy and neutral-cure silicones, STPE hybrid polyether sealants, modified polyurethane sealants, butyl sealants, siliconized acrylic latex, and silicone greases. ASI is known for private label manufacturing, custom compounding, and color matching. Since the 2021 Meridian acquisition, ASI operates as part of Meridian's Industrial Division alongside Design Polymerics and other acquired brands. Arsenal Capital Partners is the PE backer of the Meridian platform.", "brands_detail": [["ASI 502 / Acetoxy Silicone", "100% RTV acetoxy silicone industrial/construction/HVAC", "OA13"], ["ASI Neutral Cure Silicone", "Neutral cure non-corrosive primerless silicone", "OA13"], ["ASI Hybrid Polyether (STPE)", "Silyl-terminated polyether paintable hybrid sealant", "OA4"], ["ASI Modified Polyurethane", "Modified PU sealant industrial and construction", "OA4"], ["ASI Butyl Sealant", "Butyl rubber sealant for glazing and sealing", "OS2"], ["ASI Siliconized Acrylic", "Paintable siliconized acrylic latex caulk", "OS2"]], "assessment": "ASI/Meridian is a MODERATE threat competitor in the industrial and construction sealant category. Their chemistry (silicone, STPE hybrid, modified PU) overlaps significantly with Forza's Construction and Industrial sealant portfolio. The Meridian PE roll-up ownership creates legitimate competitive talking points around pricing pressure, integration complexity, and supply reliability. ASI has no tape product line and no structural adhesive equivalent to Forza's IC or R-series. Forza's competitive advantage is system breadth, direct pricing, and a stable ownership structure. The private label capability is ASI's strongest differentiator \u2014 Forza should not contest private label accounts without a clear cost and reliability advantage.", "bottom_line": "ASI wins on custom compounding and private label. Forza wins on system breadth, direct pricing, and stable manufacturer relationship vs PE-backed roll-up. Focus displacement on non-private-label industrial and construction sealant accounts.", "wins": ["Direct manufacturer vs PE-backed roll-up pricing overhead", "Forza system: adhesive + sealant + tape vs ASI sealant-focused", "Stable ownership vs Arsenal Capital acquisition/exit risk", "Six-vertical coverage vs ASI industrial/construction focus"], "moats": ["Custom compounding and private label \u2014 strongest ASI differentiator", "Meridian platform scale growing through additional acquisitions", "Fort Wayne IN manufacturing with strong Midwest distribution", "Arsenal Capital backing provides acquisition capital to broaden the platform"]}, {"id": "bigdog", "name": "Big Dog Adhesives", "brands": "Big Dog Adhesives / BD Series", "hq": "Elkhart, IN", "rev": "Private; est. <$20M", "threat": "LOW", "glance": [["Parent Company", "Private; no external parent"], ["Founded", "20+ years (est. early 2000s); Elkhart IN"], ["Headquarters", "Elkhart, IN"], ["Revenue (est.)", "Private; est. <$20M annual revenue"], ["Employees", "Small; est. <50"], ["Distribution", "Direct to distributors; small orders; private label; specialty fabrication supply"], ["Chemistry Focus", "MMA (methyl methacrylate) structural adhesives, epoxy, cyanoacrylate"], ["Forza Verticals", "Marine (limited), Transportation/RV (limited), Industrial (limited), Construction (countertop/stone niche)"]], "key_context": "Big Dog Adhesives is a small, private Elkhart, Indiana adhesive manufacturer specializing in MMA, epoxy, and CA adhesives for countertop fabrication, sign making, RV, marine, and wood markets. Their competitive positioning centers on small orders, no minimums, and private label flexibility \u2014 serving small fabricators and distributors who need specialty adhesive access without large MOQs. They are a LOW threat competitor with a narrow product line (adhesives only) and limited geographic reach.", "overview": "Big Dog Adhesives, headquartered in Elkhart, Indiana, manufactures 2-part MMA structural adhesives, epoxy adhesives, and cyanoacrylate adhesives for countertop fabrication (granite, marble, quartz, porcelain), sign making, marine, RV/manufactured housing, transportation, and wood markets. Key MMA products include BD300/BD310/BD330 (fast-cure general structural), BD560/BD590 (long working time for marine/boat building), epoxy BD5405/BD5410/BD5420 (5/10/30 min), and BDSI CA adhesives. The company distinguishes itself with no minimum order requirements and private label capability, targeting the small fabricator and specialty distributor segments.", "brands_detail": [["BD300 / BD310 / BD330 MMA", "Fast-cure 2-part MMA general structural bonding", "IC951"], ["BD560 / BD590 MMA Marine", "Long working time 2-part MMA for marine/boat building", "IC951"], ["BD5405 / BD5410 / BD5420 Epoxy", "2-part epoxy adhesive for metals and plastics 5/10/30 min", "R160"], ["BDSI CA Adhesives", "Surface-insensitive cyanoacrylate multi-substrate", "IC951"], ["BD Stone / Countertop Adhesive", "Specialty adhesive for stone countertop seaming", "IC951"]], "assessment": "Big Dog is a LOW threat \u2014 small company, limited product line (adhesives only), niche market focus (countertop/stone/sign/RV), and limited distribution reach. They compete with Forza in the structural adhesive category in specific niche fabrication markets. Their no-minimum flexibility and private label capability give them access to small accounts that Forza may not actively pursue. Not a strategic priority for displacement \u2014 focus on accounts where Big Dog's narrow product line creates a natural opening for a system conversation.", "bottom_line": "Big Dog is a niche specialty adhesive company for small fabricators. Low priority for active displacement. When they appear in an account, lead with system breadth \u2014 adhesive + sealant + tape \u2014 which Big Dog cannot match.", "wins": ["Forza system: adhesive + sealant + tape vs Big Dog adhesive-only", "Six-vertical direct manufacturer vs Big Dog niche-only", "Forza canister spray system \u2014 Big Dog cannot compete", "Supply continuity: multiple facilities vs single Elkhart plant"], "moats": ["Stone countertop seaming niche \u2014 specialized formulation with strong loyalty", "No-minimum / small order flexibility for small fabricators", "Private label access for small distributors", "20+ year MMA expertise in RV and marine"]}, {"id": "chemlink", "name": "ChemLink", "brands": "ChemLink / M-1 / DuraLink / NovaLink / BuildSecure / DuraSil / E-Curb", "hq": "Sturgis, MI", "rev": "Private; est. <$50M", "threat": "LOW", "glance": [["Parent Company", "Private; no public parent"], ["Founded", "1990"], ["Headquarters", "Sturgis, MI"], ["Revenue (est.)", "Private; estimated <$50M annual revenue"], ["Employees", "Small private manufacturer; est. <200"], ["Distribution", "Specialty roofing distributors, building supply, direct to contractor"], ["Chemistry Focus", "Polyether moisture-cure sealants and adhesives; silicone; limited structural"], ["Forza Verticals", "Construction (primary), Insulation (limited)"]], "key_context": "ChemLink is a small, private specialty sealant manufacturer focused on the commercial roofing and building envelope market. They are best known for M-1, a polyether moisture-cure universal adhesive/sealant with strong brand loyalty among commercial roofing contractors. Their competitive position is narrow \u2014 roofing and construction sealants, non-toxic/solvent-free positioning, and the E-Curb specialty roof penetration system. They have no adhesive, tape, or industrial product line.", "overview": "ChemLink, founded in 1990 and headquartered in Sturgis, Michigan, manufactures specialty polyether and silicone sealants and adhesives for commercial roofing, building construction, and general construction applications. The M-1 Universal Adhesive/Sealant is their flagship product and primary brand equity driver in the roofing market. DuraLink and NovaLink sealants extend the polyether chemistry to joint sealing, and the E-Curb/ChemCurb system provides a specialty pitch pan and roof penetration solution. ChemLink positions its products as non-toxic, solvent-free, and environmentally responsible \u2014 a meaningful differentiator with green building specifiers. Their product portfolio is narrow relative to Forza, with no spray adhesive, no tape, and no industrial or transportation product capability.", "brands_detail": [["M-1 Universal", "Moisture-cure polyether structural adhesive/sealant, roofing flagship", "OS2"], ["NovaLink 35", "Moisture-cure polyether joint sealant for damp/cold conditions", "OS2"], ["DuraLink 35", "Multi-purpose elastomeric sealant economy/performance", "OS35"], ["DuraLink Siding Plus", "Elastomeric sealant for cementitious siding and curtain wall", "OA4"], ["BuildSecure", "Fast-set structural adhesive for panel-on-frame construction", "IC946"], ["DuraSil", "High-performance silicone adhesive/sealant", "OA13"], ["E-Curb / ChemCurb System", "Specialty roof penetration and pitch pan system", "OS35"]], "assessment": "ChemLink is a LOW threat competitor \u2014 their market footprint is narrow (commercial roofing and construction sealants only), their company size is small, and their product range does not compete with Forza across most verticals. They compete primarily in Forza's Construction vertical on polyether sealant chemistry. The M-1 brand has genuine loyalty in roofing distribution and is difficult to displace once established. Outside of roofing, ChemLink is not a meaningful competitive factor. Focus Forza displacement on non-roofing construction and insulation accounts where ChemLink has no presence.", "bottom_line": "ChemLink is a roofing specialty brand, not a system competitor. Displace them on non-roofing construction and insulation sealant applications. Leave the E-Curb roofing system alone \u2014 no direct Forza equivalent.", "wins": ["Broader product portfolio: adhesive + sealant + tape across six verticals", "Direct manufacturer pricing advantage on commodity polyether sealant chemistry", "Scale advantage: multiple production facilities vs single MI plant", "Transportation, Industrial, Marine coverage ChemLink cannot address"], "moats": ["M-1 brand loyalty in commercial roofing \u2014 entrenched in contractor workflows", "E-Curb/ChemCurb pitch pan system \u2014 specialty niche with no Forza equivalent", "Non-toxic/green building positioning with eco-conscious specifiers"]}, {"id": "cycan", "name": "Cycan Industries", "brands": "Cycan / Quality Aerosols (QA) / Cycan Spray Technologies", "hq": "Woodstock, GA", "rev": "Private; Merit Capital PE-backed; est. <$50M", "threat": "MOD", "glance": [["Parent Company", "Merit Capital Partners (PE-backed; acquired est. 2024-2025)"], ["Founded", "2000; originally contract packager; now formulates/blends own products"], ["Headquarters", "Woodstock, GA (Bell Industrial Park)"], ["Revenue (est.)", "Private; est. <$50M; PE-backed"], ["Employees", "Small private manufacturer; est. <100"], ["Distribution", "Industrial distributors, woodworking supply, HVAC/insulation, marine, RV, private label"], ["Key Products", "QA canister contact adhesives, aerosol spray adhesives, Air-Assisted Adhesive system, private label"], ["Forza Verticals", "Industrial (canister spray), Insulation (canister), Transportation (limited), Marine (limited), Construction (limited)"]], "key_context": "Cycan is the most direct canister spray adhesive competitor to Forza on this list \u2014 they compete in the same production-volume spray adhesive category across woodworking, HVAC, insulation, marine, RV, and manufactured housing. Founded in 2000 as a contract packager in Woodstock, Georgia, Cycan now formulates and fills its own products under the Quality Aerosols (QA) brand and through private label. A 2024 Air-Assisted Adhesive launch directly challenges the economics of self-propelled canister systems like Forza's IC-series. Recently acquired by Merit Capital Partners PE.", "overview": "CyCan Industries, founded in 2000 and headquartered in Woodstock, Georgia, operates as an aerosol and canister adhesive manufacturer and contract packager under the Quality Aerosols (QA) brand. Products span canister contact adhesives, aerosol spray adhesives, automotive products, household/industrial cleaners, and lubricants. The 2024 Air-Assisted Adhesive launch \u2014 claiming 27 lbs of adhesive for the price of a 20-lb canister \u2014 is a direct competitive move against self-propelled canister systems including Forza's IC/MC/RC/TC series. Cycan serves woodworking, HVAC, construction, marine, RV, and manufactured housing markets through industrial distribution and private label.", "brands_detail": [["QA Contact Adhesive Canister", "Spray-grade contact cement canister woodworking/upholstery", "IC933 / IC934"], ["QA Multi-Purpose Spray", "Multi-purpose aerosol and canister spray adhesive", "IC936"], ["Q5200 Contact Adhesive", "VOC-compliant FRP/insulation/plastics contact cement", "IC934"], ["QA High-Strength / High-Tack", "High-tack production-volume canister adhesive", "IC946"], ["HVAC/Insulation Canister", "Canister adhesive for duct liner and insulation bonding", "R160"], ["Air-Assisted Adhesive", "Novel air-assisted delivery adhesive system", "IC946"]], "assessment": "Cycan is a MODERATE threat \u2014 the most direct canister spray adhesive competitor to Forza in the field. Their QA brand competes for the same woodworking, manufactured housing, HVAC, and marine spray adhesive accounts. The Air-Assisted Adhesive is a meaningful competitive development that must be monitored \u2014 if the economics claim holds up at the customer level, it could shift canister adhesive purchasing decisions. The Merit Capital PE acquisition creates pricing and supply continuity talking points. Forza's advantage is system breadth (canister adhesive + sealant + tape), direct manufacturer positioning, and purpose-built chemistry per vertical.", "bottom_line": "Cycan is Forza's closest canister adhesive competitor. Fight them on system (not just canister), on direct manufacturer credibility vs contract packager, and monitor the Air-Assisted claim at the application level \u2014 if it underdelivers on coverage or bond quality, that is a vulnerability.", "wins": ["Direct manufacturer vs contract packager PE-backed", "Forza system: canister adhesive + sealant + tape on one account", "Purpose-built chemistry per vertical vs Cycan general formulation", "Iowa-made vs Georgia contract packager", "No PE acquisition supply risk"], "moats": ["Air-Assisted Adhesive economics claim \u2014 must be verified and monitored", "Private label presence across multiple distributor brands", "Contract packaging relationships give broad channel embedded presence", "QA brand loyalty in woodworking and manufactured housing canister accounts"]}, {"id": "dap", "name": "DAP", "brands": "DAP / Dynaflex / Weldwood / Touch 'n Seal / RapidFuse / Power Point / Vulkem Pro", "hq": "Baltimore, MD", "rev": "$1B+ (RPM Consumer segment ~$2.7B)", "threat": "MOD", "glance": [["Parent Company", "RPM International (NYSE: RPM)"], ["Founded", "1865 (as sealing wax manufacturer), DAP brand 1957"], ["Headquarters", "Baltimore, MD"], ["Revenue (est.)", "~$1B+ (part of RPM Consumer segment $2.7B FY2026)"], ["Employees", "Part of RPM's 17,800 total"], ["Distribution", "Mass retail (Home Depot, Lowe's, Menards), hardware, pro distributor, industrial"], ["Manufacturing", "Baltimore MD, Dallas TX, Fenton MO"], ["Forza Verticals", "Industrial, Construction, Insulation, Transportation (limited), Marine (limited)"]], "key_context": "DAP is the dominant consumer caulk and sealant brand in North America. Its strength is mass retail distribution and brand recognition. Its weakness in professional/industrial channels is that same retail omnipresence \u2014 pricing is transparent and margin is compressed. DAP has limited canister spray capability and no production-volume spray adhesive system.", "overview": "DAP Products Inc., founded in 1865 and a subsidiary of RPM International since the 1990s, is the largest caulk and sealant brand at US retail. DAP pioneered latex caulk in 1964 and has since built a portfolio spanning caulks, sealants, adhesives, spray foam, patch and repair, and wood filler across consumer and professional segments. Key brands include Dynaflex (elastomeric sealants), Weldwood (contact cement), Touch 'n Seal (spray foam systems), RapidFuse (fast-set adhesives), and Power Point (professional-grade sealants). DAP products appear on the shelves of every major home improvement retailer in North America and compete in both DIY and professional trade channels.", "brands_detail": [["Dynaflex / Dynaflex Ultra", "Dynaflex 230, Ultra, Color Match", "OS2 / OS35"], ["Weldwood Contact Cement", "Original, Nonflammable, Gel", "IC932"], ["Touch 'n Seal Foam", "1-part foam, 2-part spray kits, specialty foam", "R221 / R519"], ["RapidFuse", "All-purpose, wood, clear fast-set adhesives", "IC951"], ["Power Point Series", "200, 210, 230, 300 professional sealants", "OS35 / OA4"], ["DAP Silicone / 100% Silicone", "Window, door, marine, HVAC silicone sealants", "OA13"], ["AMP Advanced Modified Polymer", "Hybrid sealant, paintable, moisture cure", "OA4"], ["Phenoseal", "Vinyl adhesive caulk for tile, vinyl substrates", "IC933"]], "assessment": "DAP competes with Forza primarily in the construction, insulation, and industrial sealant and adhesive categories. Their retail distribution model creates a structural disadvantage in professional and industrial channels \u2014 price transparency limits distributor margin. In the spray adhesive category, DAP has no canister system, relying entirely on aerosol cans. Their foam business (Touch 'n Seal) competes directly with Forza's insulation vertical RC-series. DAP's strength is brand pull-through at the counter; Forza's advantage is direct manufacturer pricing, canister spray format, and single-source capability across adhesive, sealant, and tape.", "bottom_line": "DAP is a counter brand, not a production brand. They win at Home Depot; Forza wins at the fabricator, contractor, and industrial buyer who needs production volume, direct pricing, and a specialist. The canister spray gap and retail price transparency are Forza's sharpest wedges.", "wins": ["No DAP canister spray adhesive \u2014 Forza IC/MC/TC/RC production system unchallenged", "Direct manufacturer pricing vs transparent retail pricing", "Single-source adhesive + sealant + tape + cleaner capability", "Iowa-made, direct manufacturer \u2014 no retail shelf competition"], "moats": ["Brand recognition at retail is unmatched \u2014 Home Depot / Lowe's pull-through", "Touch 'n Seal specialty foam systems for mining and roofing", "Patch and repair, spackling, wood filler \u2014 outside Forza portfolio"]}, {"id": "designpolymerics", "name": "Design Polymerics", "brands": "Design Polymerics / DP Series / Meridian Adhesives Group", "hq": "Santa Ana, CA (Meridian HQ: Houston, TX)", "rev": "Meridian platform est. $500M+; Design Polymerics est. <$75M", "threat": "MOD", "glance": [["Parent Company", "Meridian Adhesives Group (American Securities Partners PE \u2014 acquired from Arsenal Capital September 2022)"], ["Founded", "1985; acquired by Lyle Davis 1993; acquired by Meridian September 2022"], ["Headquarters", "Santa Ana, CA"], ["Revenue (est.)", "Meridian platform est. $500M+; DP est. <$75M"], ["Employees", "Small private manufacturer; est. <200"], ["Distribution", "HVAC distributors, insulation contractors, mechanical insulation supply chain"], ["Key Products", "DP1010 duct sealant, insulation mastics, duct liner adhesives, IAQ coatings, silicone sealants"], ["Forza Verticals", "Insulation (primary), Construction (secondary), Industrial (limited)"]], "key_context": "Design Polymerics is the dominant brand in HVAC duct sealant and mechanical insulation adhesive markets, acquired by Meridian Adhesives Group in September 2022 \u2014 the same day Meridian changed PE ownership from Arsenal Capital to American Securities Partners. Two rapid PE ownership changes create competitive talking points about supply continuity and pricing stability. DP's LEED-qualified low-VOC duct sealants are deeply specced in commercial HVAC and represent a genuine competitive moat Forza cannot easily displace. The displacement opportunity is on non-LEED HVAC and residential insulation applications.", "overview": "Design Polymerics, founded in 1985 and headquartered in Santa Ana, California, manufactures low-VOC, LEED-qualified sealants, adhesives, insulation mastics, and indoor air quality products for HVAC, construction, and industrial applications. Key products include the DP1010 series (UL Listed water-based duct sealants), DP502/503 (acetoxy and high-temp silicone sealants), insulation mastics, duct liner adhesives, and IAQ antimicrobial coatings. As of September 2022, DP is part of Meridian Adhesives Group's Industrial Product Assembly Division alongside American Sealants Inc. American Securities Partners is the current PE owner of Meridian.", "brands_detail": [["DP1010 Series", "UL Listed water-based duct sealant, standard and high-pressure grades", "R221"], ["DP502 / DP503 Silicone", "Acetoxy and high-temp RTV silicone sealants HVAC/industrial", "OA13"], ["DP Insulation Mastics", "Weather-resistant coatings for mechanical insulation systems", "R519"], ["DP Duct Liner Adhesive", "Water-based adhesive for duct liner bonding", "R160"], ["DP IAQ Products", "Indoor air quality coatings and sealants for HVAC systems", "R519"]], "assessment": "Design Polymerics is a MODERATE threat in Forza's Insulation vertical, with a strong HVAC duct sealant position that is deeply specced in commercial applications. The LEED spec lock is their primary moat and is difficult to displace in spec-driven commercial HVAC. Outside of LEED-required commercial HVAC, Forza's Insulation vertical covers the same chemistry at direct manufacturer pricing. The dual PE ownership change (Arsenal Capital to American Securities, September 2022) is a legitimate competitive talking point for distributors concerned about pricing and supply continuity.", "bottom_line": "Design Polymerics wins where LEED specs are written. Forza wins on non-LEED HVAC and residential insulation applications, direct pricing, and stable manufacturer relationship vs PE roll-up. Two ownership changes in one day is the sharpest talking point.", "wins": ["Direct manufacturer pricing vs PE roll-up overhead", "Forza system: sealant + adhesive + tape on one insulation account", "Stable ownership vs two Meridian PE ownership changes since 2022", "Insulation vertical purpose-built for mechanical insulation applications"], "moats": ["LEED-qualified DP1010 duct sealant spec lock in commercial HVAC", "20+ year brand loyalty in HVAC contractor and insulation distributor channels", "IAQ product line \u2014 no Forza direct equivalent", "UL Listed products for high-pressure/high-velocity duct applications"]}, {"id": "dow", "name": "Dow", "brands": "DOWSIL / VORAMER / ROBOND / ROPLEX / Molykote / XIAMETER", "hq": "Midland, MI", "rev": "$43B (2024); adhesives/sealants est. $2.7B", "threat": "HIGH", "glance": [["Parent Company", "Dow Inc. (NYSE: DOW); public company"], ["Founded", "1897 (Dow Chemical); Dow Corning (DOWSIL) acquired 2016"], ["Headquarters", "Midland, MI"], ["Revenue", "$43B (FY2024); adhesives/sealants segment est. $2.7B"], ["Employees", "~36,000 globally; 30 countries"], ["Segments", "Packaging & Specialty Plastics; Industrial Intermediates & Infrastructure; Performance Materials & Coatings"], ["Adhesive Brands", "DOWSIL (silicone), VORAMER (PU foam), ROBOND (acrylic), ROPLEX (polymer)"], ["Forza Verticals", "Construction (primary), Industrial (primary), Transportation (VORAMER), Insulation (VORAMER)"]], "key_context": "Dow is the largest competitor on this list by revenue and one of the most significant \u2014 DOWSIL (formerly Dow Corning) is the world-leading silicone adhesive and sealant brand with 7,000+ products and 25,000+ customers globally. VORAMER polyurethane foam adhesive competes directly with Forza R-series in manufactured housing, RV, and modular construction. Dow's adhesive and sealant business is part of the Performance Materials & Coatings segment \u2014 a large division of an even larger commodity chemicals company. The competitive opportunity for Forza is on direct pricing, specialist positioning, and the VORAMER/R-series displacement in manufactured housing and construction panel bonding.", "overview": "Dow Inc., headquartered in Midland, Michigan, is one of the world's largest materials science companies with $43B in 2024 revenue. The Performance Materials & Coatings segment (which includes adhesives and sealants) generated approximately $2.7B. Key adhesive and sealant brands: DOWSIL (former Dow Corning silicone portfolio \u2014 7,000+ products including DOWSIL 795, 732, 734, 999, 3145, Contractors Weatherproofing), VORAMER (polyurethane foam adhesives for manufactured housing, RV, and construction panel bonding), ROBOND and ROPLEX (acrylic polymer systems for building materials). Dow acquired Dow Corning's silicone business in 2016, integrating it under the DOWSIL brand.", "brands_detail": [["DOWSIL 795 / Contractors Series", "Neutral and acetoxy cure silicone weatherseal and building sealants", "OA13 / OA4"], ["DOWSIL 732 / 734 / 999 Series", "Multi-purpose and general purpose silicone adhesive/sealants", "OA13 / OA12"], ["DOWSIL 3145 RTV", "MIL-SPEC silicone adhesive/sealant industrial and aerospace", "OA13"], ["VORAMER Industrial Adhesive", "PU foam adhesive manufactured housing RV and construction panels", "R519"], ["ROBOND / ROPLEX", "Acrylic polymer systems for weatherability in building sealants/caulks", "OS2"], ["XIAMETER", "Value-tier DOWSIL silicone products through online distribution", "OA13"]], "assessment": "Dow is a HIGH threat competitor with significant presence in both the construction sealant (DOWSIL) and manufactured housing/construction adhesive (VORAMER) categories. DOWSIL's silicone chemistry is deeply specced in curtainwall, glazing, and commercial construction \u2014 a difficult moat to displace. VORAMER competes directly with Forza R-series in the manufactured housing, RV, and modular construction panel bonding market \u2014 this is the highest-priority displacement opportunity. Forza's competitive advantage is direct manufacturer pricing (no Dow distribution markup), specialist positioning, and single-source capability across adhesive, sealant, and tape.", "bottom_line": "Dow wins on DOWSIL silicone specification depth and VORAMER OEM embedding. Forza wins on direct pricing, specialist positioning, and the ability to offer sealant + adhesive + tape as a system. The VORAMER/R-series displacement in manufactured housing and RV is Forza's highest-priority opportunity against Dow.", "wins": ["Direct manufacturer pricing vs Dow distribution markup", "Adhesive, sealant, tape specialist vs $43B commodity chemicals company", "Forza single-source system vs Dow requiring distribution for each product", "Iowa-made vs Midland MI global chemical company", "VORAMER is distributed \u2014 Forza R-series is direct"], "moats": ["DOWSIL silicone \u2014 world-leading technology with 7,000 products; curtainwall spec lock", "VORAMER deeply embedded in manufactured housing OEM and modular construction specs", "Global scale: 30 countries, 36,000 employees, integrated supply chain", "DOWSIL structural glazing silicones specced into major commercial projects worldwide", "Dow's R&D investment \u2014 $1B+ annually in materials science innovation"]}, {"id": "durodyne", "name": "Durodyne (Duro Dyne)", "brands": "Duro Dyne / Air Seal / Sure-Grip / Roto Bonder / Foil-Grip", "hq": "Bay Shore, NY", "rev": "Private; est. <$100M (HVAC accessories + adhesives combined)", "threat": "LOW", "glance": [["Parent Company", "Private; no external parent"], ["Founded", "1952; Bay Shore NY"], ["Headquarters", "Bay Shore, NY"], ["Revenue (est.)", "Private; est. <$100M (combined HVAC accessories + adhesives)"], ["Employees", "Private; est. 200-500"], ["Distribution", "HVAC distribution, sheet metal suppliers, insulation contractors"], ["Primary Business", "Sheet metal accessories: dampers, fasteners, hangers, access doors, zone control"], ["Adhesive/Sealant", "Secondary product line: duct sealants, liner adhesives, silicones"], ["Forza Verticals", "Insulation (duct sealant/liner adhesive niche only)"]], "key_context": "Duro Dyne is the leading HVAC sheet metal accessories manufacturer in North America \u2014 dampers, fasteners, cable/rod hanging systems, access doors, and zone control. Their duct sealant and liner adhesive line is a secondary product supporting the primary accessories business. The adhesive line competes with Forza's Insulation vertical in the duct sealant and liner adhesive category. The key competitive dynamic is convenience bundling \u2014 HVAC contractors buy Duro Dyne sealant because it rides on the same accessories order, not because the chemistry is superior.", "overview": "Duro Dyne Corporation, founded in 1952 and headquartered in Bay Shore, New York, is North America's leading manufacturer of HVAC sheet metal accessories including dampers, fasteners, pipe clamps, cable/rod hanging systems, zone control dampers, and access doors. The adhesive and sealant product line \u2014 including Air Seal duct sealers, Sure-Grip solvent duct sealant, Roto Bonder liner adhesive, and Foil-Grip tape/sealant systems \u2014 is a supporting line within the broader HVAC accessory portfolio. Duro Dyne acknowledges in their own product literature that solvent-based duct sealers are being phased out in favor of water-based products.", "brands_detail": [["Air Seal Water-Based Duct Sealer", "UL Listed water-based duct sealant SMACNA compliant", "R221"], ["Zero VOC Duct Sealer", "Zero-VOC premium water-based LEED-qualified duct sealant", "R221"], ["Sure-Grip 404", "Solvent-based synthetic rubber duct sealant (legacy/transitioning)", "R221"], ["Roto Bonder", "Spray/brush liner adhesive for HVAC duct liner bonding", "R160"], ["Foil-Grip 1403-181BFX", "UL 181B-FX pressure sensitive duct sealing tape/sealant", "R519"], ["Insulation Adhesives", "Water-based adhesive for insulation board bonding", "R160"]], "assessment": "Duro Dyne is a LOW threat competitor \u2014 their adhesive and sealant line is a secondary product within a sheet metal accessories business. The competitive dynamic is convenience bundling rather than chemistry preference. Duro Dyne's primary moat is that HVAC contractors buy their sealant because it's on the same order as dampers and fasteners. Forza's opportunity is in accounts where the HVAC contractor or distributor buys sealant and adhesive separately from accessories, and where direct manufacturer pricing is a meaningful factor.", "bottom_line": "Duro Dyne wins on bundle convenience \u2014 sealant on the accessories PO. Forza wins when sealant and adhesive are purchased separately on merit. Focus on insulation contractors and mechanical insulation distributors who separate their sealant purchasing from HVAC accessories.", "wins": ["Forza purpose-built insulation chemistry vs secondary product line", "Direct manufacturer pricing vs HVAC accessories company", "Forza system: duct sealant + liner adhesive + tape integrated"], "moats": ["Sheet metal accessories bundle \u2014 sealant rides on existing PO with no separate sourcing decision", "70-year brand loyalty in HVAC sheet metal channel", "Air Seal brand field default for duct sealing in sheet metal contractor workflow"]}, {"id": "gesealants", "name": "GE Sealants", "brands": "GE Sealants / Momentive / SilPruf / SCS Series / SWS", "hq": "Niskayuna, NY (Momentive) / Brand licensed for retail", "rev": "Momentive ~$6.5B (all silicones); GE Sealants retail brand est. <$200M", "threat": "MOD", "glance": [["Parent Company", "Momentive Inc. (owned by KCC Corporation, Korea, since 2024)"], ["Brand Origin", "GE silicone division sold to Apollo Global in 2006; became Momentive; GE name licensed for sealant products"], ["Founded", "GE silicone operations since 1940s; Momentive formed 2006"], ["Headquarters", "Niskayuna, NY (Momentive); GE Sealants brand distributed nationwide"], ["Revenue (est.)", "Momentive ~$6.5B total; GE Sealants consumer/pro sealant brand est. <$200M"], ["Distribution", "Mass retail (Home Depot, Lowe's), hardware, professional distribution, glazing supply"], ["Forza Verticals", "Construction (glazing, window/door, concrete), Industrial (limited), Marine (limited)"]], "key_context": "GE Sealants is a licensed brand \u2014 the GE name on the tube comes from a brand license agreement between Momentive (owned by KCC Corporation of Korea) and General Electric. GE sold its silicone division to Apollo Global Management in 2006, which became Momentive Performance Materials. The consumer and professional sealant brand continues under the GE name. This is an important story point: the GE on the label is not the GE most customers think it is.", "overview": "GE Sealants is the leading silicone sealant brand in North American retail and professional channels, sold under a licensed brand agreement by Momentive (KCC Corporation). Products include the SCS Series (acetoxy and neutral-cure silicones), SilPruf structural glazing silicones, SWS economical silicones, and consumer kitchen/bath/window/door sealants. GE Sealants' strongest position is in glazing, curtainwall, and residential sealing applications. They do not manufacture adhesives, tapes, or polyurethane sealants, limiting
