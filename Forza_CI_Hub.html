their ability to be a single-source supplier.", "brands_detail": [["SCS Series (SCS1000, SCS2000)", "General purpose and structural glazing silicone sealants", "OA13"], ["SilPruf / SilPruf NB", "High-performance structural glazing, curtainwall", "OA13"], ["SWS (Silicone Weather Sealant)", "Economical neutral-cure, competes with urethane pricing", "OS2"], ["Advanced Silicone 2 Series", "Kitchen, bath, window, door 100% silicone", "OA12 / OA13"], ["Concrete Silicone 2", "Concrete and masonry joint sealing", "OS35"], ["Paintable Hybrid Sealant", "Silicone-latex hybrid, paintable", "OA4"]], "assessment": "GE Sealants competes with Forza in the construction and industrial sealant category, primarily through silicone chemistry. Their structural glazing products (SilPruf) are deeply specced and represent a true competitive moat \u2014 Forza has no structural glazing equivalent. Outside of structural glazing, Forza's OA4, OS2, OS35, and OA13 cover most of the same joint and perimeter sealing applications. The GE brand origin story (licensed from Momentive/KCC, not actually General Electric) is a significant competitive talking point when specifications are brand-driven rather than chemistry-driven.", "bottom_line": "GE Sealants wins on structural glazing specification and brand name recognition in residential silicone. Outside of those two positions, Forza covers the same sealant applications at direct manufacturer pricing with a broader single-source offering that includes adhesives, tapes, and cleaners.", "wins": ["Direct manufacturer pricing vs GE licensed brand", "Broader product line: adhesive + sealant + tape + cleaner on one account", "GE brand is a licensed name from Momentive/KCC \u2014 not actually GE", "Forza PU/SMP sealants cover applications silicone-only GE cannot"], "moats": ["SilPruf structural glazing specification \u2014 deeply embedded, no Forza equivalent", "GE brand recognition in residential silicone sealant \u2014 strongest retail equity", "SCS Series is the default for glazing contractors"]}, {"id": "henkel", "name": "Henkel", "brands": "Loctite / Teroson / Technomelt / Bonderite", "hq": "Dusseldorf, Germany", "rev": "$11B+ adhesives", "threat": "HIGH", "glance": [["Headquarters", "Dusseldorf, Germany (NYSE: HENKY)"], ["Adhesive Revenue", "$11B+ annually - world's largest adhesive manufacturer"], ["Employees", "50,000+ in adhesive division"], ["Core Brands", "Loctite, Teroson, Technomelt, Bonderite"], ["Distribution", "Multi-tier: Fastenal, Grainger, industrial distributors"]], "overview": "Henkel Adhesive Technologies is the world's largest adhesive manufacturer, headquartered in Dusseldorf, Germany. Their adhesive division generates over $11 billion in annual revenue across electronics, automotive OEM, packaging, construction, and industrial markets. In the US, Henkel sells through multi-tier industrial distribution including Fastenal, Grainger, and MSC. Every transaction has a margin layer between Henkel and the end customer.", "key_context": "Henkel is the world's largest adhesive manufacturer. Their competitive strength against Forza is not rooted in superior chemistry - it is rooted in brand recognition (Loctite), distribution reach, and the inertia of existing specifications. The frame for every Henkel conversation: Iowa-made family manufacturer vs. $10B+ German conglomerate. When you call Forza, you get the chemist. When you call Loctite, you get a distributor.", "brands_detail": [["Loctite Structural", "H8000, H8003, H8100, H8600 SpeedBonder (2-part MMA); E-05MR, E-20HP (epoxy); CA 401, 406, 495, 4203", "ForzaBond IC951, TC471, R160, CA1000, CA1500, CA2400"], ["Teroson Sealants", "MS 930NA, MS 939 (1-part SMP); MS 9222, MS 9381 (2-part SMP); PU 8596, PU 8598 (1-part PU)", "ForzaSeal T-OS151, T-OA156, C-OS9"], ["Technomelt Hot Melt", "EVA packaging; polyolefin foam/fabric; reactive PUR hot melt", "Forza H103, H117, H158, H163, H164, H176, H167"], ["Bonderite Surface Prep", "C-IC 8200, Teroson VR 10 - IPA-based surface activators", "Forza OSA, T-OSA155, R-OSA, M-OSA783, C-OSA"]], "wins": ["Iowa family manufacturer vs. $10B+ German conglomerate - direct manufacturer relationship", "Call Forza, get the chemist. Call Loctite, get a distributor rep", "Forza has won business directly from Loctite accounts", "Direct manufacturer pricing - no Henkel multi-tier distributor margin stack", "ForzaTape: Henkel/Loctite has no tape product line", "RuggedRed: Henkel has no dedicated industrial cleaner brand", "Single-source: adhesives + sealants + tapes + cleaners from one Iowa manufacturer"], "moats": ["Loctite brand recognition is the strongest structural adhesive brand in the US", "H8000 SpeedBonder is written into structural adhesive specs by name across industries", "Teroson transportation sealant line has deep automotive OEM penetration", "Threadlockers, anaerobic sealants, light-cure - categories Forza does not play in", "50,000+ adhesive employees globally - deep technical resource base"], "assessment": "Henkel/Loctite is the most respected adhesive brand in the structural adhesive and transportation sealant categories. Their advantage is not chemistry - it is specification inertia. Loctite H8000 and Teroson MS 930 are written into drawings and approval sheets by name. Most engineers and procurement teams have never been asked to evaluate an alternative. The Iowa family manufacturer frame is Forza's most powerful asset against Henkel. This is not a small company vs. big company pitch - it is a direct manufacturer vs. German conglomerate pitch. Forza has won business from Loctite accounts. That proof point, delivered with confidence, is the most credible thing a Forza rep can say in a Loctite-held account.", "bottom_line": "Loctite is the strongest brand Forza competes against in structural adhesives. Teroson is the strongest in transportation sealants. The frame is Iowa vs. Germany, chemist vs. distributor, direct relationship vs. corporate chain. Forza has won on this frame. Use it."}, {"id": "ipg", "name": "IPG (Intertape)", "brands": "IPG / Intertape / Cantech / DEWALT Tape / Anchor / American Tape", "hq": "Sarasota, FL / Montreal, QC", "rev": "~$1.5B (2022, private since 2022 \u2014 Clearlake Capital)", "threat": "MOD", "glance": [["Parent Company", "Clearlake Capital Group (private equity, acquired June 2022 for $2.6B)"], ["Founded", "1981; went private 2022"], ["Headquarters", "Sarasota, FL / Montreal, QC"], ["Revenue (est.)", "~$1.5B (last public report 2022); private since Clearlake acquisition"], ["Employees", "~4,200"], ["Manufacturing", "22 facilities in North America, 5 in Asia, 2 in Europe"], ["Distribution", "Industrial distribution, retail (Home Depot, Lowe's), direct to OEM"], ["Forza Verticals", "Industrial (tape), Transportation (tape), Construction (tape), Insulation (tape)"]], "key_context": "IPG is North America's largest independent tape manufacturer, competing with Forza exclusively in the tape category. They have no adhesive or sealant product line. Taken private by Clearlake Capital in a $2.6B leveraged buyout in 2022, IPG is now operating under private equity ownership with associated margin and return pressures. Their primary business is packaging tape, stretch film, and e-commerce packaging \u2014 industrial and specialty tape is secondary. The PE acquisition and packaging-first orientation create competitive displacement opportunities for Forza in industrial tape accounts.", "overview": "Intertape Polymer Group (IPG), founded in 1981 and headquartered in Sarasota, FL and Montreal, QC, is the largest independent tape manufacturer in North America. Products span pressure-sensitive tapes (carton sealing, masking, filament, duct, double-coated, specialty), water-activated tapes, stretch and shrink films, woven fabrics, and packaging machinery. Licensed brands include DEWALT (tape) and partnerships with Rust-Oleum. IPG was taken private by Clearlake Capital in June 2022 in a $2.6B all-cash transaction. The industrial and specialty tape portfolio \u2014 which competes most directly with Forza \u2014 represents a minority of IPG's total revenue versus packaging.", "brands_detail": [["IPG Industrial Tapes", "Double-coated foam, acrylic film, specialty bonding, HVAC flashing", "T215 / T220 / T305"], ["IPG Filament/Strapping", "Fiberglass filament and strapping tape", "T465"], ["IPG Duct / Utility", "Cloth duct tape, general utility", "T305"], ["IPG High Performance", "Specialty aerospace, automotive, high-temp tapes", "T532 / T710"], ["DEWALT Tape (licensed)", "Licensed DEWALT brand construction and utility tapes", "T305 / T215"], ["Cantech (acquired)", "Canadian industrial tape brand", "T215 / T305"]], "assessment": "IPG competes with Forza exclusively in the tape category \u2014 they are a meaningful competitor in industrial, transportation, and construction tape but have no presence in adhesive or sealant. The PE ownership dynamic (Clearlake Capital, $2.6B LBO) creates a pricing and supply risk that is a legitimate competitive talking point. Forza's primary advantage is single-source capability (tape + adhesive + sealant) and direct manufacturer pricing without PE overhead. IPG's tape breadth and scale \u2014 22 North American plants \u2014 are real competitive moats that Forza cannot match on SKU count or packaging tape. Focus Forza tape displacement on industrial and transportation accounts where the full system story is compelling.", "bottom_line": "IPG wins on tape breadth and scale. Forza wins on system (tape + adhesive + sealant in one account), direct pricing, and stable manufacturer relationship vs PE-owned supply chain. The PE acquisition is the sharpest Forza talking point with distributors concerned about pricing and supply changes.", "wins": ["Forza single-source: tape + adhesive + sealant on one PO", "Direct manufacturer vs PE-owned supply chain risk", "No PE leveraged buyout overhead in Forza pricing", "DEWALT brand on IPG tape is a licensed brand, not a product endorsement"], "moats": ["IPG tape SKU breadth is unmatched in North America", "Packaging tape and stretch film \u2014 fully outside Forza portfolio", "Scale manufacturing: 22 NA plants drive cost and lead time advantages", "DEWALT brand license creates retail pull-through Forza cannot match", "Water-activated tape \u2014 outside Forza portfolio"]}, {"id": "itwplexus", "name": "ITW Plexus", "brands": "Plexus / MA Series / AO Series", "hq": "Glenview, IL", "rev": "ITW $15.9B (2024); Plexus est. <$200M", "threat": "MOD", "glance": [["Parent Company", "Illinois Tool Works Inc. (NYSE: ITW) \u2014 Polymers & Fluids segment"], ["Founded", "ITW founded 1912; Plexus brand acquired/developed within ITW Performance Polymers"], ["Headquarters", "Glenview, IL (ITW corporate); Danvers, MA (ITW Performance Polymers)"], ["Revenue (est.)", "ITW $15.9B FY2024; Plexus structural adhesives est. <$200M"], ["Employees", "ITW ~44,000 globally"], ["Distribution", "Industrial distribution, specialty adhesive distributors, direct to OEM"], ["Chemistry", "2-part methacrylate (MMA) structural adhesives; no sealants or tapes"], ["Forza Verticals", "Transportation (primary), Composites (primary), Industrial (limited), Marine (limited)"]], "key_context": "Plexus is ITW Performance Polymers' flagship structural adhesive brand, built around 2-part methacrylate (MMA) chemistry that bonds composites, thermoplastics, and metals with minimal or no surface preparation. It is the specification standard for composite bonding in transportation OEM and marine fabrication. Plexus is a single-chemistry product line \u2014 they make no sealants, tapes, or spray adhesives. Their distribution goes through industrial channels with a markup layer. Forza's IC951 2-part acrylic and the Composites vertical compete directly in the same structural bonding space.", "overview": "ITW Plexus, a brand of ITW Performance Polymers (a division of Illinois Tool Works Inc.), produces 2-part methacrylate (MMA) structural adhesives for bonding metals, composites, thermoplastics, and dissimilar materials. The MA Series covers general structural bonding across speed and stiffness grades; the AO Series targets composite and transportation applications requiring impact resistance and fatigue endurance. Plexus products are sold through industrial and specialty adhesive distributors and directly to OEM accounts in transportation, marine, and composites fabrication. ITW Performance Polymers also carries Devcon (epoxy) and Fusor (automotive body repair) brands.", "brands_detail": [["Plexus MA Series", "MA300, MA310, MA320, MA420 \u2014 2-part MMA structural adhesive", "IC951"], ["Plexus AO Series", "AO420, AO610 \u2014 2-part MMA for composites and galvanized metal", "IC951"], ["Plexus MA205HV", "Rapid cure MMA for composites and electronics", "IC951"], ["Devcon (sister brand)", "Epoxy adhesives, putties, repair compounds", "R160 / R221"]], "assessment": "ITW Plexus is a focused competitor to Forza in structural adhesive applications within transportation OEM and composites fabrication. Their MMA chemistry performs well on no-prep bonding of dissimilar substrates \u2014 a genuine technical differentiator at the high end. Forza's IC951 2-part acrylic covers the core structural bonding application category at direct pricing. The competitive wedge is twofold: Forza is a direct manufacturer with no distribution markup, and Forza offers a complete bonding and sealing system (adhesive + sealant + tape) where Plexus is adhesive-only. Plexus' aerospace and high-performance transportation specs are difficult to displace once embedded.", "bottom_line": "Plexus wins on high-performance composite and metal bonding specs where MMA chemistry is specified. Forza wins on price, breadth, and direct manufacturer access. The battleground is the mid-market transportation and composites fabricator who is not aerospace-specced and can be moved on chemistry parity and total cost.", "wins": ["Direct manufacturer pricing vs ITW distribution markup", "Forza IC951 covers core MMA structural bonding category", "Forza adds canister spray capability Plexus cannot match", "Single-source adhesive + sealant + tape vs Plexus adhesive-only"], "moats": ["MMA chemistry specification in aerospace and transportation OEM \u2014 deeply embedded", "Primerless adhesion to Alodined aluminum \u2014 aerospace standard", "ITW engineering support and application testing", "Devcon epoxy sister brand extends ITW structural adhesive range"]}, {"id": "manus", "name": "Manus Products", "brands": "Manus-Bond STP / Silicone / PU", "hq": "Waconia, MN", "rev": "Independent / Private", "threat": "MODERATE-HIGH", "glance": [["Headquarters", "866 Industrial Blvd W, Waconia, MN 55387"], ["Ownership", "Independent, privately held, ISO 9001:2015"], ["In Business", "65+ years (est. ~1959)"], ["Core Business", "Sealants and adhesives only"], ["Phone", "1-800-99-CAULK"]], "overview": "Manus Products is an independent ISO 9001:2015-certified sealant and adhesive manufacturer in Waconia, Minnesota. In business for 65+ years, they are best known for their 75-AM STP polyether sealant family - a 30+ variant product line covering construction, transportation, industrial, and marine sealing applications. They sell through distributors across the Midwest and nationally.", "key_context": "Manus is the closest structural analog to Forza among all competitors - independent manufacturer, ISO 9001, Midwest-based, sealant/adhesive focused. The small Midwest manufacturer frame does not work against Manus. They will use it back. The differentiator is product breadth: Forza makes four product categories. Manus makes two.", "brands_detail": [["75-AM STP Polyether", "30+ variants: all-purpose, fast cure, fast skinning, high green strength, marine, concrete, NSF-61, UL listed, self-leveling", "ForzaSeal OS2, C-OS9, T-OS151, C-OS55"], ["77-AMP / 77-HR", "PU / modified PU transportation sealants", "ForzaSeal T-OA156, T-OS151"], ["Silicone / Hybrid", "73-A (FDA/USDA), 73-GP (GP silicone), 33-MS (ASTM C920 MS polymer)", "ForzaSeal OS35, OS45"], ["FW-15-NS Flex-Weld", "Epoxy hybrid, UV resistant, no primer required", "ForzaBond R160"], ["65-B Neoprene", "Neoprene contact adhesive", "ForzaBond IC933, TC453"]], "wins": ["Single-source: Forza supplies adhesive + sealant + tape + cleaner. Manus supplies two of four", "ForzaBond spray adhesives - IC/MC/TC/RC-series. Manus makes zero spray adhesives", "ForzaTape - 22 tape SKUs. Manus makes zero tapes", "RuggedRed cleaners. Manus has no cleaner line", "Marine vertical: Manus has no Marine products at all. Forza unchallenged", "Composites vertical: Manus has no Composites products. Forza unchallenged"], "moats": ["75-AM STP family depth - 30+ variants is a genuinely broad sealant library", "65+ years in the construction and transportation channel - strong shelf position", "ISO 9001:2015 certified - credible quality story", "Midwest manufacturer (Waconia, MN) - regional familiarity in similar territory", "NSF-61 potable water certification and UL listed variants on 75-AM", "Butyl, acrylic latex, foam sealant lines - categories Forza does not play in"], "assessment": "Manus is the most geographically relevant sealant competitor to Forza. Both are Midwest-based independent manufacturers serving the same construction, transportation, and industrial channels. The competitive conversation with Manus is not about quality or credibility - both earn that. It is about breadth. Manus's 75-AM family is deeper than Forza's STP/hybrid sealant line in terms of variant count, but the single-source argument neutralizes that advantage the moment the conversation expands beyond sealant.", "bottom_line": "Manus is a credible independent sealant manufacturer making the same quality Midwest manufacturer claim Forza makes. The differentiator is not chemistry or geography - it is the four-category portfolio. Forza makes what Manus makes, plus the spray adhesive, tape, and cleaner Manus cannot supply for the same job."}, {"id": "newstar", "name": "NewStar Adhesives", "brands": "EverStrong / EverHold / EverBond", "hq": "Massachusetts", "rev": "Independent / Private", "threat": "MODERATE", "glance": [["Headquarters", "Massachusetts (mfg in MA, GA, NC)"], ["Ownership", "Independent, privately held"], ["Founded", "Est. 1970s - specialty contact adhesive manufacturer"], ["Core Business", "Contact and spray adhesives only"], ["Brands", "EverStrong, EverHold, EverBond, Pionite, Nevamar"]], "overview": "NewStar Adhesives is an independent contact and spray adhesive manufacturer headquartered in Massachusetts with manufacturing in MA, GA, and NC. Their tagline is 'We do one thing and we do it well' - an accurate description of their business model. They sell through distributors nationally under the EverStrong (industrial) and EverHold (marine) brands, and supply adhesive under private-label arrangements including Pionite and Nevamar for the HPL laminate channel.", "key_context": "NewStar's tagline is 'We do one thing and we do it well.' That is an accurate description of their business - and the ceiling. Every contractor buying EverStrong still needs sealant, tape, and cleaner for the same job. NewStar cannot supply any of those. Forza supplies all four from one Iowa manufacturer.", "brands_detail": [["EverStrong Industrial", "ES10+, ES12 Non-Flam, ES15 High Tack, ES22 Low VOC, ES50 PSA, ES55 Fast Dry, ES60 EPS Foam, ES80 Heavy Duty, ES99/ES99 LVoc, ES40 EPS", "ForzaBond IC932, IC933, IC934, IC936, IC946, IC947, IC951"], ["EverHold Marine", "N600, N610, N614 (marine foam/upholstery), N620, N677 (structural laminating), N900, N901 (vacuum infusion/mold)", "ForzaBond MC722, MC723, MC724, MC736, MC737, MC741"], ["EverBond / Pionite / Nevamar", "Private-label OEM chemistry sold through HPL distribution - same EverStrong chemistry, distributor margin stacked on top", "ForzaBond IC-series direct at manufacturer pricing"], ["NCC Citrus Cleaner", "Basic adhesive cleaner", "RuggedRed Citrus Cleaner"]], "wins": ["Single-source: Forza supplies adhesive + sealant + tape + cleaner. NewStar can only supply one of four", "Iowa-made. NewStar manufactures in MA, GA, NC - no Midwest manufacturing", "ForzaBond IC-series covers every EverStrong application chemistry", "ForzaBond MC-series covers every EverHold marine application", "Forza has no canister return logistics dependency - standard shipping", "Distributors: Forza fills sealant, tape, cleaner gap NewStar leaves entirely"], "moats": ["EverStrong brand recognition in industrial and marine adhesive channel", "30+ years of adhesive-specialist positioning - 'one thing' story resonates", "EverHold well-established in marine fabrication shops", "Pionite/Nevamar HPL channel relationships are deeply entrenched"], "assessment": "NewStar is a legitimate adhesive competitor in the industrial and marine channel. Their EverStrong ES-series and EverHold N-series are well-regarded products with real market penetration. The competitive threat is limited to adhesive categories only - NewStar has zero presence in sealants, tapes, or industrial cleaners. The EverBond private-label dynamic is worth actively addressing in distributor conversations - most distributors carrying EverBond are unaware they are carrying NewStar chemistry at a margin tier below what they could achieve buying Forza direct.", "bottom_line": "NewStar does one thing well. Forza does four things well - including the one NewStar does. The single-source argument is the primary weapon. Every contractor buying NewStar adhesive is buying sealant, tape, and cleaner from someone else. That's the conversation."}, {"id": "quin", "name": "Quin Global Americas", "brands": "Tensorgrip / QDEK", "hq": "UK HQ / Omaha NE", "rev": "Global / Private", "threat": "HIGH", "glance": [["Global HQ", "UK-headquartered global manufacturer"], ["US Entity", "Quin Global Americas - Omaha, Nebraska"], ["Business Model", "Global spray adhesive manufacturer, 3 regional operations"], ["Core Brands", "Tensorgrip (Industrial/Marine/Transportation/Composites), QDEK (Roofing)"], ["Key Intel", "Canister system compatible with Forza hardware - zero equipment switching cost"]], "overview": "Quin Global Americas is the US entity of a UK-headquartered global spray adhesive manufacturer. Their US operation is based in Omaha, Nebraska - the same metro market as Forza in Council Bluffs, Iowa. They sell through 100+ US distributors under the Tensorgrip brand across industrial, marine, transportation, and composites markets, and under QDEK for commercial roofing.", "key_context": "CRITICAL FIELD INTELLIGENCE: Quin's canister gun system is compatible with Forza's hardware. A contractor or distributor currently running Tensorgrip adhesive can load ForzaBond in the same gun tomorrow - no hardware change, no new equipment. The switch from Tensorgrip to Forza is a product decision only, not an infrastructure decision.", "brands_detail": [["Tensorgrip P-Series Industrial", "P390 (non-flam), P307/P313 (low VOC CA), P308 (high tack), P315 (high temp), P322/P323 (fast dry PSA), P321 (EPS foam), P607 (Class A fire rated)", "ForzaBond IC932, IC933, IC934, IC936, IC946, IC947"], ["Tensorgrip M-Series Marine", "M87 (non-flam), M88 (GP marine), M70 (low VOC), M52/M50 (high temp PSA), M55/M31/M30 (infusion)", "ForzaBond MC722, MC723, MC724, MC736, MC739, MC741"], ["Tensorgrip EPO-Series Reefer", "EPO-ZF (zero-flam), EPO-CA (reefer repair), EPO-CAL (low VOC)", "ForzaBond TC452, TC453, TC456, TC466"], ["QDEK Roofing", "Commercial roofing spray adhesive - flat roofing insulation adhesive", "No Forza equivalent - do not compete in this category"]], "wins": ["Canister system compatibility - zero hardware switching cost. Switch is product decision only", "ForzaSeal: 24 sealant SKUs. Quin makes zero sealants - entire category unchallenged", "ForzaTape: 22 tape SKUs. Quin makes zero tapes - entire category unchallenged", "RuggedRed: Quin has no industrial cleaner brand", "Iowa-made. Quin is UK-headquartered, US sales office Omaha NE", "Single-source: adhesives + sealants + tapes + cleaners from one Iowa manufacturer"], "moats": ["Tensorgrip brand recognition in industrial and marine canister spray channel", "EPO-series has strong recognition in the reefer trailer repair sub-vertical", "Same Omaha metro - regional distributor relationships are real and established", "QDEK roofing adhesive: no Forza equivalent in commercial roofing spray", "100+ US/Americas distributors - real distribution footprint"], "assessment": "Quin Global Americas is Forza's most geographically acute competitor. Both operate in the Omaha/Council Bluffs metro. Both sell into the same Midwest distributor network, the same regional contractors, and the same industrial and marine fabrication accounts. The canister system compatibility is the most important piece of field intelligence in this entire brief - it eliminates the hardware-based switching cost for any Tensorgrip customer.", "bottom_line": "Quin is the closest adhesive competitor geographically and technically. The canister compatibility eliminates the primary switching barrier. The single-source argument is the conversion play. Lead with hardware compatibility, follow with sealant and tape, earn the adhesive conversation from there."}, {"id": "scigrip", "name": "SCIGRIP", "brands": "SCIGRIP / SG Series / SG200 / SG300 / SG5000 / SG7706", "hq": "Durham, NC (Americas); Wellingborough, UK (Scott Bader parent)", "rev": "Scott Bader ~\u00a3273M (~$340M) total; SCIGRIP est. <$100M", "threat": "MOD", "glance": [["Parent Company", "Scott Bader Company Ltd. (employee-owned, UK, founded 1921)"], ["Founded", "SCIGRIP Americas based in Durham, NC; Scott Bader acquired/developed brand"], ["Headquarters", "Durham, NC (SCIGRIP Americas); Wellingborough, UK (Scott Bader global)"], ["Revenue (est.)", "Scott Bader ~\u00a3273M (~$340M) total; SCIGRIP MMA adhesives est. <$100M"], ["Employees", "Scott Bader ~750 globally; SCIGRIP Americas est. <100"], ["Distribution", "Specialty adhesive distributors, direct to OEM, composites supply chain"], ["Chemistry", "2-part methacrylate (MMA) structural adhesives; acrylic cements; no sealants or tapes"], ["Forza Verticals", "Marine (primary), Composites (primary), Transportation (secondary), Industrial (limited)"]], "key_context": "SCIGRIP is the MMA structural adhesive brand of Scott Bader, a UK employee-owned specialty chemical company. SCIGRIP competes directly with ITW Plexus for the 2-part structural adhesive market in composites, marine, and transportation. Scott Bader also supplies composites resins and gelcoats through the Crystic brand, enabling a full composites system sell that SCIGRIP leverages in fabricator accounts. Like Plexus, SCIGRIP has no sealant or tape product line. Their SubstrateMatch tool creates specification stickiness at the design stage.", "overview": "SCIGRIP, the structural adhesive brand of Scott Bader Company Ltd., manufactures 2-part methacrylate (MMA) adhesives for structural bonding of composites, thermoplastics, and metals in marine, transportation, construction, and industrial applications. Key product lines include the SG200 series (10/20/40 minute working times for composites and thermoplastics), SG300 series (medium cure structural), SG5000 series (multi-substrate 1:1), SG230HV (composite and plastic bonding), and SG7706 (solid surface and sink clip bonding). Acrylic cements (SCIGRIP 3 and 16) serve the acrylic sign and display fabrication market. Scott Bader's parent composites portfolio (Crystic resins, gelcoats, Crestabond structural adhesives) extends the competitive footprint in composites fabricator accounts beyond SCIGRIP alone.", "brands_detail": [["SG200 Series", "SG200-10, SG200-20, SG200-40 \u2014 2-part MMA, varied working times", "IC951"], ["SG300 Series", "SG300-15 \u2014 medium cure high stiffness structural", "IC951"], ["SG230HV", "10:1 ratio MMA for composite and plastic bonding", "IC951"], ["SG5000-13", "1:1 ratio MMA multi-substrate bonding", "IC951"], ["SG7706", "Solid surface rodding/clip bonding MMA adhesive", "IC951"], ["SCIGRIP 3 / 16", "Acrylic solvent cements for sign and display fabrication", "IC932"]], "assessment": "SCIGRIP is a focused competitor in marine composites and transportation structural bonding \u2014 the same battleground as ITW Plexus. The Forza pitch against SCIGRIP is identical to the Plexus pitch: IC951 covers the same chemistry at direct manufacturer pricing, Forza adds sealant and tape on one account, and the distribution markup on a UK parent brand is real. Scott Bader's composites resin portfolio (Crystic) gives SCIGRIP a system sell angle into composites fabricators that is harder to displace than adhesive-only competitors. Focus displacement on accounts where the full composites system is not the selection driver.", "bottom_line": "SCIGRIP is the European alternative to Plexus in North American composites and marine accounts. The Forza wedge is the same for both: direct pricing, system breadth, and the displacement is easiest in non-spec-locked mid-market fabricators.", "wins": ["Direct manufacturer pricing vs Scott Bader UK distribution chain", "Forza IC951 covers same 2-part structural MMA category", "Single-source: adhesive + sealant + tape vs SCIGRIP adhesive-only", "No European parent markup in Forza pricing"], "moats": ["SCIGRIP + Crystic composites system sell \u2014 deep in composites fabricator accounts", "SubstrateMatch tool creates design-stage specification stickiness", "Scott Bader employee-owned positioning resonates with sustainability-focused buyers", "Strong marine and composites specification history"]}, {"id": "sika", "name": "Sika", "brands": "Sikaflex / SikaFast / Sika Aktivator / Sikasil", "hq": "Baar, Switzerland / Lyndhurst NJ", "rev": "CHF 11.76B", "threat": "HIGH", "glance": [["Headquarters", "Baar, Switzerland / US HQ: Lyndhurst, NJ"], ["Annual Revenue", "CHF 11.76 billion (2024)"], ["Employees", "34,000+ globally / 400+ facilities"], ["Business Model", "Full construction chemistry platform"], ["Out of Scope", "Concrete, roofing, waterproofing, flooring, pipeline"]], "overview": "Sika AG is a global specialty chemistry company headquartered in Baar, Switzerland. Their CHF 11.76 billion platform spans concrete admixtures, roofing, waterproofing, flooring, and pipeline alongside their adhesive and sealant brands. The rep calling on a transportation fabricator with Sikaflex is the same rep managing concrete admixtures and roofing systems on the next call.", "key_context": "Sika's CHF 11.76 billion construction chemistry platform spans concrete, roofing, waterproofing, flooring, and pipeline alongside Sikaflex. The rep calling on a transportation fabricator is the same rep managing concrete admixtures and roofing systems on the next call. Forza's entire operation is adhesives, sealants, and tapes. Specialist vs. line item.", "brands_detail": [["Sikaflex", "Sikaflex-252 (vehicle assembly), -221 (multi-purpose), -291 (marine), -292i (marine structural), -505 UV, -521 UV", "ForzaSeal T-OA156, OS2, M-OS789, M-OA755, C-OS55, T-OS151"], ["SikaFast", "SikaFast-3121, 3511, 3531, 3551 - 2-part toughened MMA structural", "ForzaBond IC951, TC471"], ["Sika Aktivator", "Aktivator-100, Aktivator-205 - IPA-based surface activators", "Forza OSA, T-OSA155, R-OSA, M-OSA783, C-OSA"], ["Sikasil", "GP-101, N Plus (neutral cure), AS-785 (automotive/transportation silicone)", "ForzaSeal OS35, OS37, OS45, TAC-OS75"]], "wins": ["Sika makes ZERO spray adhesives - ForzaBond IC/MC/TC/RC canister system unchallenged", "Sika makes ZERO tape products - ForzaTape 22 SKUs unchallenged", "RuggedRed: Sika has no industrial cleaner brand", "Iowa-made. Sika is Swiss-owned, US HQ Lyndhurst NJ - no Midwest manufacturing", "Single-source: adhesives + sealants + tapes + cleaners from one Iowa manufacturer", "Sikaflex-252 vs. T-OA156: same 1-part hybrid polymer chemistry, Forza direct pricing"], "moats": ["Sikaflex is one of the most recognized sealant brands in Transportation and Marine", "Sikaflex-252 is widely specified for vehicle assembly bonding", "Sikaflex-291 is the benchmark marine multi-purpose sealant in most marine shops", "SikaFast MMA structural is specified in composites and specialty vehicle OEM", "Concrete, roofing, waterproofing, flooring - categories entirely outside Forza"], "assessment": "Sikaflex is the most recognized sealant brand in the transportation and marine fabrication channel. Sikaflex-252 for vehicle assembly and Sikaflex-291 for marine multi-purpose are deeply entrenched shelf positions. Most fabricators have been on these products for years and have never evaluated a chemistry-equivalent alternative. The no-spray-adhesive gap is Sika's largest structural vulnerability. A marine fabricator or transportation OEM on Sikaflex is already buying spray adhesive from a second supplier on every job. That second supplier conversation is Forza's entry point.", "bottom_line": "Sikaflex is the benchmark sealant in Transportation and Marine. Forza's entry strategy is not to displace Sikaflex directly on the first call - it is to become the spray adhesive and tape supplier for the same job, then earn the sealant conversation. Sika cannot follow Forza into those categories."}, {"id": "silco", "name": "Silco", "brands": "Silco / Sil-Bond / Eco-Flex / Eco-Tite / Ultra-Flex", "hq": "Mentor, OH", "rev": "Private; est. <$30M", "threat": "LOW", "glance": [["Parent Company", "Private; no public parent"], ["Founded", "~1994 (30+ years in business)"], ["Headquarters", "Mentor, OH"], ["Revenue (est.)", "Private; estimated <$30M annual revenue"], ["Employees", "Small private manufacturer; est. <200"], ["Distribution", "Industrial and construction distributors; private label customers; Midwest focus"], ["Chemistry Focus", "Silicone (acetoxy, neutral cure) and hybrid STPE sealants; custom compounding; private label"], ["Forza Verticals", "Construction (primary), Industrial (limited), Transportation (limited)"]], "key_context": "Silco is a small, private Ohio sealant manufacturer specializing in silicone and hybrid (STPE) sealants for construction, industrial, and transportation assembly applications. Their key differentiator is custom compounding and private label capability \u2014 they will compound to spec and package under a distributor's or OEM's brand name. Silco has no adhesive, tape, or structural chemistry products. They are a LOW threat competitor with a narrow product line and limited geographic reach outside the Midwest.", "overview": "Silco Inc., founded in the 1990s and headquartered in Mentor, Ohio, manufactures custom-compounded silicone and hybrid sealants and adhesives for industrial and construction applications. Key product lines include Sil-Bond (acetoxy RTV silicone), Eco-Flex and Eco-Tite (STPE hybrid sealants), and Ultra-Flex (elastomeric construction sealants). Silco's private label and custom compounding business serves distributors and OEMs who want branded sealant products without maintaining their own manufacturing. Their color-matching capability is a meaningful differentiator with architectural and construction specifiers. Product line does not include adhesives, tapes, or structural bonding products.", "brands_detail": [["Sil-Bond RTV 4500", "Acetoxy cure RTV silicone high-strength sealant/adhesive", "OA13"], ["Eco-Flex 9500", "STPE hybrid sealant paintable and UV stable", "OA4"], ["Eco-Tite 5555", "1-part STPE hybrid medium modulus multipurpose sealant", "OA4"], ["Ultra-Flex", "Flexible elastomeric sealant construction and marine", "OS2"], ["Neutral Cure Silicones", "Low odor, non-corrosive, primerless silicone sealants", "OA13"], ["Siliconized Acrylic Latex", "Paintable water-based caulk for general construction", "OS2"]], "assessment": "Silco is a LOW threat competitor with a limited product line (sealants only), small company size, and primarily Midwest distribution. They compete with Forza in the construction and industrial sealant category through silicone and STPE hybrid chemistry. The private label business model makes them a supplier to other brands rather than a direct competitor in most channels. Forza's competitive advantage is system breadth (adhesive + sealant + tape), national coverage, and direct manufacturer pricing. Focus Forza displacement on non-private-label sealant accounts in the Construction and Industrial verticals.", "bottom_line": "Silco is a private label and regional specialty sealant player \u2014 not a system competitor. Displace them on standard sealant applications in Construction and Industrial. The private label accounts are a harder conversion and may not be worth the effort.", "wins": ["System breadth: adhesive + sealant + tape vs sealant-only", "National coverage vs Silco Midwest focus", "Direct manufacturer pricing vs Silco specialty sealant pricing", "Multiple production facilities vs single Ohio plant"], "moats": ["Custom compounding and private label \u2014 differentiated service model", "Color matching expertise for architectural sealant specs", "Established Midwest distribution relationships"]}, {"id": "tremco", "name": "Tremco", "brands": "Tremco / Vulkem / Spectrem / Dymonic / Tremsil / Willseal / Nudura / Dryvit", "hq": "Beachwood, OH", "rev": "Part of RPM CPG segment ~$3.1B", "threat": "HIGH", "glance": [["Parent Company", "RPM International (NYSE: RPM) \u2014 Construction Products Group"], ["Founded", "1928; acquired by RPM 1969"], ["Headquarters", "Beachwood, OH"], ["Revenue (est.)", "Part of RPM CPG segment ~$3.1B FY2026; Tremco sealants est. $500M+"], ["Employees", "Part of RPM's 17,800 total; Tremco CPG global"], ["Distribution", "Direct to commercial contractors, glazing contractors, specifiers; also through distributor"], ["Key Products", "Vulkem (PU), Dymonic (hybrid), Spectrem (silicone), Tremsil (silicone), Willseal (expansion joints)"], ["Forza Verticals", "Construction (primary), Transportation (OEM glazing), Industrial (limited), Insulation (limited)"]], "key_context": "Tremco is North America's foremost commercial sealant and waterproofing company and a direct competitor to Forza in the construction and transportation OEM sealant categories. Their business model is specification-driven \u2014 Tremco reps work with architects and specifiers to get Tremco products written into project specifications by brand name, creating a captive market. This is both their greatest strength and the sharpest Forza wedge: contractors who are spec-locked have no choice; those who are not can be approached on chemistry, ASTM performance parity, and direct pricing.", "overview": "Tremco Commercial Sealants & Waterproofing, a division of RPM International's Construction Products Group, is the dominant commercial sealant brand in North America with a product portfolio spanning polyurethane sealants (Vulkem series), hybrid/SMP sealants (Dymonic series), silicone sealants (Spectrem, Tremsil series), expansion joint systems (Willseal), and accessories. Tremco also owns Dryvit (EIFS), Nudura (insulated concrete forms), and Weatherproofing Technologies Inc. (WTI). Their commercial construction presence is reinforced by a technical services team that is deeply embedded with architects, glazing contractors, and building envelope specifiers across North America.", "brands_detail": [["Vulkem Series", "Vulkem 116, 45SSL, 921SS \u2014 1-part PU sealants, horizontal/vertical", "OA4 / OS35"], ["Dymonic Series", "Dymonic 100, FC \u2014 medium/high performance hybrid PU", "OA4 / OS2"], ["Spectrem Series", "Spectrem 1, 2, 3, 4-TS \u2014 silicone curtainwall and glazing", "OA13"], ["Tremsil Series", "Tremsil 200, 400, 600 \u2014 acetoxy and neutral-cure silicone", "OA12 / OA13"], ["Willseal", "Expansion joint sealants and foam systems", "OS2 / R221"], ["Tremco Accessories", "Tremco 440 Tape, 830, Acoustical Sealant, Gutter Seal", "T-305 / OS2"]], "assessment": "Tremco is a HIGH threat competitor to Forza in commercial construction and transportation OEM channels. Their specification lock creates structural advantages in commercial projects that are difficult to displace once established. Outside of specification-driven commercial construction, Forza competes directly on polyurethane and SMP sealant chemistry at direct manufacturer pricing. Tremco's waterproofing and roofing system capability is fully outside Forza's portfolio and should not be contested. Focus Forza displacement efforts on non-spec-locked contractors, transportation OEM accounts, and industrial buyers where Tremco's commercial specification model does not apply.", "bottom_line": "Tremco wins where they have written the spec. Forza wins where the buyer has freedom to choose. That is the entire battleground \u2014 identify whether a contractor is spec-locked or free, and position accordingly.", "wins": ["Direct manufacturer pricing vs Tremco commercial pricing", "Forza works through distribution \u2014 Tremco sometimes sells direct around it", "No spec-lock \u2014 Forza open pricing without architect gatekeeping", "Single-source: adhesive + sealant + tape on one PO", "Transportation OEM direct vs Tremco commercial channel bias"], "moats": ["Commercial specification lock \u2014 architects write Tremco by name into curtainwall specs", "Waterproofing and roofing systems \u2014 fully outside Forza portfolio", "Nudura ICF and Dryvit EIFS \u2014 complete building envelope system outside Forza scope", "Technical services team deeply embedded with specifiers"]}];

document.getElementById('skuInput').addEventListener('input',function(){
  var v=this.value;
  var isUpc=/^[0-9 ]+$/.test(v)&&v.replace(/[^0-9]/g,'').length>=6;
  if(v.length<2&&!isUpc){document.getElementById('skuResult').innerHTML='';return;}
  showRes(searchSKU(v).slice(0,10),v);
});
document.getElementById('skuBtn').addEventListener('click',function(){

  showRes(searchSKU(v),v);
});

function searchSKU(v){
  var q=nm(v);
  var clean=v.replace(/[^0-9]/g,'');
  if(clean.length>=6){
    var cleanNz=clean.replace(/^0+/,'');
    var upcName=UPC_BUILTIN[cleanNz]||UPC_BUILTIN[clean];
    if(!upcName){var repo=getRepo();var entry=repo[cleanNz]||repo[clean];if(entry)upcName=entry.name||'';}
    if(upcName){var upcMatches=SKU.filter(function(d){return nm(d.comp).indexOf(nm(upcName))>-1||nm(d.brand).indexOf(nm(upcName))>-1;});if(upcMatches.length)return upcMatches;}
  }
  var exact=SKU.filter(function(d){return nm(d.comp).indexOf(q)>-1||nm(d.brand).indexOf(q)>-1||nm(d.app).indexOf(q)>-1;});
  if(exact.length)return exact;
  var tokens=v.toLowerCase().split(/[^a-z0-9]+/).filter(function(t){return t.length>1;});
  if(!tokens.length)return [];
  return SKU.filter(function(d){var s=nm(d.comp)+' '+nm(d.brand)+' '+nm(d.app);return tokens.every(function(t){return s.indexOf(t)>-1;});});
}


function makeSortable(tbl){
  var ths=tbl.querySelectorAll('th');var sortCol=-1,sortDir='asc';
  ths.forEach(function(th,ci){th.style.cursor='pointer';th.style.userSelect='none';
    th.addEventListener('click',function(){
      if(sortCol===ci){sortDir=sortDir==='asc'?'desc':'asc';}else{sortCol=ci;sortDir='asc';}
      ths.forEach(function(t,ti){var base=t.textContent.replace(/ [▲▼]$/,'').trim();t.textContent=base+(ti===sortCol?' '+(sortDir==='asc'?'▲':'▼'):'');});
      var tbody=tbl.querySelector('tbody');var rows=Array.prototype.slice.call(tbody.querySelectorAll('tr'));
      rows.sort(function(a,b){var ac=a.cells[ci]?a.cells[ci].textContent.trim().toLowerCase():'';var bc=b.cells[ci]?b.cells[ci].textContent.trim().toLowerCase():'';var an=parseFloat(ac.replace(/[^0-9.-]/g,'')),bn=parseFloat(bc.replace(/[^0-9.-]/g,''));if(!isNaN(an)&&!isNaN(bn)){return sortDir==='asc'?an-bn:bn-an;}return sortDir==='asc'?ac.localeCompare(bc):bc.localeCompare(ac);});
      rows.forEach(function(r){tbody.appendChild(r);});
    });
  });
}

// SCAN
function processFile(file){
  if(!file)return;
  var el=document.getElementById('skuResult');
  el.innerHTML='';
  el.appendChild(mk('div','scan-processing','Reading barcode...'));
  var reader=new FileReader();
  reader.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      var c=document.getElementById('scanCanvas');
      var s=Math.min(1,1200/img.naturalWidth);
      c.width=Math.round(img.naturalWidth*s);
      c.height=Math.round(img.naturalHeight*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      var imgData=c.toDataURL('image/jpeg',0.5);
      lastUpc='';
      el.innerHTML='';
      el.appendChild(mk('div','scan-processing','Scanning...'));
      setTimeout(function(){
        try{
          var decoded=EANDecoder.decode(c);
          el.innerHTML='';
          if(decoded){lastUpc=decoded;handleScan(decoded,imgData);}
          else{showManualEntry(imgData,'',lastUpc);}
        }catch(e){el.innerHTML='';showManualEntry(imgData,'',lastUpc);}
      },50);
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}
document.getElementById('scanInput').addEventListener('change',function(){processFile(this.files&&this.files[0]);});

function handleScan(raw,imgData){
  var cl=raw.trim(),nz=cl.replace(/^0+/,'');
  var canonical=nz||cl;
  lastUpc=canonical;
  var repo=getRepo();
  var repoEntry=repo[canonical]||repo[cl]||null;
  var sn=UPC_BUILTIN[canonical]||UPC_BUILTIN[cl]||(repoEntry?repoEntry.name:null)||null;
  var el=document.getElementById('skuResult');el.innerHTML='';
  if(sn){
    var m=SKU.filter(function(d){return nm(d.comp).indexOf(nm(sn))>-1||nm(d.brand).indexOf(nm(sn))>-1;});
    if(m.length){
      document.getElementById('skuInput').value=sn;
      showSingle(m[0],el);
      var alreadySaved=UPC_BUILTIN[canonical]||UPC_BUILTIN[cl]||repoEntry;
      if(!alreadySaved){offerSave(canonical,m[0].comp,m[0].ind||'',imgData);}
      return;
    }
  }
  showManualEntry(imgData,/^[0-9]{8,14}$/.test(cl)?'':cl,lastUpc);
}

function showManualEntry(imgData,prefill,rawUpc){
  var el=document.getElementById('skuResult');el.innerHTML='';
  var wrap=mk('div','manual-wrap');
  if(imgData){
    wrap.appendChild(mk('div','manual-label','Captured image — type what you see:'));
    var img=mk('img','manual-img');img.src=imgData;wrap.appendChild(img);
  }
  wrap.appendChild(mk('div','manual-label','Barcode / UPC number (optional):'));
  var upcRow=mk('div','srow');upcRow.style.marginBottom='10px';
  var upcInp=mk('input','sinput');upcInp.type='tel';upcInp.placeholder='e.g. 051111072783';upcInp.value='';upcInp.style.fontFamily='monospace';
  upcRow.appendChild(upcInp);wrap.appendChild(upcRow);
  wrap.appendChild(mk('div','manual-label','Product name or SKU:'));
  var row=mk('div','srow');row.style.marginTop='0';
  var inp=mk('input','sinput');inp.type='text';inp.placeholder='e.g. Super 77, Sikaflex-252, H8000...';inp.value=prefill||'';
  var btn=mk('button','sbtn','Search');
  btn.addEventListener('click',function(){
    var v=inp.value.trim();if(!v)return;
    var upc=upcInp.value.replace(/[^0-9]/g,'');
    document.getElementById('skuInput').value=v;
    var m=searchSKU(v);
    el.innerHTML='';
    if(m.length){
      showSingle(m[0],el);
      offerSave(upc||'',m[0].comp,m[0].ind||'',imgData);
    } else {
      el.appendChild(mk('div','info','No match for "'+v+'". Try a different spelling.'));
    }
  });
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')btn.click();});
  row.appendChild(inp);row.appendChild(btn);wrap.appendChild(row);
  var retry=mk('label','retry-scan-btn');retry.setAttribute('for','scanInput');retry.textContent='Take Another Photo';
  wrap.appendChild(retry);
  el.appendChild(wrap);inp.focus();
}

function offerSave(upc,name,ind,imgData){
  if(upc&&getRepo()[upc])return;
  var bar=mk('div','save-bar');
  var isUpc=upc&&/^[0-9]{8,14}$/.test(upc);
  var lbl=isUpc?'Save UPC '+upc+' → "'+name+'" to repository?':'Save "'+name+'" to repository?';
  bar.appendChild(mk('div','save-label',lbl));
  var btn=mk('button','save-btn','Save');
  btn.addEventListener('click',function(){
    var repo=getRepo();
    var key=isUpc?upc:'name:'+nm(name);
    repo[key]={name:name,ind:ind,date:new Date().toLocaleDateString(),img:'',upc:isUpc?upc:'',rep:getRepName()||'Unknown'};
    try{localStorage.setItem('fz_upc',JSON.stringify(repo));}catch(e){}
    if(window.fbDb){
      try{window.fbDb.ref('upc_repo/'+key).set({name:name,ind:ind,date:new Date().toLocaleDateString(),upc:isUpc?upc:'',rep:getRepName()||'Unknown'});}catch(e){}
    }
    bar.innerHTML='';bar.appendChild(mk('span','save-label','✓ Saved! Synced across all devices.'));
    renderRepo();
  });
  bar.appendChild(btn);
  document.getElementById('skuResult').appendChild(bar);
}

function getRepo(){try{return JSON.parse(localStorage.getItem('fz_upc')||'{}');}catch(e){return {};}}

function renderRepo(){
  var wrap=document.getElementById('upcRepo');wrap.innerHTML='';
  var repo=getRepo(),keys=Object.keys(repo);
  var hdr=mk('div','upc-repo-hdr');

  hdr.appendChild(syncStatus);

  wrap.appendChild(hdr);
  if(!keys.length){wrap.appendChild(mk('div','upc-repo-empty','No products saved yet. Scan a competitor product and save the match.'));return;}
  var tbl=mk('table','vtbl'),thead=mk('thead'),hrow=mk('tr');
  ['UPC','Product','Forza Cross','Date','Rep'].forEach(function(h){hrow.appendChild(mk('th',null,h));});
  thead.appendChild(hrow);tbl.appendChild(thead);
  var tbody=mk('tbody');
  keys.forEach(function(key){
    var e=repo[key],tr=mk('tr');
    var hasUpc=e.upc||(key.indexOf('name:')===-1&&/^[0-9]+$/.test(key));
    var upcTd=mk('td',null,hasUpc?(e.upc||key):'—');
    if(!hasUpc)upcTd.style.color='#ccc';
    tr.appendChild(upcTd);
    tr.appendChild(mk('td',null,e.name||''));
    var indTd=mk('td','orange',e.ind||'-');
    if(e.ind){
      indTd.style.cursor='pointer';indTd.title='Tap to see full vertical cross';
      indTd.addEventListener('click',(function(ind){return function(){
        showTab('lookup');
        var el=document.getElementById('skuResult');el.innerHTML='';
        if(VC[ind]){
          var box=mk('div','result-box');
          box.appendChild(mk('div','r-brand','Forza Industrial'));
          box.appendChild(mk('div','r-sku',ind));
          box.appendChild(mk('div','r-app','Full vertical crosswalk'));
          var tbl2=mk('table','vtbl'),thead2=mk('thead'),hrow2=mk('tr');
          ['Vertical','Forza SKU'].forEach(function(h){hrow2.appendChild(mk('th',null,h));});
          thead2.appendChild(hrow2);tbl2.appendChild(thead2);
          var tbody2=mk('tbody');
          VO.forEach(function(v){
            var tr2=mk('tr');tr2.appendChild(mk('td',null,v));
            var val=VC[ind][v]||'',td=mk('td',val?'':'dim',val||'-');
            if(val&&VCOL[v]){td.style.fontWeight='700';td.style.color=VCOL[v];}
            tr2.appendChild(td);tbody2.appendChild(tr2);
          });
          tbl2.appendChild(tbody2);box.appendChild(tbl2);el.appendChild(box);
        } else {
          document.getElementById('skuInput').value=ind;document.getElementById('skuBtn').click();
        }
      };})(e.ind));
    }
    tr.appendChild(indTd);
    tr.appendChild(mk('td',null,e.date||''));
    tr.appendChild(mk('td',null,e.rep||'-'));
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);makeSortable(tbl);wrap.appendChild(tbl);
}

      thead.appendChild(hrow);tbl.appendChild(thead);
      var tb=mk('tbody');c.crosswalk.forEach(function(r){var tr=mk('tr');tr.appendChild(mk('td',null,r.sku));tr.appendChild(mk('td',null,r.app));tr.appendChild(mk('td','orange',r.ind));tb.appendChild(tr);});
      tbl.appendChild(tb);makeSortable(tbl);dp.appendChild(tbl);
    }
    var swg=mk('div','sw-grid');
    var wb=mk('div','sw-box');wb.appendChild(mk('div','sw-label sw-win','Where Forza Wins'));c.wins.forEach(function(w){wb.appendChild(mk('div','sw-item win',w));});swg.appendChild(wb);
    if(c.moats&&c.moats.length){var mb=mk('div','sw-box');mb.appendChild(mk('div','sw-label sw-gap','Do Not Fight These'));c.moats.forEach(function(m){mb.appendChild(mk('div','sw-item gap',m));});swg.appendChild(mb);}
    dp.appendChild(swg);det.appendChild(dp);

  } else if(view==='crosswalk'){
    var dp=mk('div','dp');
    dp.appendChild(mk('div','dp-title',c.name+' — Full SKU Crosswalk'));
    dp.appendChild(mk('div','dp-meta',c.brands));
    // Pull ALL SKUs for this competitor from the global SKU array by matching brand name
    var compName=c.name.toLowerCase().replace(/[^a-z0-9]/g,' ').trim();
    var allSkus=SKU.filter(function(s){
      var brand=s.brand.toLowerCase().replace(/[^a-z0-9]/g,' ').trim();
      return brand===compName||brand.indexOf(compName)>-1||compName.indexOf(brand)>-1;
    });
    if(allSkus.length){
      var tbl=mk('table','vtbl'),thead=mk('thead'),hrow=mk('tr');
      ['Competitor SKU','Application','Forza Equivalent'].forEach(function(h){hrow.appendChild(mk('th',null,h));});
      thead.appendChild(hrow);tbl.appendChild(thead);
      var tb=mk('tbody');allSkus.forEach(function(s){var tr=mk('tr');tr.appendChild(mk('td',null,s.comp));tr.appendChild(mk('td',null,s.app));tr.appendChild(mk('td','orange',s.ind));tb.appendChild(tr);});
      tbl.appendChild(tb);makeSortable(tbl);dp.appendChild(tbl);
      dp.appendChild(mk('div','info',allSkus.length+' SKUs shown. For complete crosswalk documents, see the Documents tab.'));
    } else {
      dp.appendChild(mk('div','info','No SKUs found for this competitor. Use SKU Lookup tab to search by product name.'));
    }
    det.appendChild(dp);
  }
}


function buildFG(){
  var el=document.getElementById('fgContent');el.innerHTML='';
  var sel=mk('div','fg-selector');
  FG.forEach(function(g,i){
    var btn=mk('button','fg-btn',g.name);
    btn.style.background=i===fgG?g.color:'#fff';btn.style.color=i===fgG?'#fff':'#333';btn.style.borderColor=i===fgG?g.color:'';
    btn.addEventListener('click',(function(idx){return function(){fgG=idx;fgC=0;buildFG();};})(i));sel.appendChild(btn);
  });
  el.appendChild(sel);
  var g=FG[fgG];
  el.appendChild(mk('div','fg-guide-title',g.name+' Field Substitution Guide'));
  el.appendChild(mk('div','fg-guide-sub',g.subtitle));
  var ct=mk('div','fg-comp-tabs');
  g.tabs.forEach(function(t,i){
    var btn=mk('button','fg-comp-btn',t.comp);
    btn.style.background=i===fgC?g.color:'';btn.style.color=i===fgC?'#fff':'';btn.style.borderColor=i===fgC?g.color:'';
    btn.addEventListener('click',(function(idx){return function(){fgC=idx;buildFG();};})(i));ct.appendChild(btn);
  });
  el.appendChild(ct);
  var isFas=g.name==='Fastenal',tab=g.tabs[fgC];
  tab.sections.forEach(function(sec){
    var w=mk('div','fg-section');w.appendChild(mk('div','fg-section-label',sec.label));
    var tbl=mk('table','fg-tbl'),thead=mk('thead'),hr=mk('tr');
    (isFas?['Competitor SKU','Application','Forza Industrial','Forza Transportation']:['Competitor SKU','Application','Forza Marine']).forEach(function(h){hr.appendChild(mk('th',null,h));});
    thead.appendChild(hr);tbl.appendChild(thead);
    var tb=mk('tbody');
    sec.rows.forEach(function(row){var tr=mk('tr');tr.appendChild(mk('td',null,row[0]));tr.appendChild(mk('td',null,row[1]));tr.appendChild(mk('td','fg-f',row[2]||'-'));if(isFas)tr.appendChild(mk('td','fg-t',row[3]||'-'));tb.appendChild(tr);});
    tbl.appendChild(tb);makeSortable(tbl);w.appendChild(tbl);el.appendChild(w);
  });
}

var aDocF='all';
function buildDocs(){
  var q=nm(document.getElementById('docSearch').value||'');
  var fl=DOCS.filter(function(d){return(aDocF==='all'||d.t===aDocF)&&(!q||nm(d.n).indexOf(q)>-1||nm(d.c).indexOf(q)>-1||nm(d.d).indexOf(q)>-1);});
  document.getElementById('docCount').textContent=fl.length+' of '+DOCS.length+' documents';
  var list=document.getElementById('docList');list.innerHTML='';
  if(!fl.length){list.appendChild(mk('div','info','No documents match your search.'));return;}
  fl.forEach(function(d){
    var row=mk('div','drow'),info=mk('div','dinfo');
    info.appendChild(mk('div','dname',d.n));info.appendChild(mk('div','dmeta',d.c+' - '+d.d));
    row.appendChild(info);var right=mk('div','dright');
    right.appendChild(mk('span','dbadge b-'+d.t,TL[d.t]||d.t));
    var link=mk('a','dopen','Open');link.href=d.url;link.target='_blank';right.appendChild(link);
    row.appendChild(right);list.appendChild(row);
  });
}
document.getElementById('docSearch').addEventListener('input',function(){buildDocs();});
document.querySelectorAll('.fbtn').forEach(function(btn){
  btn.addEventListener('click',function(){
    aDocF=this.getAttribute('data-f');
    document.querySelectorAll('.fbtn').forEach(function(b){b.classList.remove('active');});
    this.classList.add('active');buildDocs();
  });
});

function buildVerts(){
  var grid=document.getElementById('vertGrid');grid.innerHTML='';
  VERT.forEach(function(v,i){
    var card=mk('div','vcard'+(aV===i?' sel':'')+(v.dark?' vc-dark':''));
    card.style.background=v.color;
    card.appendChild(mk('div','vc-label',v.name));card.appendChild(mk('div','vc-count',String(v.skus.length)));card.appendChild(mk('div','vc-sub','SKUs'));
    card.addEventListener('click',(function(idx){return function(){selVert(idx);};})(i));
    grid.appendChild(card);
  });
  if(aV!==null)showVD(aV);
}
function selVert(i){aV=i;document.querySelectorAll('.vcard').forEach(function(c,j){c.classList.toggle('sel',i===j);});showVD(i);}
function showVD(i){
  var v=VERT[i],isI=v.name==='Industrial',det=document.getElementById('vertDetail');det.innerHTML='';
  var dp=mk('div','dp');dp.style.marginTop='0';
  var title=mk('div','dp-title');title.textContent=v.name+' Vertical - '+v.skus.length+' SKUs';title.style.color=v.color;dp.appendChild(title);
  var skuColors={'Industrial':'#F16A26','Transportation':'#B83D35','Marine':'#137875','Construction':'#8B6914','Insulation':'#D0157D','Composites':'#888'};
  var tbl=mk('table','vtbl'),thead=mk('thead'),hrow=mk('tr');
  hrow.appendChild(mk('th',null,'Forza SKU'));hrow.appendChild(mk('th',null,'Description'));
  if(!isI)hrow.appendChild(mk('th',null,'Industrial Equivalent'));
  thead.appendChild(hrow);tbl.appendChild(thead);
  var tbody=mk('tbody');
  var filteredSkus=isI?v.skus:v.skus.filter(function(s){return IE[s.s]&&IE[s.s]!=='';});
  filteredSkus.forEach(function(s){
    var tr=mk('tr');
    var skuTd=mk('td',null,s.s);skuTd.style.fontWeight='700';skuTd.style.color=skuColors[v.name]||v.color;
    tr.appendChild(skuTd);tr.appendChild(mk('td',null,s.d));
    if(!isI){var ieq=IE[s.s]||'';var ieqTd=mk('td',ieq?'':'dim',ieq||'-');if(ieq){ieqTd.style.fontWeight='700';ieqTd.style.color='#F16A26';}tr.appendChild(ieqTd);}
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);makeSortable(tbl);dp.appendChild(tbl);det.appendChild(dp);
}

// REP NAME
var REP_NAME_KEY='fz_rep_name';
function getRepName(){return localStorage.getItem(REP_NAME_KEY)||'';}
function setRepName(name){localStorage.setItem(REP_NAME_KEY,name);}
function showRepBadge(name){
  var title=document.getElementById('appTitle');
  if(title&&!title.querySelector('.rep-badge')){
    var badge=mk('span','rep-badge','• '+name);title.appendChild(badge);
  }
}
function initRepModal(){
  if(!isMobile()){return;}
  var name=getRepName();
  if(name){showRepBadge(name);return;}
  var modal=document.getElementById('repModal');
  if(modal)modal.classList.add('active');
  var inp=document.getElementById('repNameInput');
  var btn=document.getElementById('repNameBtn');
  btn.addEventListener('click',function(){
    var n=inp.value.trim();if(!n)return;
    setRepName(n);
    modal.classList.remove('active');
    showRepBadge(n);
  });
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')btn.click();});
  setTimeout(function(){inp.focus();},100);
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',function(){buildDocs();initRepModal();renderRepo();});}
else{buildDocs();initRepModal();renderRepo();}
</script>
